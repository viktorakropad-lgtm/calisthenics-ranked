<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calisthenics Ranked</title>
<meta name="theme-color" content="#0b0d17">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ranked">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<style>html,body{margin:0;background:#0b0d17}</style>
<script>window.APP_VERSION = "0.2-64c232";</script>
</head>
<body>
<style>
:root {
  color-scheme: dark;
  /* encre bleu-violet, jamais noir pur */
  --bg: #0b0d17;
  --bg-2: #0f1220;
  --surface: #151929;
  --surface-2: #1b2033;
  --surface-3: #242a42;
  --line: #2b3250;
  --line-soft: #1f2540;
  --text: #eceff8;
  --text-2: #b4bbd3;
  --text-3: #8d95b2;
  --on-accent: #0b0d17;
  --focus: #dbe6ff;
  --ok: #55d6a2;
  --ok-bg: #12301f;
  --warn: #f3bb55;
  --warn-bg: #33270e;
  --bad: #ff7b7b;
  --bad-bg: #38161a;
  --shadow: 0 12px 34px rgba(3, 4, 12, .5);
  --overlay: rgba(6, 7, 14, .92);
  --scrim: rgba(5, 6, 12, .66);
  --ink: #04050b;
  --glint: #ffffff;

  /* figure anatomique et mannequin */
  --body: #232942;
  --mus: #38415f;
  --figline: #10131f;
  --mq: #5f6b97;
  --mq-far: #3f486b;
  --mq-floor: #3a4266;
  --mq-bar: #a3acd1;
  --mq-wall: #1b2040;

  /* camera simulee */
  --cam-1: #0e1224;
  --cam-2: #05060d;
  --cam-grid: #1a2040;
  --cam-line: #6df0c8;

  /* palettes d'emblemes: un jeu de tokens par rang */
  --rk-rookie: #959bb3; --rk-rookie-hi: #d3d8e8; --rk-rookie-lo: #4b5168; --rk-rookie-glow: #aab0c8;
  --rk-bronze: #c27a3a; --rk-bronze-hi: #efb07a; --rk-bronze-lo: #6b3a16; --rk-bronze-glow: #dc9150;
  --rk-argent: #b4bece; --rk-argent-hi: #f4f7fc; --rk-argent-lo: #5c687e; --rk-argent-glow: #d6deee;
  --rk-or: #e3b43d; --rk-or-hi: #ffe493; --rk-or-lo: #85600f; --rk-or-glow: #f5cd55;
  --rk-platine: #3fd3e3; --rk-platine-hi: #bcf5fb; --rk-platine-lo: #156d7b; --rk-platine-glow: #4de5f5;
  --rk-diamant: #80c6ff; --rk-diamant-hi: #e6f5ff; --rk-diamant-lo: #2d68a8; --rk-diamant-glow: #a3d8ff;
  --rk-maitre: #9b74ff; --rk-maitre-hi: #dacbff; --rk-maitre-lo: #442890; --rk-maitre-glow: #b194ff;
  --rk-grand_maitre: #ec4a42; --rk-grand_maitre-hi: #ffa598; --rk-grand_maitre-lo: #7a1512; --rk-grand_maitre-glow: #ff6455;
  --rk-titan: #ffae2e; --rk-titan-hi: #fff2bd; --rk-titan-lo: #9a5200; --rk-titan-glow: #ffc552;
  --rk-immortel: #86e9ff; --rk-immortel-hi: #effcff; --rk-immortel-lo: #3f7db0; --rk-immortel-glow: #a9f3ff;
  --rk-immortel-a: #62f0ff; --rk-immortel-b: #ff72dc; --rk-immortel-c: #ffe071; --rk-immortel-d: #82ffa6;

  /* accent courant: pris sur le rang du joueur (regle par le script) */
  --accent: var(--rk-rookie);
  --accent-hi: var(--rk-rookie-hi);
  --accent-lo: var(--rk-rookie-lo);
  --accent-glow: var(--rk-rookie-glow);

  --f-display: 'Saira Condensed', 'Bahnschrift', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Barlow', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 9px;
  --tabbar-h: 64px;
  --col: 640px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 700; letter-spacing: .02em; line-height: 1.05; }
h1 { font-size: 40px; text-transform: uppercase; }
h2 { font-size: 30px; text-transform: uppercase; }
h3 { font-size: 22px; }
p { margin: 0 0 10px; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }
.defs-svg { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- mise en page ---------- */
.app { max-width: var(--col); margin: 0 auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); overflow-x: clip; }
.app[data-immersive="1"] { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 0; }
.top .sp { flex: 1; min-width: 0; }
.topnav { display: none; }
main { outline: none; padding-bottom: 12px; }
.stack > * + * { margin-top: 16px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(3, 1fr);
  background: var(--bg-2); border-top: 1px solid var(--line);
  padding-top: 4px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.app[data-immersive="1"] ~ .tabbar { display: none; }
.tab {
  appearance: none; background: none; border: 0; border-top: 3px solid transparent; color: var(--text-3); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 56px; padding: 6px 0 4px; font-weight: 600; font-size: 13.5px; letter-spacing: .02em; margin-top: -4px;
}
.tab svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
@media (min-width: 768px) {
  .tabbar { display: none; }
  .app { padding-bottom: 60px; }
  .app[data-immersive="1"] { padding-bottom: 130px; }
  .topnav { display: flex; gap: 6px; }
  .topnav .tab { flex-direction: row; gap: 8px; min-height: 46px; padding: 6px 16px; border: 0; border-radius: 12px; margin: 0; font-size: 16px; }
  .topnav .tab svg { width: 22px; height: 22px; }
  .topnav .tab[aria-current="page"] { background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--accent); }
  .app[data-immersive="1"] .topnav { visibility: hidden; }
  .app { max-width: 860px; }
  main { max-width: var(--col); margin-inline: auto; }
}
@media (min-width: 768px) and (max-width: 959px) {
  .topnav { gap: 2px; }
  .topnav .tab { padding: 6px 10px; font-size: 15px; gap: 6px; }
  .top { gap: 8px; }
}

/* ---------- boutons ---------- */
.btn {
  appearance: none; cursor: pointer; font-weight: 700; letter-spacing: .02em; font-size: 17px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 10px 22px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text); text-decoration: none;
}
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-size: 19px; min-height: 58px; }
.btn.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 44px; padding: 6px 16px; font-size: 15px; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg, .ibtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ibtn {
  appearance: none; cursor: pointer; width: 46px; height: 46px; flex: none; display: grid; place-items: center; padding: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 50%; color: var(--text-2);
}
.ibtn:hover { color: var(--text); background: var(--surface-2); }
.avatar { border-color: var(--accent); color: var(--accent); background: var(--surface); }
.link { appearance: none; background: none; border: 0; padding: 10px 6px; min-height: 44px; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 15.5px; }
.link:hover { color: var(--text); }

/* ---------- pastille de niveau ---------- */
.lvl {
  display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 4px 18px 4px 8px;
  border-radius: 99px; background: var(--surface); border: 1px solid var(--line);
  font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap;
}
.lvl svg.emblem { width: 32px; height: 32px; }
.lvl b { color: var(--accent); font-weight: 700; }

/* ---------- carte "Continuer" ---------- */
.go {
  appearance: none; width: 100%; text-align: left; cursor: pointer; color: inherit;
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px;
  padding: 22px 20px 22px 24px; min-height: 140px;
  border-radius: 26px; border: 1px solid var(--accent-lo);
  background:
    radial-gradient(110% 130% at 100% 0%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 62%),
    var(--surface);
  box-shadow: var(--shadow);
}
.go:hover { border-color: var(--accent); }
.go .kick { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.go .nm { font-family: var(--f-display); font-weight: 800; font-size: clamp(32px, 9vw, 44px); line-height: 1; text-transform: uppercase; margin-top: 4px; }
.go .gl { color: var(--text-2); margin-top: 8px; font-size: 18px; }
.go .thumb { width: 74px; }
.go .thumb .body-fig { width: 74px; height: auto; }

/* ---------- familles ---------- */
.fams { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.fam {
  appearance: none; cursor: pointer; text-align: left; color: inherit; position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; min-height: 146px; padding: 16px 16px 14px;
  border-radius: var(--r-lg); border: 1px solid var(--line-soft); background: var(--surface);
}
.fam:hover { border-color: var(--accent-lo); background: var(--surface-2); }
.fam .ic { width: 34px; height: 34px; stroke: var(--accent); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.fam .lb { font-family: var(--f-display); font-weight: 800; font-size: 30px; text-transform: uppercase; letter-spacing: .03em; line-height: 1; }
.fam .sil { position: absolute; right: 14px; top: 12px; bottom: 12px; display: flex; }
.fam .sil .body-fig { height: 100%; width: auto; }
.fam.wide { grid-column: 1 / -1; min-height: 118px; }
.fam.wide .sil { right: 22px; }

/* ---------- liste d'exercices ---------- */
.sub { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 8px 0; }
.sub h1 { font-size: 34px; flex: 1; min-width: 0; line-height: 1; }
.list { display: grid; gap: 12px; }
.ex {
  appearance: none; cursor: pointer; width: 100%; text-align: left; color: inherit;
  display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px; min-height: 92px; padding: 10px 14px;
  border-radius: var(--r-lg); border: 1px solid var(--line-soft); background: var(--surface);
}
.ex:hover { background: var(--surface-2); border-color: var(--accent-lo); }
.ex .thumb { width: 56px; }
.ex .thumb .body-fig { width: 56px; height: auto; }
.ex .nm { font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1.05; }
.ex .tg { color: var(--accent); font-size: 15.5px; font-weight: 600; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
.ex .tg svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex .ch { width: 24px; height: 24px; stroke: var(--text-3); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex.locked { opacity: .5; background: var(--bg-2); }
.ex.locked .tg { color: var(--text-3); }
.sw {
  appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 12px; min-height: 46px; padding: 4px 4px;
  background: none; border: 0; color: var(--text-2); font-size: 16px;
}
.sw .tr { width: 46px; height: 28px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line); position: relative; flex: none; }
.sw .tr::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text-3); transition: transform .18s ease, background .18s ease; }
.sw[aria-checked="true"] .tr { background: var(--accent-lo); border-color: var(--accent); }
.sw[aria-checked="true"] .tr::after { transform: translateX(18px); background: var(--accent-hi); }

/* ---------- ecran d'un exercice ---------- */
.seg { display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 4px; border-radius: 99px; background: var(--bg-2); border: 1px solid var(--line-soft); }
.seg button { appearance: none; border: 0; background: none; cursor: pointer; min-height: 40px; padding: 4px 20px; border-radius: 99px; font-weight: 700; font-size: 15.5px; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.stage { background: radial-gradient(80% 70% at 50% 40%, var(--surface-2), var(--surface)); border: 1px solid var(--line-soft); border-radius: var(--r-lg); padding: 14px 12px 12px; display: grid; justify-items: center; gap: 10px; }
.stage .bodies { display: flex; justify-content: center; gap: 4px; width: 100%; }
.stage .bodies .body-fig { width: min(44%, 210px); height: auto; filter: drop-shadow(0 6px 10px var(--scrim)); }
.worked { font-size: 15.5px; color: var(--text-2); text-align: center; line-height: 1.35; }
.worked b { color: var(--accent); font-weight: 700; }
.mq-wrap { width: 100%; display: grid; gap: 10px; justify-items: center; }
.mq-svg { width: min(100%, 360px); height: auto; background: var(--bg-2); border-radius: var(--r-md); border: 1px solid var(--line-soft); }
.mq-ctl { display: flex; align-items: center; gap: 12px; width: min(100%, 360px); }
.mq-ctl input[type=range] { flex: 1; min-width: 0; }
.mq-nm { font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .03em; min-height: 26px; text-align: center; }
.mq-posebar { display: flex; gap: 6px; width: min(100%, 360px); }
.mq-posebar i { flex: 1; height: 5px; border-radius: 4px; background: var(--surface-3); }
.mq-posebar i.on { background: var(--accent); }
.note { font-size: 14.5px; color: var(--text-3); text-align: center; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: center; font-size: 19px; line-height: 1.3; min-height: 44px; }
.steps li::before { content: counter(s); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--on-accent); background: var(--accent); }
.err { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: var(--warn-bg); color: var(--text); border: 1px solid var(--warn); font-size: 16.5px; }
.err svg { width: 24px; height: 24px; stroke: var(--warn); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; margin-top: 1px; }
.err b { display: block; color: var(--warn); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.chip-t { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 2px 14px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 15.5px; }
.chip-t svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.cta > * { max-width: var(--col); margin: 0 auto; display: flex; }
.cta .btn { width: 100%; }
.cta .why { justify-content: center; color: var(--text-3); font-size: 14.5px; padding-bottom: 6px; }

/* ---------- feuilles (sheets) ---------- */
.sheet-root { position: fixed; inset: 0; z-index: 80; display: grid; align-items: end; justify-items: center; }
.sheet-back { position: absolute; inset: 0; background: var(--scrim); border: 0; width: 100%; cursor: default; animation: fadeIn .2s ease both; }
.sheet {
  position: relative; width: min(100%, 560px); max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0; box-shadow: var(--shadow);
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  animation: sheetUp .28s cubic-bezier(.2, .9, .3, 1) both;
}
.sheet .grab { width: 44px; height: 5px; border-radius: 4px; background: var(--line); margin: 6px auto 14px; }
.sheet h2 { font-size: 30px; margin-bottom: 12px; }
.sheet .row { display: flex; gap: 12px; align-items: center; }
.sheet .acts { display: grid; gap: 10px; margin-top: 18px; }
.sheet .closeb { position: absolute; right: 12px; top: 12px; }
.lines { display: grid; gap: 10px; margin: 0 0 6px; padding: 0; list-style: none; }
.lines li { display: grid; grid-template-columns: 8px 1fr; gap: 12px; align-items: start; font-size: 18px; }
.lines li::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 9px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; margin: 14px 0; font-size: 18px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; text-align: right; font-weight: 700; }
.kv dd .up { color: var(--ok); }
.big { font-family: var(--f-display); font-weight: 800; font-size: 56px; line-height: 1; text-transform: uppercase; }
.big small { font-size: 28px; color: var(--text-2); font-weight: 600; }
.trophy-note { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); font-weight: 600; }
.trophy-note svg { width: 28px; height: 28px; stroke: var(--accent); fill: none; stroke-width: 1.9; flex: none; stroke-linecap: round; stroke-linejoin: round; }
.notice { padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); font-size: 16.5px; }
.notice.bad { border-color: var(--bad); background: var(--bad-bg); }
.notice.ok { border-color: var(--ok); background: var(--ok-bg); }
.slider-row { margin: 10px 0 6px; }
.slider-row label { display: block; font-size: 18px; margin-bottom: 8px; }
.slider-row label b { font-size: 30px; font-family: var(--f-display); color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 36px; }
.bar { height: 14px; border-radius: 9px; background: var(--surface-3); overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--accent-lo), var(--accent), var(--accent-hi)); transition: width .5s ease; }

/* ---------- apercu camera (simulation) ---------- */
.live { position: fixed; inset: 0; z-index: 70; display: grid; grid-template-rows: minmax(0, 1fr); background: var(--bg); color: var(--text);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }

/* ============================================================
   core.js : logique pure du classement (aucun acces au DOM).
   Fonctions pures reprises de prototype/src/parts/core.js (ELO depuis les
   standards, lissage, categories, ELO global, barre de points, promotion).
   Retire: video, IA simulee, profil de demonstration, decroissance affichee.
   Les standards viennent de data/standards.json (brouillon, a calibrer).
   ============================================================ */
const Core = (() => {
  'use strict';
  const DAY = 86400000;
  const HOUR = 3600000;
  const RANKS = RANKS_DATA;
  const RID = RANKS.map(r => r.id);
  const CATS = ['push', 'pull', 'legs', 'core', 'skills'];
  const CAT_LABEL = { push: 'Pousser', pull: 'Tirer', legs: 'Jambes', core: 'Abdos', skills: 'Skills' };
  const EX = {};
  STANDARDS.exercises.forEach(e => { EX[e.id] = e; });

  /* ---------- rangs ---------- */
  const rIdx = id => RID.indexOf(id);
  const rStart = id => RANKS[rIdx(id)].elo_start;
  const rEnd = id => { const r = RANKS[rIdx(id)]; return r.elo_end == null ? r.cap : r.elo_end; };
  const rName = id => RANKS[rIdx(id)].name;
  const nextRank = id => (rIdx(id) < RID.length - 1 ? RID[rIdx(id) + 1] : null);
  function rankOfElo(e) {
    let k = 0;
    for (let i = 0; i < RANKS.length; i++) if (e >= RANKS[i].elo_start) k = i;
    return RANKS[k].id;
  }
  const minRank = (a, b) => (rIdx(a) <= rIdx(b) ? a : b);
  /* niveau = rang: Niveau 1 = Rookie ... Niveau 10 = Immortel */
  const levelOf = rankId => rIdx(rankId) + 1;
  const rankOfLevel = L => RID[Math.max(1, Math.min(10, L)) - 1];

  /* ---------- ELO d'une performance ---------- */
  function anchorPts(anchors) {
    const pts = [];
    for (let i = 1; i < RANKS.length; i++) {
      const v = anchors ? anchors[RANKS[i].id] : null;
      if (typeof v === 'number') pts.push({ id: RANKS[i].id, elo: RANKS[i].elo_start, a: v });
    }
    return pts;
  }
  function eloFromAnchors(anchors, p) {
    const pts = anchorPts(anchors);
    if (!pts.length || !(p > 0)) return 0;
    if (p < pts[0].a) return pts[0].elo * p / pts[0].a;
    for (let i = 0; i < pts.length - 1; i++) {
      if (p < pts[i + 1].a) {
        return pts[i].elo + (pts[i + 1].elo - pts[i].elo) * (p - pts[i].a) / (pts[i + 1].a - pts[i].a);
      }
    }
    const L = pts[pts.length - 1];
    if (p === L.a) return L.elo;
    const Pm = pts.length > 1 ? pts[pts.length - 2] : null;
    const span = Pm ? (L.a - Pm.a) : L.a;
    return Math.min(3600, L.elo + 300 * (p - L.a) / span);
  }
  function perfForElo(anchors, elo) {
    const pts = anchorPts(anchors);
    if (!pts.length || !(elo > 0)) return 0;
    if (elo < pts[0].elo) return pts[0].a * elo / pts[0].elo;
    for (let i = 0; i < pts.length - 1; i++) {
      if (elo < pts[i + 1].elo) {
        return pts[i].a + (pts[i + 1].a - pts[i].a) * (elo - pts[i].elo) / (pts[i + 1].elo - pts[i].elo);
      }

  /* ---------- skills tenus en variantes ---------- */
  const LADDER_FAMILY = { planche: 'Planche', front_lever: 'Front lever' };

  /* ---------- mise a jour de l'ELO d'un exercice (lissage) ---------- */
  function replayExercise(atts) {

      const ep = a.eloPerf;
      const before = elo;

  /* ---------- decroissance (30 j sans pratique: rien; au-dessus de Platine: -10 par semaine apres 60 j) ---------- */

  /* ---------- categories et ELO global ---------- */
  function computeCats(effMap) {

      const list = Object.keys(effMap).filter(id => EX[id] && EX[id].category === c)
        .sort((a, b) => effMap[b] - effMap[a]);
      if (!list.length) { cats[c] = { ranked: false, elo: null, n: 0, need, list: [], incomplete: false }; continue; }
      const top = list.slice(0, need);

  /* ---------- barre de points ---------- */

  /* ---------- derivation complete de l'etat ---------- */

  function derive(state, now) {

/* ============================================================
   trophies.js : exercices (items), trophees par niveau, logique de niveau,
   questionnaire de depart, profil d'exemple, autotests. Aucun acces au DOM.

   Niveau L = rang L (1 Rookie ... 10 Immortel).
   Trophees du niveau L (L = 2..10) = 8 emplacements (2 Pousser, 2 Tirer, 1 Jambes,
   1 Abdos, 2 Skills). La cible est l'ancre du rang L dans standards.json
   (pour les skills en variantes: la variante dont le rang d'entree est L, 5 s).
   Le niveau 1 n'a pas de trophees: tout le monde commence Rookie.
   ============================================================ */
const Troph = (() => {
  'use strict';
  const RID = Core.RID, EX = Core.EX;
  const L = id => Core.levelOf(id);

  /* ---------- items (exercices affiches) ---------- */
  const ITEMS = {};
  function addItem(key, o) { ITEMS[key] = Object.assign({ key }, o); }
  Object.keys(XI).forEach(k => {
    const x = XI[k], base = EX[k];
    addItem(k, {
      ex: k, variant: null, fam: x.fam, name: x.n || (base && base.name) || k, short: x.s || x.n, p: x.p, s: x.s2 || [],
      st: x.st, er: x.er, hold: !!x.hold || (base && base.measure === 'seconds'), ranked: !!base,
      pose: x.pose || null, poseNames: x.poseNames || null, u: x.u, unit: base ? base.unit_label : (x.hold ? 's' : 'reps')
    });
  });
  Object.keys(LADDER_XI).forEach(ex => {
    const lx = LADDER_XI[ex], lad = Core.ladderFor(ex);
    lad.variants.forEach(v => {
      const key = ex + ':' + v.variant;
      addItem(key, {
        ex, variant: v.variant, fam: lx.fam, name: LAD_NAME[ex] + ' ' + VAR_SHORT[v.variant], short: LAD_NAME[ex] + ' ' + VAR_SHORT[v.variant],
        p: lx.p, s: lx.s2, st: lx.st.map(t => (t === 'VAR' ? (lx.var2[v.variant] || 'Garde la position, corps gainé.') : t)), er: lx.er,
        hold: true, ranked: true, pose: lx.poseFor[v.variant] || null, u: Math.max(1, L(v.entry_rank) - 1), unit: 's'
      });
    });
  });
  const item = key => ITEMS[key];
  const keyOf = (ex, variant) => (variant ? ex + ':' + variant : ex);

  /* ---------- trophees ---------- */
  /* priorites par emplacement: [exercice, niveau min, niveau max]. Un exercice sans ancre au rang du niveau est saute. */
  const SLOTS = [
    { id: 'push1', cat: 'push', pri: [['pompes_strictes', 2, 4], ['pompes_archer', 5, 5], ['pompes_une_main', 6, 10]] },
    { id: 'push2', cat: 'push', pri: [['dips_strictes', 2, 4], ['handstand_push_up_strict', 5, 10]] },
    { id: 'pull1', cat: 'pull', pri: [['tractions_strictes', 2, 6], ['tractions_archer', 7, 10]] },
    { id: 'pull2', cat: 'pull', pri: [['tractions_supination', 2, 3], ['muscle_up_strict', 4, 10]] },
    { id: 'legs1', cat: 'legs', pri: [['squat_bulgare', 2, 3], ['pistol_squat', 4, 7], ['dragon_squat', 8, 10]] },
    { id: 'core1', cat: 'core', pri: [['releves_de_jambes_tendues_suspendus', 2, 3], ['toes_to_bar_strict', 4, 4], ['l_sit', 5, 5], ['dragon_flag', 6, 7], ['v_sit', 8, 10]] },
    { id: 'skill1', cat: 'skills', pri: [['handstand_libre', 2, 6], ['human_flag', 7, 10]] },
    { id: 'skill2', cat: 'skills', pri: [['planche', 2, 2], ['front_lever', 3, 3], ['planche', 4, 4], ['front_lever', 5, 5], ['planche', 6, 6], ['front_lever', 7, 7], ['traction_une_main', 8, 8], ['planche', 9, 9], ['traction_une_main', 10, 10]] }
  ];
  function buildLevel(lv) {
    const rank = RID[lv - 1], out = [], used = new Set();
    for (const slot of SLOTS) {
      for (const [ex, from, to] of slot.pri) {
        if (lv < from || lv > to) continue;
        const base = EX[ex];
        if (!base) continue;
        let variant = null, target;
        if (base.measure === 'variant') {
          const v = Core.ladderFor(ex).variants.find(x => x.entry_rank === rank);
          if (!v) continue;
          variant = v.variant; target = 5;
        } else {
          const a = base.anchors[rank];
          if (typeof a !== 'number') continue;
          target = a;
        }
        const key = keyOf(ex, variant);
        if (used.has(key)) continue;
        used.add(key);
        out.push({ id: 'L' + lv + '-' + slot.id, level: lv, slot: slot.id, cat: slot.cat, ex, variant, key, target, hold: !!ITEMS[key].hold, anchorRank: rank });
        break;
      }
    }
    return out;
  }
  const BY_LEVEL = {};
  for (let lv = 2; lv <= 10; lv++) BY_LEVEL[lv] = buildLevel(lv);
  BY_LEVEL[1] = [];
  const ALL = [].concat(...Object.keys(BY_LEVEL).map(k => BY_LEVEL[k]));
  const BY_ID = {}; ALL.forEach(t => { BY_ID[t.id] = t; });
  const trophiesOf = lv => BY_LEVEL[Math.max(1, Math.min(10, lv))] || [];
  const firstTrophyLevel = {};
  ALL.forEach(t => { if (!(t.key in firstTrophyLevel)) firstTrophyLevel[t.key] = t.level; });

  /* niveau d'ouverture d'un exercice */
  function unlockOf(key) {
    const it = ITEMS[key];
    if (!it) return 1;
    if (it.variant) return it.u;
    if (it.u != null) return it.u;
    if (firstTrophyLevel[key] != null) return Math.max(1, firstTrophyLevel[key] - 1);
    return 1;
  }

  /* ---------- niveau du joueur et trophees ---------- */
  const level = S => Core.levelOf(S.earned);
  const isDone = (S, t) => t.level <= level(S) || !!(S.trophies && S.trophies[t.id]);
  const doneCount = (S, lv) => trophiesOf(lv).filter(t => isDone(S, t)).length;
  const earnable = (S, t) => t.level <= level(S) + 1;
  const targetLevel = S => Math.min(10, level(S) + 1);
  const pending = (S, lv) => trophiesOf(lv).filter(t => !isDone(S, t));

  /** Trophees obtenus par une performance (niveau actuel +1 au plus). */
  function award(S, ex, variant, perf, now) {
    const got = [];
    if (!S.trophies) S.trophies = {};
    for (const t of ALL) {
      if (t.ex !== ex || isDone(S, t) || !earnable(S, t)) continue;
      let ok = false;
      if (t.variant) {
        const lad = Core.ladderFor(ex);
        ok = variant != null && perf >= t.target && Core.variantIndex(lad, variant) >= Core.variantIndex(lad, t.variant);
      } else {
        ok = perf >= t.target - 1e-9;
      }
      if (ok) { S.trophies[t.id] = now; got.push(t); }
    }
    return got;
  }
  /** Monte de niveau tant que tous les trophees du niveau suivant sont obtenus. Retourne {from,to,rank} ou null. */
  function levelUp(S) {
    const from = level(S);
    let lv = from;
    while (lv < 10 && trophiesOf(lv + 1).every(t => S.trophies[t.id] || t.level <= lv)) lv++;
    if (lv === from) return null;
    S.earned = RID[lv - 1];
    S.protection = 3;
    return { from, to: lv, rank: S.earned };
  }

  /* ---------- exercices d'une famille ---------- */
  function familyItems(S, fam, showLocked) {
    const lv = level(S), tl = targetLevel(S);
    const goal = new Set(pending(S, tl).map(t => t.key));
    const all = FAM_ITEMS[fam].filter(k => ITEMS[k]);
    const open = all.filter(k => unlockOf(k) <= lv);
    let shown = open;
    if (open.length > 6) {
      const score = k => (goal.has(k) ? 0 : 100) + (lv - unlockOf(k));
      const pick = open.slice().sort((a, b) => score(a) - score(b)).slice(0, 6);
      shown = open.filter(k => pick.includes(k));
    }
    const locked = showLocked ? all.filter(k => unlockOf(k) > lv).slice(0, 6) : [];
    return { open: shown, locked };
  }
  /** Prochain exercice conseille: un trophee en attente du niveau suivant, en alternant les familles. */
  function suggest(S) {
    const tl = targetLevel(S);
    let list = pending(S, tl);
    if (!list.length) list = trophiesOf(tl);
    if (!list.length) return null;
    const lastFam = S.log && S.log.length ? (ITEMS[S.log[S.log.length - 1].key] || {}).fam : null;
    const order = goalOrder(S);
    /* apres une serie, on passe a la famille suivante dans l'ordre du joueur */
    const pos = f => { const i = order.indexOf(f); return lastFam ? (i - order.indexOf(lastFam) + 5) % 5 || 5 : i; };
    return list.slice().sort((a, b) => pos(a.cat) - pos(b.cat))[0];
  }
  function goalOrder(S) {
    const g = S.intake && S.intake.goal;
    return g === 2 ? ['skills', 'pull', 'push', 'core', 'legs'] : g === 1 ? ['push', 'legs', 'pull', 'core', 'skills']
      : g === 0 ? ['pull', 'push', 'legs', 'core', 'skills'] : ['legs', 'core', 'push', 'pull', 'skills'];
  }

  /* ---------- questionnaire de depart ---------- */
  const Q = {
    time: ['Jamais', 'Moins de 6 mois', '6 mois à 2 ans', 'Plus de 2 ans'],
    pushups: [{ l: 'Moins de 10', v: 0 }, { l: '10 à 24', v: 10 }, { l: '25 à 49', v: 25 }, { l: '50 à 99', v: 50 }, { l: '100 ou plus', v: 100 }],
    pullups: [{ l: '0', v: 0 }, { l: '1 à 4', v: 1 }, { l: '5 à 9', v: 5 }, { l: '10 à 15', v: 10 }, { l: '16 ou plus', v: 16 }],
    goal: ['Force', 'Masse', 'Skills', 'Forme'],
    days: ['1 ou 2', '3 ou 4', '5 ou plus']
  };
  const START_CAP = 3;
  /** niveau le plus haut dont l'ancre est atteinte (1 si aucune ancre atteinte) */
  function levelFromReps(exId, reps) {
    let lv = 1;
    for (let i = 1; i < RID.length; i++) { const a = EX[exId].anchors[RID[i]]; if (typeof a === 'number' && reps >= a) lv = i + 1; }
    return lv;
  }
  function levelFromAnswers(a) {
    const pu = Q.pushups[a.pu].v, pl = Q.pullups[a.pl].v;
    const lvPush = levelFromReps('pompes_strictes', pu), lvPull = levelFromReps('tractions_strictes', pl);
    const raw = Math.min(lvPush, lvPull);
    return { lvPush, lvPull, raw, level: Math.min(raw, START_CAP), capped: raw > START_CAP };
  }
  function startState(a, now) {
    const r = levelFromAnswers(a);
    const S = Core.newFreshState(now);
    const rank = RID[r.level - 1];
    const val = ex => (r.level >= 2 ? Math.ceil(Core.standardFor(ex, rank).value - 1e-9) : 0);
    Core.applyEntry(S, {
      push: { value: Q.pushups[a.pu].v }, pull: { value: Q.pullups[a.pl].v },
      legs: { value: val('squat_bulgare') }, core: { value: val('releves_de_jambes_tendues_suspendus') }, skills: { value: val('handstand_libre') }
    }, now);
    S.earned = rank;
    S.onboarded = true;
    S.intake = { time: a.time, pu: a.pu, pl: a.pl, goal: a.goal, days: a.days, level: r.level, raw: r.raw };
    return S;
  }
  function firstThings(S) {
    const tl = targetLevel(S);
    const pend = pending(S, tl);
    const order = goalOrder(S), out = [];
    order.forEach(c => { const t = pend.find(x => x.cat === c); if (t) out.push(t); });   // une famille differente a la fois
    return out.slice(0, 3);
  }

  /* ---------- profil d'exemple ---------- */
  const EXAMPLE_ATTEMPTS = [
    ['pompes_strictes', [55, 65, 75, 80, 80, 82]], ['dips_strictes', [30, 36, 40, 42, 44, 44]],
    ['tractions_strictes', [13, 15, 17, 17, 18, 18]], ['squat_bulgare', [30, 34, 38, 38, 40, 40]],
    ['toes_to_bar_strict', [12, 14, 16, 17, 17, 18]], ['handstand_libre', [22, 28, 32, 34, 34, 35]]
  ];
  function exampleState(now) {
    const S = Core.newFreshState(now);
    S.onboarded = true; S.example = true; S.earned = 'argent'; S.seq = 40;
    S.intake = { example: true, level: 3, goal: 0, days: 1 };
    const DAYS = 86400000;
    EXAMPLE_ATTEMPTS.forEach(([ex, perfs], i) => {
      perfs.forEach((p, j) => {
        const ts = now - Math.round((50 - j * 8 - i * 0.5) * DAYS);
        Core.recordAttempt(S, { ex, perf: p, status: 'validated', source: 'ranked' }, ts);
        award(S, ex, null, p, ts);
        S.log.push({ key: ex, ts, perf: p });
      });
    });
    S.protection = 0;
    return S;
  }

  /* ---------- autotests ---------- */
  function listText() {
    return Object.keys(BY_LEVEL).map(Number).sort((a, b) => a - b).map(lv =>
      'N' + lv + ' ' + Core.rName(RID[lv - 1]) + ': ' + BY_LEVEL[lv].map(t => t.key + '=' + t.target).join(' | ')).join('\n');
  }
  function test() {
    const R = [];
    const eq = (name, got, exp) => R.push({ name, got, exp, pass: JSON.stringify(got) === JSON.stringify(exp) });
    const now = Date.UTC(2026, 9, 23, 12);
    for (let lv = 2; lv <= 10; lv++) {
      const list = BY_LEVEL[lv], keys = list.map(t => t.key);
      eq('N' + lv + ': aucun doublon', new Set(keys).size, keys.length);
      eq('N' + lv + ': cibles = ancres du rang ' + RID[lv - 1],
        list.every(t => { const b = EX[t.ex]; return b.measure === 'variant' ? (t.target === 5 && Core.ladderFor(t.ex).variants.find(v => v.variant === t.variant).entry_rank === RID[lv - 1]) : b.anchors[RID[lv - 1]] === t.target; }), true);
      eq('N' + lv + ': 7 ou 8 trophees', list.length >= 7 && list.length <= 8, true);
    }
    eq('N1: pas de trophees', BY_LEVEL[1].length, 0);
    eq('total trophees', ALL.length, Object.keys(BY_LEVEL).reduce((s, k) => s + BY_LEVEL[k].length, 0));
    // questionnaire
    const ans = (pu, pl) => ({ time: 0, pu, pl, goal: 0, days: 1 });
    const lv = (pu, pl) => levelFromAnswers(ans(pu, pl));
    eq('jamais + <10 pompes + 0 traction -> Niveau 1', lv(0, 0).level, 1);
    eq('25 a 49 pompes + 10 a 15 tractions -> Niveau 2 (ancres Bronze 25 / 8)', lv(2, 3).level, 2);
    eq('50 a 99 pompes + 16+ tractions -> Niveau 3', [lv(3, 4).raw, lv(3, 4).level, lv(3, 4).capped], [3, 3, false]);
    eq('100+ pompes + 16+ tractions: brut 4, plafonne a 3', [lv(4, 4).raw, lv(4, 4).level, lv(4, 4).capped], [4, 3, true]);
    eq('100+ pompes + 0 traction: on prend le plus bas = 1', lv(4, 0).level, 1);
    let S = startState(ans(2, 3), now);
    eq('etat de depart: rang Bronze, ELO global classe', [S.earned, Core.derive(S, now).global != null], ['bronze', true]);
    S = startState(ans(0, 0), now);
    eq('etat de depart Niveau 1: Rookie, 3 premiers trophees proposes', [S.earned, firstThings(S).length], ['rookie', 3]);
    // niveau et trophees
    S = startState(ans(0, 0), now);
    eq('niveau 1: 0/8 trophees du niveau 2', [level(S), doneCount(S, 2)], [1, 0]);
    let got = award(S, 'pompes_strictes', null, 30, now);
    eq('30 pompes: trophee Niveau 2 (25) obtenu, pas celui du Niveau 3 (hors de portee)', [got.map(t => t.id), doneCount(S, 2), doneCount(S, 3)], [['L2-push1'], 1, 0]);
    got = award(S, 'dips_strictes', null, 40, now);
    eq('40 dips: seul le trophee Niveau 2 (15) compte, 25 et 40 sont trop hauts', got.map(t => t.id), ['L2-push2']);
    eq('pas de montee tant que le niveau 2 est incomplet', levelUp(S), null);
    S = startState(ans(0, 0), now);
    BY_LEVEL[2].slice(0, 7).forEach(t => { S.trophies[t.id] = now; });
    eq('7/8 trophees: pas de montee', [doneCount(S, 2), levelUp(S)], [7, null]);
    const last = BY_LEVEL[2][7];
    S.trophies[last.id] = now;
    const up = levelUp(S);
    eq('8/8 trophees du niveau 2 -> niveau 2 (Bronze)', [up && up.to, S.earned, level(S)], [2, 'bronze', 2]);
    eq('apres la montee, 0/8 sur le niveau 3', [doneCount(S, 3), targetLevel(S)], [0, 3]);
    got = award(S, 'pompes_strictes', null, 50, now);
    eq('en avance: 50 pompes (niveau 3) compte pour le niveau suivant et reste valide', [got.map(t => t.id), doneCount(S, 3), !!S.trophies['L3-push1']], [['L3-push1'], 1, true]);
    eq('les trophees du niveau 4 sont hors de portee (niveau actuel + 1 au plus)', award(S, 'pompes_strictes', null, 75, now).length, 0);
    BY_LEVEL[3].forEach(t => { S.trophies[t.id] = now; });
    const up2 = levelUp(S);
    eq('tous les trophees du niveau 3 faits -> niveau 3 (Argent)', [up2 && up2.to, S.earned], [3, 'argent']);
    // montee en cascade si tout le niveau suivant etait deja fait
    S = startState(ans(0, 0), now);
    BY_LEVEL[2].concat(BY_LEVEL[3]).forEach(t => { S.trophies[t.id] = now; });
    eq('niveaux 2 et 3 complets: montee directe au niveau 3', levelUp(S).to, 3);
    // variante: planche tuck 5 s niveau 2
    S = startState(ans(0, 0), now);
    eq('planche tuck 4 s: pas de trophee', award(S, 'planche', 'tuck', 4, now).length, 0);
    eq('planche tuck 5 s: trophee du niveau 2', award(S, 'planche', 'tuck', 5, now).map(t => t.id), ['L2-skill2']);
    eq('une variante plus dure vaut aussi (adv tuck 5 s sur un trophee tuck)', (() => { const T = startState(ans(0, 0), now); return award(T, 'planche', 'adv tuck', 5, now).map(t => t.id); })(), ['L2-skill2']);
    // exemple
    const ex = exampleState(now);
    const d = Core.derive(ex, now);
    eq('exemple: Argent, 5/8 trophees du niveau 4', [ex.earned, doneCount(ex, 4)], ['argent', 5]);
    eq('exemple: porte de promotion ouverte', d.gateOpen, true);
    // niveaux d'ouverture
    eq('ouverture: pompes strictes 1, pistol 3, handstand libre 1, human flag 6', [unlockOf('pompes_strictes'), unlockOf('pistol_squat'), unlockOf('handstand_libre'), unlockOf('human_flag')], [1, 3, 1, 6]);
    return R;
  }

  return { ITEMS, item, keyOf, SLOTS, BY_LEVEL, ALL, BY_ID, trophiesOf, unlockOf, level, isDone, doneCount, earnable, targetLevel, pending, award, levelUp,
    familyItems, suggest, Q, START_CAP, levelFromReps, levelFromAnswers, startState, firstThings, exampleState, listText, test };
})();

/* ============================================================
   body.js : figure anatomique (face et dos), 14 groupes musculaires.
   Les contours sont des listes de points lissées (Catmull-Rom -> Bezier).
   Moitie gauche dessinee a la main, moitie droite par symetrie (x -> 200 - x).
   Principaux: couleur d'accent pleine. Secondaires: accent a 45 %. Les autres restent neutres.
   ============================================================ */
const Body = (() => {
  'use strict';
  const f1 = n => Math.round(n * 10) / 10;
  const K = 1.12;                       // elargissement horizontal global (carrure)
  const wx = x => 100 + (x - 100) * K;
  const mir = pts => pts.map(p => [200 - p[0], p[1]]);

  /* courbe fermee lissee passant par les points */
  function smooth(pts) {
    const n = pts.length;
    pts = pts.map(p => [wx(p[0]), p[1]]);
    let d = 'M' + f1(pts[0][0]) + ' ' + f1(pts[0][1]);
    for (let i = 0; i < n; i++) {
      const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
      const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6];
      const c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
      d += 'C' + f1(c1[0]) + ' ' + f1(c1[1]) + ' ' + f1(c2[0]) + ' ' + f1(c2[1]) + ' ' + f1(p2[0]) + ' ' + f1(p2[1]);
    }
    return d + 'Z';
  }
  /* rectangle arrondi (abdominaux) */
  function rr(x0, y0, x1, y1, r) {
    x0 = wx(x0); x1 = wx(x1);
    return `M${x0 + r} ${y0}H${x1 - r}Q${x1} ${y0} ${x1} ${y0 + r}V${y1 - r}Q${x1} ${y1} ${x1 - r} ${y1}H${x0 + r}Q${x0} ${y1} ${x0} ${y1 - r}V${y0 + r}Q${x0} ${y0} ${x0 + r} ${y0}Z`;
  }
  const rrM = (x0, y0, x1, y1, r) => rr(200 - x1, y0, 200 - x0, y1, r);
  /* un contour symetrique: gauche + droite */
  const both = pts => smooth(pts) + smooth(mir(pts));

  /* ---------- silhouette neutre ---------- */
  const TL = [[100, 62], [88, 63], [70, 67], [54, 74], [45, 86], [44, 102], [53, 118], [59, 134], [63, 160], [67, 188], [69, 206], [64, 226], [56, 246], [56, 262], [74, 272], [100, 276]];
  const TORSO = smooth(TL.concat(mir(TL.slice(1, -1)).reverse()));
  const UA = [[48, 80], [38, 88], [33, 112], [31, 140], [32, 166], [38, 176], [50, 174], [55, 160], [57, 134], [58, 110], [56, 92]];
  const FA = [[31, 166], [28, 184], [25, 208], [22, 232], [24, 242], [34, 244], [38, 236], [44, 212], [50, 188], [54, 172], [46, 164]];
  const HAND = [[22, 238], [18, 254], [16, 270], [19, 282], [26, 286], [32, 278], [37, 262], [36, 244], [28, 238]];
  const TH = [[58, 252], [52, 276], [52, 306], [56, 330], [62, 342], [78, 342], [84, 330], [90, 300], [98, 274], [100, 266], [80, 256], [66, 250]];
  const SH = [[56, 336], [54, 356], [56, 376], [60, 392], [70, 394], [76, 380], [80, 360], [82, 342], [76, 334], [62, 334]];
  const FT = [[60, 390], [54, 402], [60, 409], [76, 409], [84, 402], [78, 390]];
  const NECK = [[91, 44], [89, 66], [100, 70], [111, 66], [109, 44], [100, 40]];
  /* parties separees (pas de trou aux recouvrements) */
  const UNDER = [TORSO, both(UA), both(FA), both(HAND), both(TH), both(SH), both(FT), smooth(NECK),
    'M100 8C108 8 115.500 15 115.500 28C115.500 41 108 48 100 48C92 48 84.500 41 84.500 28C84.500 15 92 8 100 8Z'];
  let clipN = 0;

  /* ---------- muscles: listes de formes (moitie gauche; la droite est le miroir) ---------- */
  const P = (...pts) => ({ pts });
  const R = (x0, y0, x1, y1, r) => ({ r: [x0, y0, x1, y1, r] });
  const FOREARM = P([34, 172], [30, 186], [27, 206], [25, 228], [30, 238], [35, 230], [40, 210], [46, 190], [50, 176], [44, 170]);
  const SHAPES = {
    front: {
      obliques: [P([84, 136], [76, 142], [70, 158], [67, 180], [68, 200], [72, 212], [82, 214], [84, 200], [84, 170])],
      abs: [R(86, 134, 98.5, 152, 4), R(86, 155, 98.5, 173, 4), R(86, 176, 98.5, 194, 4), R(87, 197, 98.5, 214, 5)],
      pecs: [P([99, 82], [88, 80], [76, 80], [66, 82], [62, 94], [62, 108], [66, 120], [76, 128], [88, 131], [99, 129])],
      quads: [P([60, 262], [56, 282], [55, 306], [58, 326], [66, 333], [70, 300], [72, 272], [70, 260]),
        P([73, 260], [71, 290], [68, 328], [76, 332], [82, 322], [88, 296], [96, 274], [98, 265], [86, 258])],
      calves: [P([58, 344], [55, 360], [57, 376], [62, 388], [68, 380], [74, 362], [76, 346], [68, 342])],
      forearms: [FOREARM],
      biceps: [P([52, 112], [46, 118], [42, 132], [40, 148], [41, 162], [46, 166], [52, 164], [55, 150], [56, 132], [56, 120])],
      traps: [P([91, 56], [84, 60], [72, 66], [58, 73], [54, 77], [62, 78], [70, 76], [80, 70], [90, 63])],
      delts: [P([66, 76], [56, 74], [46, 80], [40, 92], [38, 108], [40, 124], [46, 134], [52, 124], [56, 108], [60, 92])]
    },
    back: {
      lats: [P([66, 98], [62, 114], [64, 140], [72, 168], [84, 194], [96, 206], [99, 206], [99, 150], [90, 128], [78, 108])],
      lowback: [P([99, 152], [92, 158], [86, 172], [84, 192], [86, 208], [92, 216], [99, 220])],
      glutes: [P([99, 218], [88, 214], [74, 220], [62, 236], [56, 252], [60, 268], [72, 278], [88, 282], [99, 278])],
      hams: [P([58, 284], [54, 304], [55, 326], [60, 338], [68, 340], [70, 312], [72, 286]),
        P([75, 286], [73, 314], [71, 340], [80, 336], [86, 318], [92, 298], [98, 286])],
      calves: [P([58, 346], [54, 362], [58, 380], [66, 392], [72, 380], [78, 362], [78, 348], [70, 342])],
      forearms: [FOREARM],
      triceps: [P([40, 92], [34, 110], [32, 136], [33, 160], [38, 172], [48, 170], [54, 156], [57, 134], [58, 112], [54, 96])],
      traps: [P([99, 50], [92, 56], [80, 62], [66, 68], [54, 76], [60, 84], [72, 92], [84, 106], [94, 128], [99, 150])],
      delts: [P([54, 76], [46, 80], [40, 92], [38, 108], [40, 124], [46, 134], [52, 124], [56, 108], [58, 92])]
    }
  };
  const ORDER = {
    front: ['obliques', 'abs', 'pecs', 'quads', 'calves', 'forearms', 'biceps', 'traps', 'delts'],
    back: ['lats', 'lowback', 'glutes', 'hams', 'calves', 'forearms', 'triceps', 'traps', 'delts']
  };
  /* path combine par muscle (gauche + miroir) */
  const PATH = { front: {}, back: {} };
  ['front', 'back'].forEach(v => {
    ORDER[v].forEach(id => {
      PATH[v][id] = SHAPES[v][id].map(s => (s.pts ? smooth(s.pts) + smooth(mir(s.pts)) : rr.apply(null, s.r) + rrM.apply(null, s.r))).join('');
    });
  });
  /* vues dans lesquelles chaque muscle est visible */
  const SIDE = { pecs: 'f', biceps: 'f', abs: 'f', obliques: 'f', quads: 'f', triceps: 'b', lats: 'b', lowback: 'b', glutes: 'b', hams: 'b', traps: 'fb', delts: 'fb', forearms: 'fb', calves: 'fb' };

  /** vue la plus parlante pour une liste de muscles principaux */
  function bestView(p) {
    let f = 0, b = 0;
    (p || []).forEach(m => { if (SIDE[m] === 'f') f++; else if (SIDE[m] === 'b') b++; });
    return b > f ? 'back' : 'front';
  }

  function figure(view, p, s, shade) {
    const pset = new Set(p || []), sset = new Set(s || []);
    let out = UNDER.map(d => `<path class="bd" d="${d}"/>`).join('');
    ORDER[view].forEach(id => {
      const d = PATH[view][id];
      const st = pset.has(id) ? ' hp' : sset.has(id) ? ' hs' : '';
      out += `<path class="mu" data-m="${id}" d="${d}"/>`;
      if (st) out += `<path class="mu${st}" d="${d}"/>`;
    });
    if (shade) { const id = 'bc' + (++clipN); out += `<clipPath id="${id}">${UNDER.map(d => `<path d="${d}"/>`).join('')}</clipPath><rect class="sh" x="0" y="0" width="200" height="412" clip-path="url(#${id})"/>`; }
    return out;
  }
  /**
   * opts: view 'front'|'back'|'both'|'auto', p, s (listes d'ids), cls, label, shade (bool)
   */
  function svg(o) {
    const view = o.view === 'auto' ? bestView(o.p) : (o.view || 'both');
    const one = v => `<svg class="body-fig ${o.cls || ''}" viewBox="0 0 200 412" role="img" aria-label="${(o.label || 'Muscles travaillés') + (v === 'back' ? ', vue de dos' : ', vue de face')}" focusable="false">${figure(v, o.p, o.s, o.shade !== false)}</svg>`;
    if (view === 'both') return `<div class="bodies">${one('front')}${one('back')}</div>`;
    return one(view);
  }
  const names = ids => (ids || []).map(m => MUSCLES[m]).join(' · ');
  const ALLMUSCLES = Object.keys(MUSCLES);
  return { svg, figure, bestView, names, SIDE, ORDER, ALLMUSCLES };
})();

      ], names: ['Genoux groupés', 'Jambes tendues']
    },
    planche: {
      vb: '40 120 180 114', env: { floor: FL }, poses: [
        P({ sh: [122, 172], hip: [74, 176], hand: [110, 220], foot: [86, 216], pt: 0 }),
        P({ sh: [126, 168], hip: [80, 162], hand: [110, 220], foot: [92, 206], pt: 0.2 }),

    },
    fl: {

    },
    hand: {

        P({ sh: [130, 166], hip: [130, 116], hand: [130, 222], foot: [130, 26], foot2: [127, 28], pt: 1 }),
        P({ sh: [132, 166], hip: [137, 116], hand: [130, 222], foot: [141, 26], foot2: [138, 28], pt: 1 })
      ], names: ['Ligne droite', 'Légère bascule']
    },
    kickup: {
      vb: '0 -10 260 250', env: { floor: FL, wall: 240 }, poses: [
        P({ sh: [198, 170], hip: [160, 138], hand: [212, 222], foot: [174, 210], foot2: [96, 212], pt: 0 }),
        P({ sh: [204, 168], hip: [172, 138], hand: [212, 222], foot: [182, 212], foot2: [84, 176], pt: 0 }),
        P({ sh: [210, 170], hip: [190, 124], hand: [212, 222], foot: [176, 196], foot2: [224, 38], pt: 0.4 }),
        P({ sh: [213, 168], hip: [219, 118], hand: [212, 222], foot: [230, 32], foot2: [228, 34], pt: 1 })
      ], names: ['Départ face au mur', 'Pied avant fléchi', 'Jambe arrière qui monte', 'Arrivée contre le mur']
    }
  };

  /* ---------- interpolation ---------- */
  const lerp = (a, b, t) => a + (b - a) * t;
  const lerp2 = (a, b, t) => [lerp(a[0], b[0], t), lerp(a[1], b[1], t)];
  function lerpAng(a, b, t) { let d = b - a; while (d > Math.PI) d -= 2 * Math.PI; while (d < -Math.PI) d += 2 * Math.PI; return a + d * t; }
  const ease = t => t * t * (3 - 2 * t);
  function mix(A, B, t) {
    const o = Object.assign({}, A);
    o.sh = lerp2(A.sh, B.sh, t); o.hand = lerp2(A.hand, B.hand, t); o.foot = lerp2(A.foot, B.foot, t);
    const h2a = A.hand2 || A.hand, h2b = B.hand2 || B.hand; o.hand2 = lerp2(h2a, h2b, t);
    const f2a = A.foot2 || A.foot, f2b = B.foot2 || B.foot; o.foot2 = lerp2(f2a, f2b, t);
    o.ta = lerpAng(A.ta, B.ta, t); o.pt = lerp(A.pt, B.pt, t);
    o.eb = t < 0.5 ? A.eb : B.eb; o.kb = t < 0.5 ? A.kb : B.kb;
    o.hda = lerpAng(A.hda, B.hda, t);
    return o;
  }
  /** s dans [0,1]: progression dans le mouvement (pose 1 -> derniere pose) */
  function sample(poses, s) {
    const n = poses.length;
    if (n === 1) return poses[0];
    const x = Math.max(0, Math.min(1, s)) * (n - 1);
    const i = Math.min(n - 2, Math.floor(x));
    return mix(poses[i], poses[i + 1], ease(x - i));
  }

  /* ---------- geometrie ---------- */
  function ik(S, W, l1, l2, side) {
    const dx = W[0] - S[0], dy = W[1] - S[1], d = Math.hypot(dx, dy) || 1e-6, ux = dx / d, uy = dy / d;
    if (d >= (l1 + l2) * 0.999) return { J: [S[0] + ux * l1, S[1] + uy * l1], E: [S[0] + ux * (l1 + l2), S[1] + uy * (l1 + l2)] };
    const a = (d * d + l1 * l1 - l2 * l2) / (2 * d), h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    return { J: [S[0] + ux * a - uy * h * side, S[1] + uy * a + ux * h * side], E: W };
  }
  const norm = v => { const d = Math.hypot(v[0], v[1]) || 1; return [v[0] / d, v[1] / d]; };
  function geo(p) {
    const S = p.sh, H = [S[0] + Math.cos(p.ta) * TOR, S[1] + Math.sin(p.ta) * TOR];
    const torsoDir = norm([H[0] - S[0], H[1] - S[1]]);
    const front = [torsoDir[1], -torsoDir[0]];
    const a1 = ik(S, p.hand, UA, FA, p.eb), a2 = ik([S[0] - 2, S[1] - 1], p.hand2 || [p.hand[0] + 3, p.hand[1] - 2], UA, FA, p.eb);
    const l1 = ik(H, p.foot, TH, SHN, p.kb), l2 = ik([H[0] - 2, H[1] - 1], p.foot2 || [p.foot[0] + 5, p.foot[1] - 1], TH, SHN, p.kb);
    const toe = (K, A) => {
      const sd = norm([A[0] - K[0], A[1] - K[1]]), flat = [sd[1], -sd[0]];
      const v = norm([flat[0] * (1 - p.pt) + sd[0] * p.pt, flat[1] * (1 - p.pt) + sd[1] * p.pt]);
      return [A[0] + v[0] * FOOT, A[1] + v[1] * FOOT];
    };
    const hdv = [Math.cos(p.hda), Math.sin(p.hda)];
    const head = [S[0] + hdv[0] * (HEAD + 8), S[1] + hdv[1] * (HEAD + 8)];
    const hand = (E, W) => { const d = norm([W[0] - E[0], W[1] - E[1]]); return [W[0] + d[0] * HANDL, W[1] + d[1] * HANDL]; };
    return {
      S, H, front, torsoDir, head,
      arm1: { J: a1.J, W: a1.E, T: hand(a1.J, a1.E) }, arm2: { J: a2.J, W: a2.E, T: hand(a2.J, a2.E) },
      leg1: { J: l1.J, A: l1.E, T: toe(l1.J, l1.E) }, leg2: { J: l2.J, A: l2.E, T: toe(l2.J, l2.E) }
    };
  }

  /* ---------- dessin ---------- */
  function cap(a, b, r1, r2) {
    const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1, ux = dx / d, uy = dy / d, nx = -uy, ny = ux;
    const P1 = [a[0] + nx * r1, a[1] + ny * r1], P2 = [b[0] + nx * r2, b[1] + ny * r2], P3 = [b[0] - nx * r2, b[1] - ny * r2], P4 = [a[0] - nx * r1, a[1] - ny * r1];
    return `M${f1(P1[0])} ${f1(P1[1])}L${f1(P2[0])} ${f1(P2[1])}A${f1(r2)} ${f1(r2)} 0 0 0 ${f1(P3[0])} ${f1(P3[1])}L${f1(P4[0])} ${f1(P4[1])}A${f1(r1)} ${f1(r1)} 0 0 0 ${f1(P1[0])} ${f1(P1[1])}Z`;
  }
  const circ = (c, r) => `M${f1(c[0] - r)} ${f1(c[1])}a${f1(r)} ${f1(r)} 0 1 0 ${f1(2 * r)} 0a${f1(r)} ${f1(r)} 0 1 0 ${f1(-2 * r)} 0Z`;
  const at = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t];
  /* partie du corps -> muscles correspondants */
  const PART = { chest: ['pecs'], shoulder: ['delts'], uarm: ['biceps', 'triceps'], farm: ['forearms'], abdomen: ['abs', 'obliques'], back: ['lats', 'traps', 'lowback'], glute: ['glutes'], thigh: ['quads', 'hams'], shin: ['calves'] };
  function strength(hl, part) {
    if (!hl) return 0;
    let v = 0;
    PART[part].forEach(m => { if (hl.p.includes(m)) v = Math.max(v, 1); else if (hl.s.includes(m)) v = Math.max(v, 0.45); });
    return v;
  }
  /* une piece: forme de base, relief clair sur le dessus, surcouche d'accent si muscle travaille */
  function piece(d, cls, hi, st) {
    let s = `<path class="${cls}" d="${d}"/>`;
    if (hi) s += `<path class="mq-hi" d="${hi}"/>`;
    if (st > 0) s += `<path class="mq-hl" style="fill-opacity:${(st > 0.5 ? 0.85 : 0.3).toFixed(2)}" d="${d}"/>`;
    return s;
  }
  /* relief: meme capsule, plus fine, decalee du cote de la lumiere (vers le haut de l'ecran) */
  function hiCap(a, b, r1, r2) {
    const dx = b[0] - a[0], dy = b[1] - a[1], d = Math.hypot(dx, dy) || 1;
    let nx = -dy / d, ny = dx / d; if (ny > 0) { nx = -nx; ny = -ny; }
    const k1 = r1 * 0.38, k2 = r2 * 0.38;
    return cap([a[0] + nx * k1, a[1] + ny * k1], [b[0] + nx * k2, b[1] + ny * k2], r1 * 0.42, r2 * 0.42);
  }
  function limb(a, b, r1, r2, cls, part, hl) { return piece(cap(a, b, r1, r2), cls, hiCap(a, b, r1, r2), strength(hl, part)); }
  function node(c, r, cls, part, hl) { return piece(circ(c, r), cls, null, strength(hl, part)); }

  function arm(A, G, cls, hl) {
    const S = G.S;
    return limb(S, A.J, 8.6, 7, cls, 'uarm', hl) + limb(A.J, A.W, 7, 5.3, cls, 'farm', hl) + node(A.J, 6.9, cls, 'uarm', hl)
      + node(A.T, 5.3, cls, 'farm', hl);
  }
  function leg(Lg, G, cls, hl) {
    const H = G.H;
    return limb(H, Lg.J, 13.2, 9.6, cls, 'thigh', hl) + limb(Lg.J, Lg.A, 8.8, 5.8, cls, 'shin', hl) + node(Lg.J, 9.4, cls, 'thigh', hl)
      + limb(Lg.A, Lg.T, 5.6, 4.2, cls, 'shin', null);
  }
  function torso(G, hl) {
    const S = G.S, H = G.H, f = G.front, cls = 'mq';
    const chest = [S[0] + (H[0] - S[0]) * 0.26 + f[0] * 5, S[1] + (H[1] - S[1]) * 0.26 + f[1] * 5];
    const glute = [H[0] - f[0] * 3.5, H[1] - f[1] * 3.5];
    const mid = at(S, H, 0.55);
    let s = piece(cap(S, H, 16.5, 14), cls, hiCap(S, H, 16.5, 14), strength(hl, 'abdomen') * 0.9);
    s += piece(circ(chest, 16.5), cls, null, strength(hl, 'chest'));
    s += piece(circ(glute, 14.5), cls, null, strength(hl, 'glute'));
    s += piece(circ([S[0] - f[0] * 2, S[1] - f[1] * 2], 11.5), cls, null, strength(hl, 'shoulder'));
    if (hl && (strength(hl, 'back') > 0)) s += `<path class="mq-hl" style="fill-opacity:${(strength(hl, 'back') * 0.5).toFixed(2)}" d="${cap(at(S, H, 0.1), at(S, H, 0.8), 6, 6)}" transform="translate(${f1(-f[0] * 7)} ${f1(-f[1] * 7)})"/>`;
    return s;
  }
  function envSvg(env) {
    let s = '';
    if (env.floor != null) s += `<ellipse class="mq-sh" cx="130" cy="${env.floor + 2}" rx="104" ry="5"/><line class="mq-fl" x1="6" y1="${env.floor}" x2="254" y2="${env.floor}"/>`;
    if (env.wall != null) s += `<rect class="mq-wall" x="${env.wall}" y="0" width="${260 - env.wall}" height="${env.floor != null ? env.floor : 240}"/><line class="mq-wl" x1="${env.wall}" y1="0" x2="${env.wall}" y2="${env.floor}"/>`;
    if (env.bar) s += `<line class="mq-post" x1="${env.bar.x0 + 6}" y1="${env.bar.y}" x2="${env.bar.x0 + 6}" y2="0"/><line class="mq-post" x1="${env.bar.x1 - 6}" y1="${env.bar.y}" x2="${env.bar.x1 - 6}" y2="0"/><line class="mq-bar" x1="${env.bar.x0}" y1="${env.bar.y}" x2="${env.bar.x1}" y2="${env.bar.y}"/>`;
    if (env.rails) s += `<line class="mq-post" x1="${env.rails.x0 + 6}" y1="${env.rails.y}" x2="${env.rails.x0 + 6}" y2="${FL}"/><line class="mq-post" x1="${env.rails.x1 - 6}" y1="${env.rails.y}" x2="${env.rails.x1 - 6}" y2="${FL}"/><line class="mq-bar" x1="${env.rails.x0}" y1="${env.rails.y}" x2="${env.rails.x1}" y2="${env.rails.y}"/><line class="mq-fl" x1="${env.rails.x0 - 14}" y1="${FL}" x2="${env.rails.x1 + 14}" y2="${FL}"/>`;
    if (env.parallettes) env.parallettes.forEach(pr => { s += `<rect class="mq-bar2" x="${pr[0]}" y="${pr[1]}" width="${pr[2] - pr[0]}" height="${FL - pr[1]}" rx="3"/>`; });
    return s;
  }
  /** contenu SVG d'une image du mouvement */
  function frame(setKey, s, o) {
    const set = SETS[setKey];
    if (!set) return '';
    o = o || {};
    const p = sample(set.poses, s), G = geo(p), hl = o.hl || null;
    let out = envSvg(set.env);
    if (o.skeleton) return out + skeleton(G);
    out += arm(G.arm2, G, 'mq-far', hl) + leg(G.leg2, G, 'mq-far', hl);
    out += torso(G, hl);
    const hd = G.head, nk = at(G.S, hd, 0.6);
    out += piece(cap(G.S, hd, 5.6, 5.2), 'mq', null, 0) + piece(`M${f1(hd[0] - HEAD)} ${f1(hd[1])}a${HEAD} ${HEAD * 1.1} 0 1 0 ${2 * HEAD} 0a${HEAD} ${HEAD * 1.1} 0 1 0 ${-2 * HEAD} 0Z`, 'mq', null, 0);
    out += leg(G.leg1, G, 'mq', hl) + arm(G.arm1, G, 'mq', hl);
    return out;
  }
  /* squelette d'apercu camera: segments fins et articulations */
  function skeleton(G) {
    const L = (a, b) => `<line class="sk-l" x1="${f1(a[0])}" y1="${f1(a[1])}" x2="${f1(b[0])}" y2="${f1(b[1])}"/>`;
    const Dt = c => `<circle class="sk-j" cx="${f1(c[0])}" cy="${f1(c[1])}" r="4"/>`;
    let s = L(G.S, G.arm1.J) + L(G.arm1.J, G.arm1.W) + L(G.S, G.H) + L(G.H, G.leg1.J) + L(G.leg1.J, G.leg1.A) + L(G.leg1.A, G.leg1.T) + L(G.S, G.head);
    s += `<circle class="sk-l sk-h" cx="${f1(G.head[0])}" cy="${f1(G.head[1])}" r="9"/>`;
    s += Dt(G.S) + Dt(G.arm1.J) + Dt(G.arm1.W) + Dt(G.H) + Dt(G.leg1.J) + Dt(G.leg1.A) + Dt(G.leg1.T);
    return s;
  }

  const has = k => !!SETS[k];
  const get = k => SETS[k];
  /** conteneur SVG; le contenu est rempli par frame() */
  const box = (cls, label, setKey) => `<svg class="mq-svg ${cls || ''}" viewBox="${(SETS[setKey] && SETS[setKey].vb) || '0 0 260 240'}" role="img" aria-label="${label || 'Aperçu du mouvement'}" focusable="false"><g class="mq-g"></g></svg>`;
  return { SETS, has, get, frame, sample, box, geo, FL };
})();

/* ---------- mannequin anime (apercu du mouvement) ---------- */
const mq = { raf: 0, s: 0, dir: 1, playing: false, hold: 0, last: 0 };
function mqHl() { const it = TI[ui.key]; return { p: it.p, s: it.s }; }
function mqNames() { const it = TI[ui.key]; return it.poseNames || (Mannequin.get(it.pose) || {}).names || []; }
function mqDraw() {
  const g = $('#app .mq-g'), it = TI[ui.key];
  if (!g || !it) return;
  g.innerHTML = Mannequin.frame(it.pose, mq.s, { hl: mqHl() });
  const names = mqNames(), n = names.length, idx = Math.round(mq.s * (n - 1));
  const nm = $('#mq-nm'); if (nm) nm.textContent = n > 1 ? (n > 2 ? (idx + 1) + '. ' : '') + names[idx] : '';
  const bar = $('#mq-bar'); if (bar) bar.innerHTML = names.map((_, i) => `<i class="${i === idx ? 'on' : ''}"></i>`).join('');
  const sl = $('#mq-slider'); if (sl && document.activeElement !== sl) sl.value = Math.round(mq.s * 1000);
}
function mqSetPlaying(on) {
  mq.playing = on;
  const b = $('#mq-play'); if (b) b.innerHTML = icon(on ? 'pause' : 'play');
  cancelAnimationFrame(mq.raf);
  if (on) { mq.last = 0; mq.raf = requestAnimationFrame(mqLoop); }
}
function mqLoop(ts) {
  if (!mq.playing) return;
  const dt = mq.last ? Math.min(0.1, (ts - mq.last) / 1000) : 0;
  mq.last = ts;
  const n = mqNames().length || 2;
  if (mq.hold > 0) mq.hold -= dt;
  else {
    mq.s += mq.dir * dt / (1.25 * (n - 1));
    if (mq.s >= 1) { mq.s = 1; mq.dir = -1; mq.hold = 0.7; }
    if (mq.s <= 0) { mq.s = 0; mq.dir = 1; mq.hold = 0.7; }
  }
  mqDraw();
  mq.raf = requestAnimationFrame(mqLoop);
}
function startMq() {
  mq.s = 0; mq.dir = 1; mq.hold = 0.5;
  mqDraw();
  mqSetPlaying(!reducedMotion());
}
function stopMq() { mq.playing = false; cancelAnimationFrame(mq.raf); }

/* ============================================================
   ui_b.js : avant la serie (douleur), comptage en direct (SIMULATION),
   resultat, onglet Ranked, test de promotion.

/* ---------- avant la serie ---------- */
function startExercise(ctx, key) {
  key = key || ui.key;
  const it = TI[key];
  if (!it) return;
  ctx = ctx || 'train';
  if (!it.ranked) { beginLive({ key, ctx, ranked: false, free: false }); return; }
  const can = ctx === 'promo' ? { ok: true } : Core.canAttempt(S, it.ex, nowMs());
  ui.pre = { key, ctx, pain: 0, free: !can.ok, remaining: can.remaining || 0 };
  openSheet({ type: 'pre' });
}
function painMsg(p) {
  return p >= 6 ? `<div class="notice bad" role="alert">À 6 sur 10 ou plus, on s'arrête. Choisis un exercice plus facile.</div>` : '';
}
function preSheet() {
  const P = ui.pre, it = TI[P.key];
  const free = P.free ? `<div class="notice">Série libre : déjà classée il y a moins de 48 h. Elle ne comptera pas.</div>` : '';
  return `<h2 id="sheet-t">Avant de commencer</h2><div class="muted" style="margin:-4px 0 6px">${esc(it.name)}</div>
    <div class="slider-row"><label for="pain">Douleur de tendon ou d'articulation : <b id="pain-val">${P.pain}</b> sur 10</label>
    <input type="range" id="pain" data-in="pain" min="0" max="10" step="1" value="${P.pain}"></div>
    <p class="dim" style="font-size:15px;margin:0 0 10px">La fatigue des muscles ne compte pas.</p>
    <div id="pain-msg">${painMsg(P.pain)}</div>${free}
    <div class="acts"><button class="btn primary focus-first" type="button" id="btn-pre-go" data-act="pre-go"${P.pain >= 6 ? ' disabled' : ''}>C'est parti</button></div>`;
}

/* ---------- comptage en direct (simulation) ---------- */
const skel = { raf: 0, s: 0, anim: null, phase: '' };
const CUE = { push: 'Descends plus bas', legs: 'Descends plus bas', pull: 'Monte plus haut', core: 'Monte les jambes plus haut', skills: 'Lance la jambe plus haut' };
const HOLD_FB = ['Corps aligné', 'Serre les abdos', 'Continue, respire'];
function liveSet(it) { return it.pose && Mannequin.has(it.pose) ? it.pose : FAM_POSE[it.fam]; }
function beginLive(o) {
  const it = TI[o.key];
  const tp = pendingTrophy(o.key);
  ui.live = { key: o.key, ctx: o.ctx, ranked: !!o.ranked, free: !!o.free, reps: 0, secs: 0, target: tp, hold: !!it.hold };
  closeSheet();
  render();
}
function liveGoal(L) {
  const it = TI[L.key];
  if (L.ctx === 'promo' && ui.pr && ui.pr.targets && ui.pr.targets[L.key]) return goalText(ui.pr.targets[L.key]);
  return L.target ? goalText(L.target) : (it.hold ? 'Tiens le plus longtemps possible' : 'Compte tes répétitions');
}
const clock = s => Math.floor(s / 60) + ':' + String(s % 60).padStart(2, '0');
function renderLive() {
  const root = $('#live-root');
  if (!ui.live) { if (root.firstChild) { root.innerHTML = ''; stopSkel(); } return; }
  if ($('#live')) return;
  const L = ui.live, it = TI[L.key];
  if (typeof camUsable === 'function' && camUsable(L)) { camRender(root, L, it); return; }
  const MANUAL = typeof LiveCam !== 'undefined';
  root.innerHTML = `<div class="live" id="live" role="dialog" aria-modal="true" aria-label="Série en cours : ${esc(it.name)}"><div class="inner">
    <div class="hd"><button class="ibtn" type="button" id="btn-live-quit" data-act="live-quit" aria-label="Quitter sans enregistrer">${icon('cross')}</button><div class="nm">${esc(it.name)}</div></div>
    <div class="cam"><div class="sim">${MANUAL ? 'Comptage à la main : touche le bouton à chaque répétition.' : 'Aperçu : la vraie caméra se branche dans la version téléphone'}</div>
      <svg class="skel" viewBox="0 0 260 240" preserveAspectRatio="xMidYMid meet" aria-hidden="true" focusable="false"><g id="skel-g"></g></svg>
      <div class="reps"><div class="cnt" id="live-cnt">${L.hold ? '0:00' : '0'}</div><div class="goal" id="live-goal">${esc(liveGoal(L))}</div></div>
      <div class="fb" id="live-fb" role="status" aria-live="polite">Mets-toi en position</div></div>
    <div class="bt"><div class="two"><button class="btn" type="button" id="btn-sim" data-act="live-sim">${MANUAL ? (L.hold ? '+1 seconde' : '+1 répétition') : (L.hold ? 'Simuler 1 seconde' : 'Simuler une répétition')}</button>${S.trial ? `<button class="btn" type="button" id="btn-sim5" data-act="live-sim5" aria-label="${L.hold ? 'Simuler 5 secondes' : 'Simuler 5 répétitions'}">+5</button>` : ''}</div>
      <button class="btn primary block" type="button" id="btn-end" data-act="live-end">Terminer</button></div></div></div>`;
  $('#btn-sim').focus({ preventScroll: true });
  startSkel();
}
function liveFb(txt, cls) { const f = $('#live-fb'); if (f) { f.textContent = txt; f.className = 'fb' + (cls ? ' ' + cls : ''); } }
function liveUpdate(bump) {
  const L = ui.live; if (!L) return;
  const c = $('#live-cnt');
  if (c) {
    c.textContent = L.hold ? clock(L.secs) : String(L.reps);
    if (bump && !reducedMotion()) { c.classList.remove('pop'); void c.offsetWidth; c.classList.add('pop'); }
  }
}
function liveSim(n) {
  const L = ui.live; if (!L) return;
  n = n || 1;
  if (L.hold) {
    L.secs += n; liveUpdate(true);
    liveFb(HOLD_FB[L.secs % 3], 'good');
    skel.anim = null;
  } else {
    L.reps += n; liveUpdate(true);
    if (reducedMotion()) liveFb('Répétition validée', 'good');
    else { skel.anim = { t0: performance.now(), dur: 1200 }; skel.phase = ''; }
  }
}
function startSkel() {
  stopSkel();
  const L = ui.live, it = TI[L.key];
  skel.set = liveSet(it); skel.s = L.hold ? 1 : 0; skel.anim = null; skel.phase = '';
  skelDraw(skel.s);
  if (!reducedMotion()) skel.raf = requestAnimationFrame(skelLoop);
}
function stopSkel() { cancelAnimationFrame(skel.raf); skel.raf = 0; skel.anim = null; }
function skelDraw(s) {
  const g = $('#skel-g');
  if (g) g.innerHTML = Mannequin.frame(skel.set, s, { skeleton: true });
}
function skelLoop(ts) {
  const L = ui.live; if (!L) return;
  let s;
  if (skel.anim) {
    const p = (ts - skel.anim.t0) / skel.anim.dur;
    if (p >= 1) { skel.anim = null; s = 0; liveFb('Répétition validée', 'good'); skel.phase = 'done'; }
    else {
      s = p < 0.5 ? p * 2 : (1 - p) * 2; s = s * s * (3 - 2 * s);
      const ph = p < 0.4 ? 'cue' : 'align';
      if (ph !== skel.phase) { skel.phase = ph; liveFb(ph === 'cue' ? CUE[TI[L.key].fam] : 'Corps aligné', ph === 'cue' ? 'warn' : ''); }
    }
  } else if (L.hold) s = 1 - 0.035 * (1 + Math.sin(ts / 650));
  else s = 0.025 * (1 + Math.sin(ts / 700));
  skelDraw(s);
  skel.raf = requestAnimationFrame(skelLoop);
}
function liveQuit() { stopSkel(); if (typeof camClose === 'function') camClose(ui.live); ui.live = null; render(); }
function liveEnd() {
  const L = ui.live; if (!L) return;
  let perf = L.hold ? L.secs : L.reps;
  if (L.cam) { const r = L.cam.ctl ? L.cam.ctl.finish() : null; perf = r ? r.perf : 0; camClose(L); }
  stopSkel();
  const key = L.key, ctx = L.ctx, free = L.free, ranked = L.ranked;
  ui.live = null;
  if (!(perf > 0)) { render(); toast('Série vide : rien n\'est enregistré.'); return; }
  if (ctx === 'promo') { promoRecord(key, perf); return; }
  recordTraining(key, perf, ranked, free);
}

/* ---------- enregistrement d'une serie d'entrainement ---------- */
function recordTraining(key, perf, ranked, free) {
  const it = TI[key], now = nowMs();
  const before = Core.derive(S, now), lvBefore = Troph.level(S);
  let att = null, got = [];
  if (it.ranked && !free) {
    att = Core.recordAttempt(S, { ex: it.ex, variant: it.variant, perf, status: 'validated', source: 'ranked' }, now);
    got = Troph.award(S, it.ex, it.variant, perf, now);
  }
  S.log.push({ key, ts: now, perf });
  if (S.log.length > 200) S.log.shift();
  const up = Troph.levelUp(S);
  const auto = up ? null : Core.normalize(S, now);
  const ev = up ? { type: 'promotion', rank: S.earned, from: up.from, to: up.to } : auto;
  save();
  const after = Core.derive(S, now);
  ui.result = { key, perf, ranked: !!att, free: !!free, before, after, att, got, ev, lvBefore };
  ui.back = null;
  go('train');
  if (ev) cinematic(ev.rank, () => openSheet({ type: 'result' }));
  else openSheet({ type: 'result' });
}
function resultSheet() {
  const R = ui.result, it = TI[R.key];
  const bits = [];
  bits.push(`<h2 id="sheet-t">Série terminée</h2><div class="big">${esc(it.hold ? fmtNum(R.perf) : fmtNum(R.perf))} <small>${it.hold ? 's' : (R.perf > 1 ? 'répétitions' : 'répétition')}${it.hold ? '' : esc(sideOf(it))}</small></div>`);
  if (R.ranked && R.att) {
    const eb = R.before.ex[it.ex], ea = R.after.ex[it.ex];
    const d = (a, b) => { if (a == null || b == null) return ''; const x = Math.round(b) - Math.round(a); return x > 0 ? ` <span class="up">+${fmt(x)}</span>` : ''; };
    if (R.att.eloPerf == null) bits.push(`<div class="notice" style="margin-top:12px">Moins de 5 secondes : pas classé.</div>`);
    else {
      bits.push(`<dl class="kv"><dt>Performance</dt><dd>${fmt(R.att.eloPerf)}</dd><dt>ELO de l'exercice</dt><dd>${eb ? fmt(eb.elo) : '–'} → ${fmt(ea.elo)}${d(eb ? eb.elo : null, ea.elo)}</dd>

/* ---------- test de promotion ---------- */
function promoOptions(info) {
  const target = info.target, out = {};
  Object.keys(info.eligible).forEach(c => {
    const list = [];
    info.eligible[c].forEach(ex => {
      const b = Core.EX[ex];
      if (b.measure === 'variant') {
        const v = Core.ladderFor(ex).variants.find(x => x.entry_rank === target);
        if (v && TI[ex + ':' + v.variant]) list.push({ key: ex + ':' + v.variant, ex, variant: v.variant, target: 5, hold: true });
      } else if (TI[ex]) {
        const sd = Core.standardFor(ex, target);
        list.push({ key: ex, ex, variant: null, target: b.measure === 'meters' ? sd.value : Math.ceil(sd.value - 1e-9), hold: !!TI[ex].hold });
      }
    });
    if (list.length) out[c] = list;
  });
  return out;
}
function openPromo() {
  const info = Core.promotionInfo(S, D, nowMs());
  if (!D.gateOpen || !info.delay.ok) return;
  const opts = promoOptions(info);
  ui.pr = { step: 'pick', picks: {}, i: 0, perfs: {}, opts, targets: {}, result: null, target: info.target };
  Object.keys(opts).forEach(c => opts[c].forEach(o => { ui.pr.targets[o.key] = { key: o.key, target: o.target, hold: o.hold }; }));
  go('promo');
}
const prKeys = () => FAM_ORDER.map(c => ui.pr.picks[c]).filter(Boolean);
const prOpt = key => { for (const c of Object.keys(ui.pr.opts)) { const o = ui.pr.opts[c].find(x => x.key === key); if (o) return o; } return null; };
function promoView() {
  const p = ui.pr;
  if (!p) return `<section class="stack"><div class="sub"><button class="ibtn" type="button" data-act="promo-exit" aria-label="Retour">${icon('back')}</button><h1>Promotion</h1></div></section>`;

    const groups = FAM_ORDER.filter(c => p.opts[c]).map(c => `<div class="pgroup"><h3>${FAM[c].label}</h3>${p.opts[c].map(o => {

    }).join('')}</div>`).join('');

  }

function promoRecord(key, perf) {
  const p = ui.pr, o = prOpt(key);

/* ============================================================
   profile.js : compte local (pseudo + identifiant), ecran d'accueil, sauvegarde.
   Le compte vit sur l'appareil (cle separee de la progression). Un compte en ligne
   (email, classement mondial, synchro) demande un serveur: voir docs/accounts.md.
   ============================================================ */
const Account = (() => {
  const KEY = 'cali-account-v1';
  const ALPHA = 'ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  let acc = null;
  try { acc = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch (e) { acc = null; }
  if (!(acc && typeof acc.id === 'string' && typeof acc.name === 'string')) acc = null;

  function persist() { try { if (acc) localStorage.setItem(KEY, JSON.stringify(acc)); } catch (e) { /* sans effet */ } }
  function newId() {
    const a = new Uint8Array(8);
    if (window.crypto && crypto.getRandomValues) crypto.getRandomValues(a); else for (let i = 0; i < 8; i++) a[i] = Math.floor(Math.random() * 256);
    let s = '';
    for (let i = 0; i < 8; i++) { s += ALPHA[a[i] % 32]; if (i === 3) s += '-'; }
    return s;
  }
  function check(raw) {
    const n = String(raw == null ? '' : raw).trim().replace(/\s+/g, ' ');
    if (n.length < 3) return { ok: false, msg: 'Au moins 3 caractères.' };
    if (n.length > 16) return { ok: false, msg: '16 caractères au maximum.' };
    if (!/^[\p{L}\p{N} ._-]+$/u.test(n)) return { ok: false, msg: 'Lettres, chiffres, espace, point, tiret et soulignement seulement.' };
    return { ok: true, name: n };
  }
  function create(name) { const c = check(name); if (!c.ok) return c; acc = { v: 1, id: acc ? acc.id : newId(), name: c.name, created: acc ? acc.created : Date.now() }; persist(); return c; }
  function get() { return acc; }
  /* compte en ligne : l'identifiant public et le pseudo viennent du serveur (source de vérité) */
  function setFromCloud(id, name) { acc = { v: 1, id: String(id), name: String(name), created: acc ? acc.created : Date.now() }; persist(); }
  function wipe() { acc = null; try { localStorage.removeItem(KEY); } catch (e) { /* sans effet */ } }

  /* sauvegarde: texte unique (compte + progression) a copier et coller sur un autre telephone */
  function pack(state) {
    const json = JSON.stringify({ app: 'cali-ranked', v: 1, account: acc, state });
    return 'CALI1.' + btoa(unescape(encodeURIComponent(json)));
  }
  function unpack(text) {
    try {
      const t = String(text || '').trim();
      if (!t.startsWith('CALI1.')) return null;
      const o = JSON.parse(decodeURIComponent(escape(atob(t.slice(6)))));
      if (!o || o.app !== 'cali-ranked' || !o.account || !o.state) return null;
      if (!check(o.account.name).ok || typeof o.account.id !== 'string') return null;
      const s = o.state;
      if (!(s && s.v === 2 && Array.isArray(s.attempts) && typeof s.earned === 'string' && Core.rIdx(s.earned) >= 0 && s.onboarded)) return null;
      return o;
    } catch (e) { return null; }
  }
  function restore(o) { acc = { v: 1, id: o.account.id, name: o.account.name, created: o.account.created || Date.now() }; persist(); }
  return { get, create, check, wipe, pack, unpack, restore, setFromCloud };
})();

/* ==========================================================================
   repcore.js : logique de comptage PURE (aucun DOM, aucune dépendance).
   Entrée : un flux de "frames" { t (ms), aspect (largeur/hauteur), lm: [33 points

      minRepMs: 350,         // une répétition plus courte est considérée comme du bruit
      minPhaseMs: 100,       // durée minimale de la descente et de la montée

      use3D: true,           // angles calculés avec les landmarks monde (valables de face, de profil, de trois quarts)
      autoCalib: true        // adapte le seuil "bras tendus" à ce que la caméra mesure vraiment chez toi
    },
    pushup: {
      down: 118,             // coude en bas : angle sous lequel la pompe est assez profonde (l'IA mesure ~100° pour un vrai 90°)
      up: 150,               // bras tendus : angle au-dessus duquel on est "en haut"
      attempt: 140,          // sous cet angle, on compte une tentative (même rejetée)
      hyst: 10,              // hystérésis (sortie de la zone haute à up - hyst)
      reversal: 22,          // remontée puis nouvelle descente sans verrouiller = "pas tendu"

      kipSwing: 0.45,        // amplitude horizontale des hanches tolérée (en longueurs de tronc)
      kipSpeed: 2.4,         // vitesse horizontale des hanches tolérée (tronc / seconde)
