  /* angle en degrés au point b, entre les segments b->a et b->c (2D ou 3D) */
  function angleDeg(a, b, c) {
    const ux = a.x - b.x, uy = a.y - b.y, uz = (a.z || 0) - (b.z || 0);
    const vx = c.x - b.x, vy = c.y - b.y, vz = (c.z || 0) - (b.z || 0);
    const nu = Math.hypot(ux, uy, uz), nv = Math.hypot(vx, vy, vz);
    if (nu * nv < 1e-9) return NaN;
    return Math.acos(clamp((ux * vx + uy * vy + uz * vz) / (nu * nv), -1, 1)) * 180 / Math.PI;
  }

  /* point 2D corrigé du rapport largeur/hauteur de l'image */
  function pt(f, idx) {
    const p = f.lm[idx], asp = f.aspect || 1;
    return { x: p.x * asp, y: p.y, z: 0 };
  }

  function jointAngle(f, ia, ib, ic, use3D) {
    if (use3D && f.wl && f.wl[ia] && f.wl[ib] && f.wl[ic]) return angleDeg(f.wl[ia], f.wl[ib], f.wl[ic]);
    return angleDeg(pt(f, ia), pt(f, ib), pt(f, ic));
  }

  /* +1 si la hanche est sous la ligne épaule-cheville (affaissée), -1 si au-dessus (fesses hautes) */
  function sagSign(S, H, A) {
    const dx = A.x - S.x, dy = A.y - S.y, l2 = dx * dx + dy * dy;
    if (l2 < 1e-9) return 1;
    const t = ((H.x - S.x) * dx + (H.y - S.y) * dy) / l2;
    return H.y > S.y + t * dy ? 1 : -1;
  }

  /* ------------------------------------------------------------------ */
  /* 4. FILTRE ONE-EURO (lissage des landmarks)                          */
  /* ------------------------------------------------------------------ */
  class OneEuro {
    constructor(minCutoff, beta, dCutoff) {
      this.minCutoff = minCutoff; this.beta = beta; this.dCutoff = dCutoff || 1.0;
      this.reset();
    }
    reset() { this.x = null; this.dx = 0; this.t = null; }
    static alpha(cutoff, dt) { const tau = 1 / (2 * Math.PI * cutoff); return 1 / (1 + tau / dt); }
    filter(v, tSec) {
      if (this.t === null) { this.x = v; this.dx = 0; this.t = tSec; return v; }
      let dt = tSec - this.t; this.t = tSec;
      if (!(dt > 1 / 120)) dt = 1 / 120;
      const dxRaw = (v - this.x) / dt;
      const aD = OneEuro.alpha(this.dCutoff, dt);
      this.dx = aD * dxRaw + (1 - aD) * this.dx;
      const cutoff = this.minCutoff + this.beta * Math.abs(this.dx);
      const a = OneEuro.alpha(cutoff, dt);
      this.x = a * v + (1 - a) * this.x;
      return this.x;
    }
  }

  function createSmoother(common) {
    const banks = { lm: {}, wl: {} };
    function bank(key, i, k) {
      const id = i + k;
      if (!banks[key][id]) banks[key][id] = new OneEuro(common.smoothMinCutoff, common.smoothBeta, 1.0);
      return banks[key][id];
    }
    function smoothArr(arr, key, tSec) {
      if (!arr) return null;
      return arr.map(function (p, i) {
        if (!p) return p;
        const out = Object.assign({}, p);
        const vis = (p.visibility === undefined || p.visibility === null) ? 1 : p.visibility;
        ['x', 'y', 'z'].forEach(function (k) {
          if (typeof p[k] !== 'number') return;
          const fl = bank(key, i, k);
          if (vis < 0.3) fl.reset(); else out[k] = fl.filter(p[k], tSec);
        });
        return out;
      });
    }
    return {
      apply: function (frame) {
        const tSec = frame.t / 1000;
        return { t: frame.t, aspect: frame.aspect || 1, lm: smoothArr(frame.lm, 'lm', tSec), wl: smoothArr(frame.wl, 'wl', tSec) };
      },
      reset: function () { banks.lm = {}; banks.wl = {}; }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 5. VISIBILITÉ ET CHOIX DU CÔTÉ                                      */
  /* ------------------------------------------------------------------ */
  function visOf(p) {
    if (!p) return 0;
    const v = (p.visibility === undefined || p.visibility === null) ? 1 : p.visibility;
    if (p.x < -0.03 || p.x > 1.03 || p.y < -0.03 || p.y > 1.03) return 0; // hors cadre
    return v;
  }

  function sideInfo(f, side, joints, minV) {
    const m = SIDES[side]; const miss = []; let sum = 0;
    joints.forEach(function (j) {
      const v = visOf(f.lm[m[j]]); sum += v;
      if (v < minV) miss.push(j);
    });
    return { side: side, ok: miss.length === 0, miss: miss, avg: sum / joints.length };
  }

  function headPoint(f, minV) {
    const cand = [];
    [LM.MOUTH_L, LM.MOUTH_R].forEach(function (i) { if (visOf(f.lm[i]) >= minV) cand.push(pt(f, i)); });
    if (!cand.length && visOf(f.lm[LM.NOSE]) >= minV) cand.push(pt(f, LM.NOSE));
    if (!cand.length) return null;
    return { x: mean(cand.map(function (p) { return p.x; })), y: mean(cand.map(function (p) { return p.y; })) };
  }

  /* Inclinaison du torse (milieu des épaules vers milieu des hanches) par rapport à la verticale de l'image :
     0° = debout, 90° = à l'horizontale (couché, position de pompe). null = pas mesurable (hanches non vues, torse pointé vers la caméra).
     On utilise les landmarks monde (3D) quand ils existent : de face, le torse d'une personne en pompe est écrasé en 2D. */
  function torsoIncl(f, minV, use3D) {
    const sh = [], hp = [];
    ['L', 'R'].forEach(function (s) {
      const m = SIDES[s];
      if (visOf(f.lm[m.sh]) >= minV && visOf(f.lm[m.hip]) >= minV) { sh.push(m.sh); hp.push(m.hip); }
    });
    if (!sh.length) return null;
    let v;
    if (use3D && f.wl && sh.every(function (i) { return f.wl[i]; }) && hp.every(function (i) { return f.wl[i]; })) {
      const avg = function (arr, k) { return mean(arr.map(function (i) { return f.wl[i][k]; })); };
      v = { x: avg(sh, 'x') - avg(hp, 'x'), y: avg(sh, 'y') - avg(hp, 'y'), z: avg(sh, 'z') - avg(hp, 'z') };
    } else {
      const avg = function (arr, k) { return mean(arr.map(function (i) { return pt(f, i)[k]; })); };
      v = { x: avg(sh, 'x') - avg(hp, 'x'), y: avg(sh, 'y') - avg(hp, 'y'), z: 0 };
      if (Math.hypot(v.x, v.y) < 0.05) return null;
    }
    const n = Math.hypot(v.x, v.y, v.z);
    if (n < 1e-6) return null;
    return Math.acos(clamp(Math.abs(v.y) / n, 0, 1)) * 180 / Math.PI; // valeur absolue : insensible au sens de l'axe y
  }

  function analyze(exercise, f, cfg, ctx) {
    const spec = NEEDS[exercise];
    const minV = cfg.common.minVisibility;
    let mode = spec.mode;
    if (exercise === 'dip' && cfg.dip.view === 'front') mode = 'mean';
    const sv = { L: sideInfo(f, 'L', spec.joints, minV), R: sideInfo(f, 'R', spec.joints, minV) };
    let sides = [], missing = [];
    const bestInfo = sv.L.avg >= sv.R.avg ? sv.L : sv.R;
    if (mode === 'mean') {
      sides = ['L', 'R'].filter(function (s) { return sv[s].ok; });
      if (!sides.length) missing = bestInfo.miss.slice();
    } else {
      if (sv.L.ok && sv.R.ok) {
        const lo = Math.min(sv.L.avg, sv.R.avg), hi = Math.max(sv.L.avg, sv.R.avg);
        // les deux côtés sont bien vus (de face, trois quarts) : on moyenne ; sinon on garde le meilleur côté
        if (spec.multi && lo >= 0.5 && lo >= 0.7 * hi) sides = ['L', 'R'];
        else sides = [(ctx.side === 'L' || ctx.side === 'R') ? ctx.side : bestInfo.side];
      }
      else if (sv.L.ok) sides = ['L'];
      else if (sv.R.ok) sides = ['R'];
      else missing = bestInfo.miss.slice();
      if (sides.length) ctx.side = sides[0] === 'L' || sides[0] === 'R' ? sides[0] : ctx.side;
    }
    let head = null;
    if (spec.head && sides.length) { head = headPoint(f, minV); if (!head && spec.head !== 'optional') missing.push('head'); }
    // articulations de contrôle de la forme (hanches, chevilles) : utilisées seulement si un côté les montre toutes
    let optSide = null;
    if (spec.optional && sides.length) {
      const order = sides.length === 2 ? [ctx.side || 'L', ctx.side === 'R' ? 'L' : 'R'] : sides.concat(sides[0] === 'L' ? ['R'] : ['L']);
      for (let i = 0; i < order.length; i++) {
        const info = sideInfo(f, order[i], spec.optional, minV);
        if (info.ok) { optSide = order[i]; break; }
      }
    }
    const shown = mode === 'mean' ? ['L', 'R'] : [sides.length ? sides[0] : bestInfo.side];
    const needed = [];
    shown.forEach(function (s) {
      spec.joints.forEach(function (j) {
        const idx = SIDES[s][j];
        needed.push({ idx: idx, ok: visOf(f.lm[idx]) >= minV });
      });
    });
    const q = mean(needed.map(function (n) { return visOf(f.lm[n.idx]); }));
    return { ok: sides.length > 0 && missing.length === 0, sides: sides, missing: missing, head: head, optSide: optSide, quality: q, needed: needed };
  }

  function missingMessage(exercise, missing) {
    const spec = NEEDS[exercise];
    const seen = {}; const names = [];
    missing.forEach(function (j) { if (!seen[j]) { seen[j] = 1; names.push(JOINT_FR[j] || j); } });
    if (!names.length) return '';
    let list = names[0];
    if (names.length > 1) list = names.slice(0, -1).join(', ') + ' et ' + names[names.length - 1];
    return 'Je ne vois pas ' + list + ': ' + spec.hint + '.';
  }

  function framingStatus(exercise, frame, userCfg) {
    const cfg = mergeConfig(userCfg);
    if (!frame || !frame.lm) return { ok: false, missing: ['body'], message: 'Je ne te vois pas: place-toi devant la caméra, en entier.', quality: 0, needed: [] };
    const an = analyze(exercise, frame.lm ? { t: frame.t, aspect: frame.aspect, lm: frame.lm, wl: frame.wl } : frame, cfg, { side: null });
    return {
      ok: an.ok, missing: an.missing, quality: an.quality, needed: an.needed,
      message: an.ok ? 'Cadrage correct: tu peux commencer.' : missingMessage(exercise, an.missing)
    };
  }

  /* ------------------------------------------------------------------ */
  /* 6. MOTEUR DE RÉPÉTITIONS (hystérésis, durées minimales, rejets)     */
  /*    phases : init -> extended -> flexing -> flexed -> extending      */
  /* ------------------------------------------------------------------ */
  function createBendEngine(p, hooks) {
    let phase = 'init', rep = null;
    const res = { valid: 0, rejected: 0, glitches: 0, aborted: 0, reps: [] };

    function newRep(t, a, startedExtended) {
      rep = Object.assign({ tStart: t, startedExtended: startedExtended, minA: a, tMin: t, maxSince: a }, hooks.newRep());
    }
    function track(t, a, extra) {
      if (a < rep.minA) { rep.minA = a; rep.tMin = t; }
      hooks.track(rep, t, a, extra, phase);
    }
    function finish(t, events, lockoutFail) {
      const r = rep; rep = null;
      r.tEnd = t;
      const dur = t - r.tStart;
      if (r.minA > p.attempt) { res.glitches++; return; } // simple rebond en haut : ignoré (ni valide, ni rejeté)
      if (dur < p.minRepMs || (r.tMin - r.tStart) < p.minPhaseMs || (t - r.tMin) < p.minPhaseMs) { if (!lockoutFail) { res.glitches++; return; } }
      let reasons = hooks.evaluate(r, p) || [];
      if (lockoutFail) reasons = [{ code: 'lockout', text: hooks.lockoutText(r, p) }].concat(reasons);
      r.reasons = reasons; r.valid = reasons.length === 0;
      r.durMs = dur; r.downMs = r.tMin - r.tStart; r.upMs = t - r.tMin;
      if (r.valid) res.valid++; else res.rejected++;
      r.n = res.valid + res.rejected;
      res.reps.push({ n: r.n, valid: r.valid, reasons: reasons, tStart: r.tStart, tEnd: t, durMs: dur, downMs: r.downMs, upMs: r.upMs, minA: round(r.minA, 1) });
      events.push({ type: 'rep', valid: r.valid, count: res.valid, n: r.n, reasons: reasons, durMs: dur });
    }

    return {
      res: res,
      phase: function () { return phase; },
      currentRep: function () { return rep; },
      abort: function () { if (rep) { rep = null; res.aborted++; } phase = 'init'; },
      step: function (t, a, extra) {
        const events = [];
        switch (phase) {
          case 'init':
            if (a >= p.up) phase = 'extended';
            break;
          case 'extended':
            if (a < p.up - p.hyst) { phase = 'flexing'; newRep(t, a, true); track(t, a, extra); }
            break;
          case 'flexing':
            track(t, a, extra);
            if (a >= p.up) { finish(t, events, false); phase = 'extended'; }
            else if (a <= p.down) phase = 'flexed';
            break;
          case 'flexed':
            track(t, a, extra);
            if (a > p.down + p.hyst) { phase = 'extending'; rep.maxSince = a; }
            break;
          case 'extending':
            track(t, a, extra);
            rep.maxSince = Math.max(rep.maxSince, a);
            if (a >= p.up) { finish(t, events, false); phase = 'extended'; }
            else if (rep.maxSince - a >= p.reversal && a < p.up - p.hyst) {
              // il redescend avant d'avoir verrouillé : la répétition précédente est rejetée
              rep.maxAtEnd = rep.maxSince;
              finish(t, events, true);
              phase = 'flexing'; newRep(t, a, false);
            }
            else if (a <= p.down) phase = 'flexed';
            break;
        }
        return events;
      }
    };
  }

  /* ------------------------------------------------------------------ */
  /* 7. ADAPTATEURS PAR EXERCICE                                         */
  /* ------------------------------------------------------------------ */
  const LABELS = {
    std: { init: 'en attente', extended: 'haut', flexing: 'en descente', flexed: 'bas', extending: 'en montée' },
    pullup: { init: 'en attente', extended: 'bas (suspendu)', flexing: 'en montée', flexed: 'haut', extending: 'en descente' }
  };

  const REASON_LABELS = {
    depth: 'Pas assez bas',
    shoulders: 'Épaules pas assez descendues',
    sag: 'Hanches qui s\'affaissent',
    pike: 'Fesses trop hautes',
    lockout: 'Pas verrouillé / pas tendu',
    chin: 'Menton sous la barre',
    pull: 'Montée insuffisante',
    kip: 'Balancement (kipping)',
    shrug: 'Épaules haussées',
    line: 'Ligne du corps',
    axis: 'Orientation du corps'
  };
  function reasonLabel(exercise, code) {
    if (exercise === 'pullup' && code === 'lockout') return 'Bras pas tendus en bas';
    if (exercise === 'squat' && code === 'depth') return 'Cuisses pas parallèles';
    if (exercise === 'squat' && code === 'lockout') return 'Pas debout complètement';
    if ((exercise === 'pushup' || exercise === 'dip') && code === 'lockout') return 'Bras pas verrouillés en haut';
    return REASON_LABELS[code] || code;
  }

  function engineParams(c, common) {
    return { up: c.up, down: c.down, attempt: Math.max(c.attempt, c.down + 15), hyst: c.hyst, reversal: c.reversal, minRepMs: common.minRepMs, minPhaseMs: common.minPhaseMs };
  }

  const ADAPTERS = {};

  /* ---- Pompes (profil) ---- */
  ADAPTERS.pushup = function (cfg) {
    const c = cfg.pushup;
    return {
      params: engineParams(c, cfg.common),
      labels: LABELS.std,
      // position : on ne compte que si la personne n'est pas flagrante debout (torse proche de la verticale)
      gate: function (f) {
        const i = torsoIncl(f, cfg.common.minVisibility, cfg.common.use3D);
        if (i !== null && i < c.minIncl) return { all: true, msg: 'Je te vois debout: mets-toi en position de pompe (corps à l\'horizontale).' };
        // accroupi / squat : torse pas couché ET genoux franchement pliés (en pompe sur les pieds, les jambes restent tendues)
        if (i !== null && i < 75) {
          const ks = [];
          ['L', 'R'].forEach(function (s) {
            const m = SIDES[s];
            if (visOf(f.lm[m.hip]) >= cfg.common.minVisibility && visOf(f.lm[m.knee]) >= cfg.common.minVisibility && visOf(f.lm[m.ank]) >= cfg.common.minVisibility) ks.push(jointAngle(f, m.hip, m.knee, m.ank, cfg.common.use3D));
          });
          if (ks.length && mean(ks) < 130) return { all: true, msg: 'Je te vois accroupi: mets-toi en position de pompe.' };
        }
        return null;
      },
      measure: function (f, an) {
        // angle du coude : moyenne des côtés bien vus (de face ou de trois quarts, les deux bras comptent)
        const a = mean(an.sides.map(function (s) { const m = SIDES[s]; return jointAngle(f, m.sh, m.el, m.wr, cfg.common.use3D); }));
        const m0 = SIDES[an.sides[0]];
        const S0 = pt(f, m0.sh), E0 = pt(f, m0.el), W0 = pt(f, m0.wr);
        const armLen = dist(S0, E0) + dist(E0, W0);
        const extra = { dev: null, sag: 1, drop: armLen > 1e-6 ? (W0.y - S0.y) / armLen : 1 };
        // forme du corps : seulement si les hanches et les chevilles sont visibles
        if (an.optSide) {
          const m = SIDES[an.optSide];
          const S = pt(f, m.sh), H = pt(f, m.hip), A = pt(f, m.ank);
          extra.dev = 180 - angleDeg(S, H, A); extra.sag = sagSign(S, H, A);
        }
        return { a: a, extra: extra };
      },
      hooks: {
        newRep: function () { return { maxDev: 0, devSign: 1, minDrop: Infinity }; },
        track: function (rep, t, a, e) {
          if (e.dev !== null && e.dev > rep.maxDev) { rep.maxDev = e.dev; rep.devSign = e.sag; }
          if (e.drop < rep.minDrop) rep.minDrop = e.drop;
        },
        evaluate: function (r, p) {
          const out = [];
          if (r.minA > c.down) out.push({ code: 'depth', text: 'Pas assez bas: coude à ' + round(r.minA) + '° (objectif sous ' + c.down + '°)' });
          else if (c.useShoulderHeight && r.minDrop > c.shoulderDropMax) out.push({ code: 'shoulders', text: 'Épaules pas assez descendues vers les mains' });
          if (r.maxDev > c.bodyTol) {
            out.push(r.devSign > 0
              ? { code: 'sag', text: 'Hanches qui s\'affaissent (' + round(r.maxDev) + '° d\'écart avec la ligne droite)' }
              : { code: 'pike', text: 'Fesses trop hautes (' + round(r.maxDev) + '° d\'écart avec la ligne droite)' });
          }
          return out;
        },
        lockoutText: function (r, p) { return 'Bras pas verrouillés en haut (max ' + round(r.maxAtEnd) + '°, objectif ' + round(p.up) + '°)'; }
      },
      feedback: function (phase, m) {
        if (phase !== 'init' && m.extra.dev !== null && m.extra.dev > c.bodyTol) {
          return m.extra.sag > 0 ? ['Hanches qui s\'affaissent: serre les abdos et les fesses', 'warn'] : ['Fesses trop hautes: aligne les hanches', 'warn'];
        }
        switch (phase) {
          case 'init': return ['Mets-toi en position haute, bras tendus', 'info'];
          case 'extended': return ['Prêt: descends en gardant le corps droit', 'info'];
          case 'flexing': return ['Descends encore (coude sous ' + c.down + '°)', 'info'];
          case 'flexed': return ['Bien! Pousse vers le haut', 'ok'];
          default: return ['Tends complètement les bras', 'info'];
        }
      },
      metricsText: function (m) { return 'Coude ' + round(m.a) + '°' + (m.extra.dev !== null ? ' · ligne du corps ' + round(m.extra.dev) + '°' : ' · corps non visible (forme non contrôlée)'); }
    };
  };

  /* ---- Tractions (face / dos / profil) ---- */
  ADAPTERS.pullup = function (cfg) {
    const c = cfg.pullup;
    const hipBuf = [];
    return {
      params: engineParams(c, cfg.common),
      labels: LABELS.pullup,
      // on ne démarre une traction que suspendu à la barre : poignets nettement au-dessus des épaules (pas bras ballants)
      gate: function (f, an, phase) {
        if (phase !== 'init' && phase !== 'extended') return null;
        const vals = an.sides.map(function (s) {
          const m = SIDES[s], S = pt(f, m.sh), E = pt(f, m.el), W = pt(f, m.wr), arm = dist(S, E) + dist(E, W);
          return arm > 1e-6 ? (S.y - W.y) / arm : 1;
        });
        if (mean(vals) < 0.2) return { all: false, msg: 'Attrape la barre: tes poignets doivent être au-dessus de tes épaules.' };
        return null;
      },
      measure: function (f, an) {
        const angs = [], wy = [], arm = [], shx = [], shy = [];
        an.sides.forEach(function (s) {
          const m = SIDES[s];
          angs.push(jointAngle(f, m.sh, m.el, m.wr, cfg.common.use3D));
          const S = pt(f, m.sh), E = pt(f, m.el), W = pt(f, m.wr);
          wy.push(W.y); arm.push(dist(S, E) + dist(E, W)); shx.push(S.x); shy.push(S.y);
        });
        const a = mean(angs), wristY = mean(wy), armLen = mean(arm);
        const chinOver = an.head ? an.head.y <= wristY + c.chinMargin * armLen : null; // null = tête non visible : on se fie aux coudes
        // hanches (si visibles) : pour détecter le balancement
        const hips = [LM.L_HIP, LM.R_HIP].filter(function (i) { return visOf(f.lm[i]) >= cfg.common.minVisibility; }).map(function (i) { return pt(f, i); });
        let hxn = null, lxn = null;
        if (hips.length) {
          const hx = mean(hips.map(function (p) { return p.x; })), hy = mean(hips.map(function (p) { return p.y; }));
          const torso = Math.hypot(hx - mean(shx), hy - mean(shy));
          if (torso > 0.03) {
            hxn = hx / torso;
            // jambes (chevilles, sinon genoux) : un grand élan des jambes est du kipping même si les hanches bougent peu
            const legIdx = [LM.L_ANK, LM.R_ANK].filter(function (i) { return visOf(f.lm[i]) >= cfg.common.minVisibility; });
            const legs = (legIdx.length ? legIdx : [LM.L_KNEE, LM.R_KNEE].filter(function (i) { return visOf(f.lm[i]) >= cfg.common.minVisibility; })).map(function (i) { return pt(f, i); });
            if (legs.length) lxn = mean(legs.map(function (p) { return p.x; })) / torso;
          }
        }
        return { a: a, extra: { chinOver: chinOver, hxn: hxn, lxn: lxn, headY: an.head ? an.head.y : null, wristY: wristY } };
      },
      hooks: {
        newRep: function () { hipBuf.length = 0; return { chinOver: false, chinKnown: false, hxMin: Infinity, hxMax: -Infinity, lxMin: Infinity, lxMax: -Infinity, kipVel: 0 }; },
        track: function (rep, t, a, e) {
          if (e.chinOver !== null) rep.chinKnown = true;
          if (e.chinOver) rep.chinOver = true;
          if (e.lxn !== null) { rep.lxMin = Math.min(rep.lxMin, e.lxn); rep.lxMax = Math.max(rep.lxMax, e.lxn); }
          if (e.hxn !== null) {
            rep.hxMin = Math.min(rep.hxMin, e.hxn); rep.hxMax = Math.max(rep.hxMax, e.hxn);
            hipBuf.push({ t: t, x: e.hxn });
            while (hipBuf.length > 1 && t - hipBuf[1].t >= 200) hipBuf.shift();
            const old = hipBuf[0];
            if (t - old.t >= 150) rep.kipVel = Math.max(rep.kipVel, Math.abs(e.hxn - old.x) / ((t - old.t) / 1000));
          }
        },
        evaluate: function (r, p) {
          const out = [];
          if (r.chinKnown && !r.chinOver) out.push({ code: 'chin', text: 'Menton pas passé au-dessus de la barre' });
          else if (r.minA > c.down) out.push({ code: 'pull', text: 'Coudes pas assez fléchis en haut (' + round(r.minA) + '°)' });
          const swing = isFinite(r.hxMin) ? r.hxMax - r.hxMin : 0;
          const legSwing = isFinite(r.lxMin) ? r.lxMax - r.lxMin : 0;
          if (c.rejectKip && (swing > c.kipSwing || r.kipVel > c.kipSpeed)) {
            out.push({ code: 'kip', text: 'Un peu de balancement des hanches (kipping): essaie de rester gainé, sans élan' });
          } else if (c.rejectKip && legSwing > c.legSwing) {
            out.push({ code: 'kip', text: 'Gros à-coup des jambes (kipping): garde les jambes immobiles, sans élan' });
          }
          return out;
        },
        lockoutText: function (r) { return 'Bras pas tendus en bas: redescends en suspension complète (' + round(r.maxAtEnd) + '°)'; }
      },
      feedback: function (phase, m) {
        const chin = m.extra.chinOver !== false; // tête non visible : pas de reproche sur le menton
        switch (phase) {
          case 'init': return ['Suspends-toi, bras tendus, pour commencer', 'info'];
          case 'extended': return ['Prêt: tire-toi vers la barre', 'info'];
          case 'flexing': return chin ? ['Menton au-dessus de la barre: bien!', 'ok'] : ['Monte jusqu\'à passer le menton au-dessus de la barre', 'info'];
          case 'flexed': return chin ? ['Menton au-dessus: redescends en contrôle', 'ok'] : ['Monte encore: le menton doit dépasser la barre', 'warn'];
          default: return ['Redescends jusqu\'à avoir les bras tendus', 'info'];
        }
      },
      metricsText: function (m) { return 'Coude ' + round(m.a) + '°' + (m.extra.chinOver === null ? ' · tête non visible' : ' · menton ' + (m.extra.chinOver ? 'au-dessus' : 'sous') + ' la barre'); }
    };
  };

  /* ---- Squat (profil) ---- */
  ADAPTERS.squat = function (cfg) {
    const c = cfg.squat;
    return {
      params: engineParams(c, cfg.common),
      labels: LABELS.std,
      gate: function (f) {
        const i = torsoIncl(f, cfg.common.minVisibility, cfg.common.use3D);
        if (i !== null && i > c.maxIncl) return { all: true, msg: 'Je te vois couché: tiens-toi debout pour les squats.' };
        return null;
      },
      measure: function (f, an) {
        const m = SIDES[an.sides[0]];
        const raw = mean(an.sides.map(function (s) { const q = SIDES[s]; return jointAngle(f, q.hip, q.knee, q.ank, cfg.common.use3D); }));
        const H = pt(f, m.hip), K = pt(f, m.knee);
        const parallel = H.y >= K.y; // hanche au niveau du genou ou plus bas
        const a = parallel ? Math.min(raw, c.down - 1) : raw;
        return { a: a, extra: { raw: raw, parallel: parallel } };
      },
      hooks: {
        newRep: function () { return { minRaw: Infinity, parallel: false }; },
        track: function (rep, t, a, e) { rep.minRaw = Math.min(rep.minRaw, e.raw); if (e.parallel) rep.parallel = true; },
        evaluate: function (r) {
          const out = [];
          if (r.minA > c.down) out.push({ code: 'depth', text: 'Pas assez bas: cuisses pas parallèles (genou à ' + round(r.minRaw) + '°, objectif sous ' + c.down + '°)' });
          return out;
        },
        lockoutText: function (r) { return 'Pas complètement debout en haut (' + round(r.maxAtEnd) + '°)'; }
      },
      feedback: function (phase) {
        switch (phase) {
          case 'init': return ['Tiens-toi debout, jambes tendues', 'info'];
          case 'extended': return ['Prêt: descends en fléchissant les genoux', 'info'];
          case 'flexing': return ['Descends encore: cuisses au moins parallèles', 'info'];
          case 'flexed': return ['Bien! Remonte', 'ok'];
          default: return ['Remonte jusqu\'à être debout', 'info'];
        }
      },
      metricsText: function (m) { return 'Genou ' + round(m.extra.raw) + '°' + (m.extra.parallel ? ' · hanche sous le genou' : ''); }
    };
  };

  /* ---- Dips (profil ou face) ---- */
  ADAPTERS.dip = function (cfg) {
    const c = cfg.dip;
    let refGap = 0; // distance oreille-épaule de référence (en haut, épaules basses)
    return {
      params: engineParams(c, cfg.common),
      labels: LABELS.std,
      gate: function (f) {
        const i = torsoIncl(f, cfg.common.minVisibility, cfg.common.use3D);
        if (i !== null && i > c.maxIncl) return { all: true, msg: 'Je te vois couché: monte en appui sur les barres pour les dips.' };
        return null;
      },
      measure: function (f, an) {
        const angs = [], gaps = [];
        an.sides.forEach(function (s) {
          const m = SIDES[s];
          angs.push(jointAngle(f, m.sh, m.el, m.wr, cfg.common.use3D));
          // contrôle des épaules haussées : seulement si l'oreille ET la hanche sont visibles
          if (visOf(f.lm[m.ear]) >= cfg.common.minVisibility && visOf(f.lm[m.hip]) >= cfg.common.minVisibility) {
            const S = pt(f, m.sh), H = pt(f, m.hip), torso = dist(S, H);
            if (torso > 0.03) gaps.push((S.y - pt(f, m.ear).y) / torso);
          }
        });
        return { a: mean(angs), extra: { gap: gaps.length ? mean(gaps) : null } };
      },
      after: function (phase, m) {
        if ((phase === 'extended' || phase === 'init') && m.extra.gap !== null) refGap = Math.max(refGap, m.extra.gap);
      },
      hooks: {
        newRep: function () { return { topMinGap: Infinity }; },
        track: function (rep, t, a, e, phase) {
          if (e.gap !== null && (phase === 'extending') && a >= c.down + 30) rep.topMinGap = Math.min(rep.topMinGap, e.gap);
        },
        evaluate: function (r) {
          const out = [];
          if (r.minA > c.down) out.push({ code: 'depth', text: 'Pas assez bas: coude à ' + round(r.minA) + '° (objectif sous ' + c.down + '°)' });
          if (refGap > 0 && isFinite(r.topMinGap) && r.topMinGap < c.shrugRatio * refGap) {
            out.push({ code: 'shrug', text: 'Épaules qui montent vers les oreilles: pousse-les vers le bas en haut' });
          }
          return out;
        },
        lockoutText: function (r) { return 'Bras pas verrouillés en haut (max ' + round(r.maxAtEnd) + '°)'; }
      },
      feedback: function (phase, m) {
        if (phase === 'extended' && m.extra.gap !== null && refGap > 0 && m.extra.gap < c.shrugRatio * refGap) return ['Ne hausse pas les épaules: pousse-les vers le bas', 'warn'];
        switch (phase) {
          case 'init': return ['Monte en appui, bras tendus, pour commencer', 'info'];
          case 'extended': return ['Prêt: descends en contrôle', 'info'];
          case 'flexing': return ['Descends encore (coude sous ' + c.down + '°)', 'info'];
          case 'flexed': return ['Bien! Pousse vers le haut', 'ok'];
          default: return ['Tends complètement les bras', 'info'];
        }
      },
      metricsText: function (m) { return 'Coude ' + round(m.a) + '°'; }
    };
  };

  /* ------------------------------------------------------------------ */
  /* 8. MINUTEUR DE TENUE (poirier, gainage)                             */
  /* ------------------------------------------------------------------ */
  function createHoldTracker(h) {
    let state = 'idle', pendStart = 0, startT = 0, lastValidT = 0, invalidSince = null;
    const segs = [];
    function close() {
      const dur = lastValidT - startT;
      if (dur >= h.minHoldMs) segs.push({ startT: startT, endT: lastValidT, ms: dur });
      state = 'idle'; invalidSince = null;
    }
    function snap() {
      const cur = state === 'holding' ? lastValidT - startT : 0;
      let best = cur, total = cur;
      segs.forEach(function (s) { best = Math.max(best, s.ms); total += s.ms; });
      return { state: state, holding: state === 'holding', inGrace: state === 'holding' && invalidSince !== null, currentMs: cur, bestMs: best, totalMs: total, count: segs.length + (state === 'holding' && cur >= h.minHoldMs ? 1 : 0), segments: segs.slice() };
    }
    return {
      step: function (t, valid) {
        if (valid) {
          if (state === 'idle') { state = 'pending'; pendStart = t; }
          if (state === 'pending' && t - pendStart >= h.startMs) { state = 'holding'; startT = pendStart; }
          if (state === 'holding') { lastValidT = t; invalidSince = null; }
        } else if (state === 'pending') {
          state = 'idle';
        } else if (state === 'holding') {
          if (invalidSince === null) invalidSince = t;
          if (t - invalidSince > h.graceMs) close();
        }
        return snap();
      },
      end: function () { if (state === 'holding') close(); state = 'idle'; return snap(); },
      snapshot: snap
    };
  }

  function holdMeasure(exercise, cfg, f, an) {
    const h = cfg.hold;
    const m = SIDES[an.sides[0]];
    const S = pt(f, m.sh), H = pt(f, m.hip), A = pt(f, m.ank);
    const dev = 180 - angleDeg(S, H, A);
    const vx = A.x - S.x, vy = A.y - S.y;
    let axis, axisMsg;
    if (exercise === 'hold_handstand') {
      axis = vy < 0 ? Math.atan2(Math.abs(vx), -vy) * 180 / Math.PI : 180 - Math.atan2(Math.abs(vx), vy) * 180 / Math.PI;
      axisMsg = 'Pas assez à la verticale (' + round(axis) + '° d\'écart, tolérance ' + h.axisTol + '°)';
    } else {
      axis = Math.atan2(Math.abs(vy), Math.abs(vx)) * 180 / Math.PI;
      axisMsg = 'Corps pas assez horizontal (' + round(axis) + '° d\'inclinaison, tolérance ' + h.axisTol + '°)';
    }
    const sag = sagSign(S, H, A);
    let lineMsg;
    if (exercise === 'hold_plank') lineMsg = sag > 0 ? 'Hanches qui s\'affaissent (' + round(dev) + '° d\'écart, tolérance ' + h.bodyTol + '°): gaine' : 'Fesses trop hautes (' + round(dev) + '° d\'écart, tolérance ' + h.bodyTol + '°)';
    else lineMsg = 'Ligne du corps cassée (' + round(dev) + '° d\'écart, tolérance ' + h.bodyTol + '°): serre les fesses, gaine';
    const lineOk = dev <= h.bodyTol, axisOk = axis <= h.axisTol;
    return { dev: dev, axis: axis, valid: lineOk && axisOk, msg: !lineOk ? lineMsg : (!axisOk ? axisMsg : '') };
  }

  /* ------------------------------------------------------------------ */
  /* 9. COMPTEUR PRINCIPAL                                               */
  /* ------------------------------------------------------------------ */
  function createCounter(exercise, userCfg) {
    const spec = EXERCISES[exercise];
    if (!spec) throw new Error('Exercice inconnu: ' + exercise);
    const cfg = mergeConfig(userCfg);
    const smoother = createSmoother(cfg.common);
    const ctx = { side: null };
    const isHold = spec.kind === 'hold';
    let engine = null, adapter = null, hold = null;
    if (isHold) hold = createHoldTracker(cfg.hold);
    else { adapter = ADAPTERS[exercise](cfg); engine = createBendEngine(adapter.params, adapter.hooks); }
    let firstT = null, lastT = null, lastVisT = null, visibleFrames = 0, totalFrames = 0;
    const calib = { frames: 0, maxSeen: 0, done: false };
    let gateRun = 0;

    function fillCommon(out) {
      if (isHold) {
        const s = hold.snapshot();
        out.hold = s;
        out.reps = 0; out.attempts = 0; out.rejected = 0;
        out.phase = s.state;
        out.label = s.holding ? (s.inGrace ? 'je te perds…' : 'tenue en cours') : (s.state === 'pending' ? 'prise de position…' : 'en attente');
      } else {
        out.phase = engine.phase();
        out.label = adapter.labels[out.phase] || out.phase;
        out.reps = engine.res.valid; out.rejected = engine.res.rejected; out.attempts = engine.res.valid + engine.res.rejected;
      }
    }

    function push(frame) {
      const t = frame.t;
      if (firstT === null) firstT = t;
      lastT = t; totalFrames++;
      const out = { t: t, exercise: exercise, visible: false, missing: [], message: '', events: [], feedback: '', tone: 'info', metrics: null, metricsText: '' };
      const f = frame.lm ? smoother.apply(frame) : null;
      const an = f ? analyze(exercise, f, cfg, ctx) : null;
      if (!f || !an.ok) {
        out.missing = f ? an.missing : ['body'];
        out.message = f ? missingMessage(exercise, an.missing) : 'Je ne te vois pas: place-toi devant la caméra, en entier.';
        out.feedback = out.message; out.tone = 'warn';
        if (isHold) hold.step(t, false);
        else if (engine.phase() !== 'init' && lastVisT !== null && t - lastVisT > cfg.common.gapResetMs) engine.abort();
        fillCommon(out);
        return out;
      }
      lastVisT = t; visibleFrames++;
      out.visible = true;
      if (isHold) {
        const hm = holdMeasure(exercise, cfg, f, an);
        const snap = hold.step(t, hm.valid);
        out.metrics = { dev: hm.dev, axis: hm.axis, valid: hm.valid };
        out.metricsText = 'Ligne du corps ' + round(hm.dev) + '° · orientation ' + round(hm.axis) + '°';
        if (hm.valid) { out.feedback = snap.holding ? 'Tiens bon!' : 'Position trouvée: ne bouge plus'; out.tone = 'ok'; }
        else { out.feedback = hm.msg; out.tone = 'warn'; if (snap.holding && snap.inGrace) out.feedback += ' (chrono bientôt arrêté)'; }
        fillCommon(out);
        return out;
      }
      const m = adapter.measure(f, an);
      if (!isFinite(m.a)) {
        out.message = 'Mesure impossible sur cette image'; out.feedback = out.message; out.tone = 'warn'; out.visible = false;
        fillCommon(out); return out;
      }
      // position : si la personne est flagrante hors position (debout pour des pompes, couchée pour des squats, bras ballants
      // pour des tractions), on ne compte pas. En cas de doute (hanches non vues, torse pointé vers la caméra), on compte.
      if (adapter.gate) {
        const gt = adapter.gate(f, an, engine.phase());
        if (gt) {
          gateRun++;
          if (gateRun >= 3) {
            if (gt.all && engine.phase() !== 'init') engine.abort();
            out.metrics = { a: m.a, extra: m.extra };
            out.metricsText = adapter.metricsText(m);
            fillCommon(out);
            out.feedback = gt.msg; out.tone = 'warn'; out.gated = true;
            return out;
          }
        } else gateRun = 0;
      }
      // calibrage automatique : si la position "bras tendus" n'est jamais atteinte (caméra de face, 3D bruitée),
      // on abaisse le seuil "haut" au maximum réellement mesuré, sans jamais descendre sous "bas + 25°"
      let calibrated = null;
      if (cfg.common.autoCalib && !calib.done) {
        const p = adapter.params;
        if (engine.phase() !== 'init') calib.done = true;
        else {
          calib.frames++; calib.maxSeen = Math.max(calib.maxSeen, m.a);
          if (calib.frames >= 75 && calib.maxSeen < p.up && calib.maxSeen >= p.down + 25) {
            const newUp = Math.max(p.down + 25, calib.maxSeen - 6);
            p.up = newUp; p.attempt = Math.min(p.attempt, newUp - 10);
            calib.done = true; calibrated = round(newUp);
          }
        }
      }
      out.events = engine.step(t, m.a, m.extra);
      if (calibrated !== null) { out.calibrated = calibrated; out.events.push({ type: 'calib', up: calibrated }); }
      if (adapter.after) adapter.after(engine.phase(), m);
      out.metrics = { a: m.a, extra: m.extra };
      out.metricsText = adapter.metricsText(m);
      fillCommon(out);
      const fb = adapter.feedback(engine.phase(), m);
      out.feedback = fb[0]; out.tone = fb[1];
      return out;
    }

    function summary(endT) {
      const end = endT === undefined ? lastT : endT;
      const base = { exercise: exercise, label: spec.label, kind: spec.kind, durationMs: firstT === null ? 0 : (end - firstT), visibleRatio: totalFrames ? visibleFrames / totalFrames : 0 };
      if (isHold) {
        const s = hold.snapshot();
        return Object.assign(base, { hold: { bestMs: s.bestMs, totalMs: s.totalMs, count: s.segments.length, segments: s.segments }, tutMs: s.totalMs, valid: 0, rejected: 0, attempts: 0 });
      }
      const rs = engine.res.reps, valids = rs.filter(function (r) { return r.valid; });
      const avg = function (arr, k) { return arr.length ? mean(arr.map(function (r) { return r[k]; })) : 0; };
      const byCode = {};
      rs.filter(function (r) { return !r.valid; }).forEach(function (r) {
        r.reasons.forEach(function (x) {
          byCode[x.code] = byCode[x.code] || { code: x.code, label: reasonLabel(exercise, x.code), count: 0, example: x.text };
          byCode[x.code].count++;
        });
      });
      return Object.assign(base, {
        attempts: rs.length, valid: valids.length, rejected: rs.length - valids.length,
        rejectedReasons: Object.keys(byCode).map(function (k) { return byCode[k]; }).sort(function (a, b) { return b.count - a.count; }),
        avgRepMs: avg(valids, 'durMs'), avgDownMs: avg(valids, 'downMs'), avgUpMs: avg(valids, 'upMs'),
        tutMs: rs.reduce(function (s, r) { return s + r.durMs; }, 0),
        reps: rs, glitches: engine.res.glitches, aborted: engine.res.aborted

    }

    return {
      exercise: exercise, config: cfg, kind: spec.kind,
      push: push,
      finish: function (endT) { if (isHold) hold.end(); else if (engine.currentRep()) engine.abort(); return summary(endT); },
      summary: summary,
      snapshot: function () { return isHold ? hold.snapshot() : { valid: engine.res.valid, rejected: engine.res.rejected, phase: engine.phase() }; }
    };
  }

  /* Rejoue une séquence de frames dans un compteur (pratique pour les tests) */
  function runSequence(exercise, frames, userCfg) {
    const c = createCounter(exercise, userCfg);
    const outs = [];
    for (let i = 0; i < frames.length; i++) outs.push(c.push(frames[i]));
    const s = c.finish();
    return { summary: s, outs: outs, counter: c };
  }

  return {
    DEFAULT_CONFIG: DEFAULT_CONFIG, STRICT: STRICT, SETTINGS_UI: SETTINGS_UI, LM: LM, SIDES: SIDES, EXERCISES: EXERCISES, NEEDS: NEEDS,
    mergeConfig: mergeConfig, angleDeg: angleDeg, OneEuro: OneEuro, createSmoother: createSmoother,
    framingStatus: framingStatus, missingMessage: missingMessage, reasonLabel: reasonLabel,
    createCounter: createCounter, runSequence: runSequence, createHoldTracker: createHoldTracker

});

    try { if (sess) await raw('/auth/v1/logout', { method: 'POST', token: sess.access_token }); } catch (e) { /* déconnexion locale quand même */ }
    store(null); out.lastSync = 0; out.profile = null;
  }
  async function deleteAccount() {
    await api('/rest/v1/rpc/delete_my_account', { method: 'POST', body: {} });
    store(null); out.profile = null;
  }
  /* Retour d'un lien d'email (confirmation d'inscription, mot de passe oublié) : l'adresse porte #access_token=...&type=...
     On ouvre la session, on nettoie l'adresse, et on dit de quel type de lien il s'agissait. */
  async function consumeHash() {
    const h = location.hash || '';
    const clean = () => { try { history.replaceState(null, '', location.pathname + location.search); } catch (e) { /* ignore */ } };
    if (h.indexOf('access_token=') < 0) {
      if (h.indexOf('error_description=') >= 0) { const m = /error_description=([^&]+)/.exec(h); clean(); return { error: m ? decodeURIComponent(m[1].replace(/\+/g, ' ')) : 'Lien invalide' }; }
      return null;
    }
    const p = new URLSearchParams(h.slice(1));
    const at = p.get('access_token'), rt = p.get('refresh_token'), type = p.get('type') || '';
    clean();
    if (!at || !rt) return { error: 'Lien incomplet' };
    const u = await raw('/auth/v1/user', { token: at });
    const exp = Date.now() + (parseInt(p.get('expires_in') || '3600', 10)) * 1000;
    store({ access_token: at, refresh_token: rt, expires: exp, user: { id: u.id, email: u.email } });
    return { ok: true, type };
  }

  /* ---------- profil, classement, sauvegarde, droits ---------- */
  async function getProfile() {
    const r = await api('/rest/v1/profiles?id=eq.' + sess.user.id + '&select=handle,public_id,elo_global,rank_id,level');
    out.profile = r && r[0] ? r[0] : null;
    return out.profile;
  }
  async function setHandle(handle) {
    await api('/rest/v1/profiles?id=eq.' + sess.user.id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { handle, updated_at: new Date().toISOString() } });
    if (out.profile) out.profile.handle = handle;
  }
  async function pushStats(p) {
    await api('/rest/v1/profiles?id=eq.' + sess.user.id, { method: 'PATCH', headers: { Prefer: 'return=minimal' }, body: { elo_global: p.elo_global, rank_id: p.rank_id, level: p.level, updated_at: new Date().toISOString() } });
  }
  async function pushBackup(data) {
    await api('/rest/v1/backups?on_conflict=user_id', {
      method: 'POST', headers: { Prefer: 'resolution=merge-duplicates,return=minimal' },
      body: { user_id: sess.user.id, data, updated_at: new Date().toISOString() }
    });
  }
  async function pullBackup() {
    const r = await api('/rest/v1/backups?select=data,updated_at&limit=1');
    return r && r[0] ? r[0] : null;
  }
  async function leaderboard() {
    const r = await api('/rest/v1/profiles?select=handle,public_id,elo_global,rank_id,level&elo_global=not.is.null&order=elo_global.desc&limit=50');
    out.lbRows = r || []; out.lbAt = Date.now();
    return out.lbRows;
  }
  /* droits achetés (écrits par le serveur seulement) : [{product, source, expires_at}] */
  async function entitlements() { return (await api('/rest/v1/entitlements?select=product,source,expires_at')) || []; }
  function schedule(fn, ms) { clearTimeout(timer); timer = setTimeout(fn, ms || 3000); }

  return Object.assign(out, { user, loggedIn, handleAvailable, signUp, signIn, recover, updatePassword, logout, deleteAccount, consumeHash, getProfile, setHandle, pushStats, pushBackup, pullBackup, leaderboard, entitlements, schedule });

function authErr(e) {
  const m = String((e && e.message) || e || ''), c = (e && e.code) || '';
  if (!navigator.onLine || /failed to fetch|networkerror|load failed/i.test(m)) return 'Pas de connexion internet.';
  if (c === 'invalid_credentials' || /invalid login|invalid credentials/i.test(m)) return 'Email ou mot de passe incorrect.';
  if (c === 'email_not_confirmed' || /not confirmed/i.test(m)) return 'Confirme d\'abord ton email : ouvre le message que nous t\'avons envoyé et touche le lien.';
  if (c === 'user_already_exists' || /already registered|already exists/i.test(m)) return 'Un compte existe déjà avec cet email. Connecte-toi, ou touche « Mot de passe oublié ».';
  if (c === 'weak_password' || /password should|weak/i.test(m)) return 'Mot de passe trop faible : 8 caractères minimum, évite les mots de passe trop courants.';
  if (c === 'over_email_send_rate_limit' || e && e.status === 429 || /rate limit|too many|security purposes/i.test(m)) return 'Trop de tentatives ou d\'emails envoyés. Réessaie dans quelques minutes.';
  if (c === 'email_address_invalid' || /invalid email|email address.*invalid/i.test(m)) return 'Cette adresse email n\'est pas acceptée.';
  if (c === 'signup_disabled') return 'Les inscriptions sont fermées pour le moment.';
  if (c === 'unexpected_failure' && /sending|smtp|email/i.test(m) || /error sending|smtp/i.test(m)) return 'L\'email de confirmation n\'a pas pu partir. Réessaie plus tard.';
  if (c === 'same_password' || /different from the old/i.test(m)) return 'Choisis un mot de passe différent de l\'ancien.';
  if (e && e.status === 23505 || /duplicate|unique/i.test(m)) return 'Ce pseudo est déjà pris.';
  return m || 'Erreur inconnue.';
}
const cloudErr = authErr;

async function authSubmit() {
  const A = ui.auth; if (A.busy) return;
  const form = $('#auth-form'); if (!form) return;
  const mode = form.dataset.mode;
  // valeurs lues dans les champs (au cas où l'autoremplissage n'a pas déclenché d'événement)
  ['email', 'password', 'pseudo'].forEach(k => { const el = $('#au-' + k); if (el) A[k] = el.value; });
  const t = $('#au-terms'); if (t) A.terms = t.checked;
  const email = (A.email || '').trim().toLowerCase();
  const bad = (m) => { authMsg(m, true); render(); };
  if (mode !== 'recovery' && !/^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email)) return bad('Email invalide.');
  if ((mode === 'login' || mode === 'signup' || mode === 'recovery') && !A.password) return bad('Entre ton mot de passe.');
  if ((mode === 'signup' || mode === 'recovery') && A.password.length < 8) return bad('Mot de passe : 8 caractères minimum.');
  if (mode === 'signup' && email && A.password.toLowerCase() === email) return bad('Choisis un mot de passe différent de ton email.');
  if (mode === 'signup') {
    const c = Account.check(A.pseudo);
    if (!c.ok) return bad('Pseudo : ' + c.msg.charAt(0).toLowerCase() + c.msg.slice(1));
    A.pseudo = c.name;
    if (!A.terms) return bad('Coche la case pour accepter les conditions.');
  }
  A.busy = true; authMsg('', false); render();
  try {
    if (mode === 'login') { await Cloud.signIn(email, A.password); await afterAuth(); return; }
    if (mode === 'signup') {
      if (!(await Cloud.handleAvailable(A.pseudo))) { A.busy = false; return bad('Ce pseudo est déjà pris : choisis-en un autre.'); }
      const r = await Cloud.signUp(email, A.password, A.pseudo);
      if (r.session) { await afterAuth(); return; }
      if (r.repeated) { A.busy = false; A.mode = 'login'; A.email = email; return bad('Un compte existe déjà avec cet email. Connecte-toi, ou touche « Mot de passe oublié ».'); }
      A.busy = false; A.mode = 'check'; A.kind = 'signup'; A.email = email; A.password = ''; authMsg('', false); render(); return;
    }
    if (mode === 'forgot') { await Cloud.recover(email); A.busy = false; A.mode = 'check'; A.kind = 'reset'; A.email = email; authMsg('', false); render(); return; }
    if (mode === 'recovery') { await Cloud.updatePassword(A.password); A.password = ''; toast('Mot de passe enregistré'); await afterAuth(); return; }
  } catch (e) { A.busy = false; authMsg(authErr(e), true); render(); }
}

    case 'iq-cancel': go('train'); break;
    case 'intake-go': go('train'); break;
    default: if (!planAct(a, el) && !accAct(a) && !(typeof cloudAct === 'function' && cloudAct(a, el)) && typeof camAct === 'function') camAct(a, el); break;
  }
}
document.addEventListener('click', e => {
  if (e.target.closest('#cine')) { closeCine(); return; }
  const b = e.target.closest('[data-act]');
  if (b) act(b.dataset.act, b);
});
document.addEventListener('keydown', e => {
  if ((e.key === 'Enter' || e.key === ' ') && e.target.matches && e.target.matches('g.med')) { e.preventDefault(); act('med', e.target); return; }
  if (e.key === 'Escape') {
    if ($('#cine')) { closeCine(); return; }
    if (ui.sheet) { closeSheet(); return; }
  }
});
document.addEventListener('input', e => {
  const t = e.target, k = t.dataset && t.dataset.in;
  if (k === 'pain' && ui.pre) {
    ui.pre.pain = parseInt(t.value, 10);
    $('#pain-val').textContent = ui.pre.pain;
    $('#pain-msg').innerHTML = painMsg(ui.pre.pain);
    $('#btn-pre-go').disabled = ui.pre.pain >= 6;
  } else if (k === 'mq') {
    mqSetPlaying(false);
    mq.s = parseInt(t.value, 10) / 1000;
    mqDraw();
  }
});

/* ---------- demarrage ---------- */
function boot() {
  S = loadState();
  if (!S) { S = Core.newFreshState(nowMs()); ui.route = 'intake'; }
  else {
    ui.route = 'train';
    const ev = Core.normalize(S, nowMs());
    if (ev) save();
  }
  if (typeof Cloud !== 'undefined') {
    // version installée : compte en ligne obligatoire (une session enregistrée suffit, même hors ligne)
    if (!Cloud.loggedIn()) ui.route = 'auth';
    else if (!Account.get() || S.owner !== Cloud.user().id) { render(); afterAuth(); return; }
  } else if (!Account.get()) ui.route = 'welcome';
  render();
}
/* acces pour les tests dans le navigateur */
window.CaliApp = {
  get S() { return S; }, set S(v) { S = v; }, get D() { return D; }, ui, render, go, act, Core, Troph, Body, Mannequin, Emblems,
  liveSim, liveEnd, beginLive, startExercise, openExercise, openPromo, recordTraining, loadExample, intakeAnswer, save, mq,
  tests() { return { core: Core.selfTest(), flow: Core.flowTest(), troph: Troph.test(), dict: Dict.test(), coach: Coach.test() }; }
};
boot();

</script>

<script>
if ("serviceWorker" in navigator) {
  // une nouvelle version prend le contrôle : on recharge une seule fois, sauf pendant une série
  var reloaded = false, wasControlled = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener("controllerchange", function () {
    if (reloaded || !wasControlled || !navigator.serviceWorker.controller) return;
    var live = window.CaliApp && window.CaliApp.ui && (window.CaliApp.ui.live || window.CaliApp.ui.run);
    if (live) return;
    reloaded = true; location.reload();
  });
  window.addEventListener("load", function () {
    try { navigator.serviceWorker.register("sw.js", { updateViaCache: "none" }).then(function (r) { r.update(); }).catch(function () {}); } catch (e) {}
  });
}
</script>
