<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Calisthenics Ranked</title>
<meta name="theme-color" content="#0b0d17">
<meta name="color-scheme" content="dark">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Ranked">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>html,body{margin:0;background:#0b0d17}</style>
<script>window.APP_VERSION = "0.9-7ae3c9";</script>
</head>
<body>
<style>
:root {
  color-scheme: dark;
  /* encre bleu-violet, jamais noir pur */
  --bg: #0b0d17;
  --bg-2: #0f1220;
  --surface: #151929;
  --surface-2: #1b2033;
  --surface-3: #242a42;
  --line: #2b3250;
  --line-soft: #1f2540;
  --text: #eceff8;
  --text-2: #b4bbd3;
  --text-3: #8d95b2;
  --on-accent: #0b0d17;
  --focus: #dbe6ff;
  --ok: #55d6a2;
  --ok-bg: #12301f;
  --warn: #f3bb55;
  --warn-bg: #33270e;
  --bad: #ff7b7b;
  --bad-bg: #38161a;
  --shadow: 0 12px 34px rgba(3, 4, 12, .5);
  --overlay: rgba(6, 7, 14, .92);
  --scrim: rgba(5, 6, 12, .66);
  --ink: #04050b;
  --glint: #ffffff;

  /* figure anatomique et mannequin */
  --body: #232942;
  --mus: #38415f;
  --figline: #10131f;
  --mq: #5f6b97;
  --mq-far: #3f486b;
  --mq-floor: #3a4266;
  --mq-bar: #a3acd1;
  --mq-wall: #1b2040;

  /* camera simulee */
  --cam-1: #0e1224;
  --cam-2: #05060d;
  --cam-grid: #1a2040;
  --cam-line: #6df0c8;

  /* palettes d'emblemes: un jeu de tokens par rang */
  --rk-rookie: #959bb3; --rk-rookie-hi: #d3d8e8; --rk-rookie-lo: #4b5168; --rk-rookie-glow: #aab0c8;
  --rk-bronze: #c27a3a; --rk-bronze-hi: #efb07a; --rk-bronze-lo: #6b3a16; --rk-bronze-glow: #dc9150;
  --rk-argent: #b4bece; --rk-argent-hi: #f4f7fc; --rk-argent-lo: #5c687e; --rk-argent-glow: #d6deee;
  --rk-or: #e3b43d; --rk-or-hi: #ffe493; --rk-or-lo: #85600f; --rk-or-glow: #f5cd55;
  --rk-platine: #3fd3e3; --rk-platine-hi: #bcf5fb; --rk-platine-lo: #156d7b; --rk-platine-glow: #4de5f5;
  --rk-diamant: #80c6ff; --rk-diamant-hi: #e6f5ff; --rk-diamant-lo: #2d68a8; --rk-diamant-glow: #a3d8ff;
  --rk-maitre: #9b74ff; --rk-maitre-hi: #dacbff; --rk-maitre-lo: #442890; --rk-maitre-glow: #b194ff;
  --rk-grand_maitre: #ec4a42; --rk-grand_maitre-hi: #ffa598; --rk-grand_maitre-lo: #7a1512; --rk-grand_maitre-glow: #ff6455;
  --rk-titan: #ffae2e; --rk-titan-hi: #fff2bd; --rk-titan-lo: #9a5200; --rk-titan-glow: #ffc552;
  --rk-immortel: #86e9ff; --rk-immortel-hi: #effcff; --rk-immortel-lo: #3f7db0; --rk-immortel-glow: #a9f3ff;
  --rk-immortel-a: #62f0ff; --rk-immortel-b: #ff72dc; --rk-immortel-c: #ffe071; --rk-immortel-d: #82ffa6;

  /* accent courant: pris sur le rang du joueur (regle par le script) */
  --accent: var(--rk-rookie);
  --accent-hi: var(--rk-rookie-hi);
  --accent-lo: var(--rk-rookie-lo);
  --accent-glow: var(--rk-rookie-glow);

  --f-display: 'Saira Condensed', 'Bahnschrift', 'Arial Narrow', 'Roboto Condensed', sans-serif;
  --f-body: 'Barlow', 'Segoe UI', system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif;
  --r-lg: 20px;
  --r-md: 14px;
  --r-sm: 9px;
  --tabbar-h: 64px;
  --col: 640px;
}

* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: var(--f-body);
  font-size: 17px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 0;
}
h1, h2, h3 { margin: 0; font-family: var(--f-display); font-weight: 700; letter-spacing: .02em; line-height: 1.05; }
h1 { font-size: 40px; text-transform: uppercase; }
h2 { font-size: 30px; text-transform: uppercase; }
h3 { font-size: 22px; }
p { margin: 0 0 10px; }
button { font: inherit; color: inherit; }
.num { font-variant-numeric: tabular-nums; }
.muted { color: var(--text-2); }
.dim { color: var(--text-3); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
[hidden] { display: none !important; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
svg { display: block; }
.defs-svg { position: absolute; width: 0; height: 0; overflow: hidden; }

/* ---------- mise en page ---------- */
.app { max-width: var(--col); margin: 0 auto; padding-top: env(safe-area-inset-top, 0px); padding-bottom: calc(var(--tabbar-h) + 28px + env(safe-area-inset-bottom, 0px)); overflow-x: clip; }
.app[data-immersive="1"] { padding-bottom: calc(112px + env(safe-area-inset-bottom, 0px)); }
.top { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 10px 0; }
.top .sp { flex: 1; min-width: 0; }
.topnav { display: none; }
main { outline: none; padding-bottom: 12px; }
.stack > * + * { margin-top: 16px; }

.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 40;
  display: grid; grid-template-columns: repeat(4, minmax(0, 1fr));
  background: var(--bg-2); border-top: 1px solid var(--line);
  padding-top: 4px;
  padding-bottom: env(safe-area-inset-bottom, 0px);
  padding-left: env(safe-area-inset-left, 0px);
  padding-right: env(safe-area-inset-right, 0px);
}
.app[data-immersive="1"] ~ .tabbar { display: none; }
.tab {
  appearance: none; background: none; border: 0; border-top: 3px solid transparent; color: var(--text-3); cursor: pointer;
  display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px;
  min-height: 56px; padding: 6px 0 4px; font-weight: 600; font-size: 13.5px; letter-spacing: .02em; margin-top: -4px;
}
.tab svg { width: 26px; height: 26px; stroke: currentColor; fill: none; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
.tab[aria-current="page"] { color: var(--accent); border-top-color: var(--accent); }
@media (min-width: 768px) {
  .tabbar { display: none; }
  .app { padding-bottom: 60px; }
  .app[data-immersive="1"] { padding-bottom: 130px; }
  .topnav { display: flex; gap: 6px; }
  .topnav .tab { flex-direction: row; gap: 8px; min-height: 46px; padding: 6px 16px; border: 0; border-radius: 12px; margin: 0; font-size: 16px; }
  .topnav .tab svg { width: 22px; height: 22px; }
  .topnav .tab[aria-current="page"] { background: var(--surface-2); box-shadow: inset 0 -3px 0 var(--accent); }
  .app[data-immersive="1"] .topnav { visibility: hidden; }
  .app { max-width: 860px; }
  main { max-width: var(--col); margin-inline: auto; }
}
@media (min-width: 768px) and (max-width: 959px) {
  .topnav { gap: 2px; }
  .topnav .tab { padding: 6px 10px; font-size: 15px; gap: 6px; }
  .top { gap: 8px; }
}

/* ---------- boutons ---------- */
.btn {
  appearance: none; cursor: pointer; font-weight: 700; letter-spacing: .02em; font-size: 17px;
  display: inline-flex; align-items: center; justify-content: center; gap: 10px;
  min-height: 52px; padding: 10px 22px; border-radius: var(--r-md);
  border: 1px solid var(--line); background: var(--surface-2); color: var(--text); text-decoration: none;
}
.btn:hover { background: var(--surface-3); }
.btn.primary { background: var(--accent); color: var(--on-accent); border-color: var(--accent); font-size: 19px; min-height: 58px; }
.btn.primary:hover { background: var(--accent-hi); border-color: var(--accent-hi); }
.btn.block { width: 100%; }
.btn.ghost { background: transparent; }
.btn.small { min-height: 44px; padding: 6px 16px; font-size: 15px; }
.btn.danger { border-color: var(--bad); color: var(--bad); background: var(--bad-bg); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn svg, .ibtn svg { width: 22px; height: 22px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ibtn {
  appearance: none; cursor: pointer; width: 46px; height: 46px; flex: none; display: grid; place-items: center; padding: 0;
  background: var(--surface); border: 1px solid var(--line); border-radius: 50%; color: var(--text-2);
}
.ibtn:hover { color: var(--text); background: var(--surface-2); }
.avatar { border-color: var(--accent); color: var(--accent); background: var(--surface); }
.link { appearance: none; background: none; border: 0; padding: 10px 6px; min-height: 44px; color: var(--text-2); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: 15.5px; }
.link:hover { color: var(--text); }

/* ---------- pastille de niveau ---------- */
.lvl {
  display: inline-flex; align-items: center; gap: 10px; min-height: 46px; padding: 4px 18px 4px 8px;
  border-radius: 99px; background: var(--surface); border: 1px solid var(--line);
  font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .04em; text-transform: uppercase; white-space: nowrap;
}
.lvl svg.emblem { width: 32px; height: 32px; }
.lvl b { color: var(--accent); font-weight: 700; }

/* ---------- carte "Continuer" ---------- */
.go {
  appearance: none; width: 100%; text-align: left; cursor: pointer; color: inherit;
  display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 14px;
  padding: 22px 20px 22px 24px; min-height: 140px;
  border-radius: 26px; border: 1px solid var(--accent-lo);
  background:
    radial-gradient(110% 130% at 100% 0%, color-mix(in srgb, var(--accent) 34%, transparent), transparent 62%),
    var(--surface);
  box-shadow: var(--shadow);
}
.go:hover { border-color: var(--accent); }
.go .kick { font-family: var(--f-display); font-weight: 700; font-size: 19px; letter-spacing: .14em; text-transform: uppercase; color: var(--accent); }
.go .nm { font-family: var(--f-display); font-weight: 800; font-size: clamp(32px, 9vw, 44px); line-height: 1; text-transform: uppercase; margin-top: 4px; }
.go .gl { color: var(--text-2); margin-top: 8px; font-size: 18px; }
.go .thumb { width: 74px; }
.go .thumb .body-fig { width: 74px; height: auto; }

/* ---------- familles ---------- */
.fams { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-top: 18px; }
.fam {
  appearance: none; cursor: pointer; text-align: left; color: inherit; position: relative; overflow: hidden;
  display: flex; flex-direction: column; justify-content: space-between; min-height: 146px; padding: 16px 16px 14px;
  border-radius: var(--r-lg); border: 1px solid var(--line-soft); background: var(--surface);
}
.fam:hover { border-color: var(--accent-lo); background: var(--surface-2); }
.fam .ic { width: 34px; height: 34px; stroke: var(--accent); fill: none; stroke-width: 1.9; stroke-linecap: round; stroke-linejoin: round; }
.fam .lb { font-family: var(--f-display); font-weight: 800; font-size: 30px; text-transform: uppercase; letter-spacing: .03em; line-height: 1; }
.fam .sil { position: absolute; right: 14px; top: 12px; bottom: 12px; display: flex; }
.fam .sil .body-fig { height: 100%; width: auto; }
.fam.wide { grid-column: 1 / -1; min-height: 118px; }
.fam.wide .sil { right: 22px; }

/* ---------- liste d'exercices ---------- */
.sub { display: flex; align-items: center; gap: 10px; min-height: 64px; padding: 8px 0; }
.sub h1 { font-size: 34px; flex: 1; min-width: 0; line-height: 1; }
.list { display: grid; gap: 12px; }
.ex {
  appearance: none; cursor: pointer; width: 100%; text-align: left; color: inherit;
  display: grid; grid-template-columns: 56px 1fr auto; align-items: center; gap: 14px; min-height: 92px; padding: 10px 14px;
  border-radius: var(--r-lg); border: 1px solid var(--line-soft); background: var(--surface);
}
.ex:hover { background: var(--surface-2); border-color: var(--accent-lo); }
.ex .thumb { width: 56px; }
.ex .thumb .body-fig { width: 56px; height: auto; }
.ex .nm { font-family: var(--f-display); font-weight: 700; font-size: 25px; line-height: 1.05; }
.ex .tg { color: var(--accent); font-size: 15.5px; font-weight: 600; margin-top: 3px; display: flex; align-items: center; gap: 6px; }
.ex .tg svg { width: 17px; height: 17px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex .ch { width: 24px; height: 24px; stroke: var(--text-3); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.ex.locked { opacity: .5; background: var(--bg-2); }
.ex.locked .tg { color: var(--text-3); }
.sw {
  appearance: none; cursor: pointer; display: inline-flex; align-items: center; gap: 12px; min-height: 46px; padding: 4px 4px;
  background: none; border: 0; color: var(--text-2); font-size: 16px;
}
.sw .tr { width: 46px; height: 28px; border-radius: 99px; background: var(--surface-3); border: 1px solid var(--line); position: relative; flex: none; }
.sw .tr::after { content: ''; position: absolute; left: 3px; top: 3px; width: 20px; height: 20px; border-radius: 50%; background: var(--text-3); transition: transform .18s ease, background .18s ease; }
.sw[aria-checked="true"] .tr { background: var(--accent-lo); border-color: var(--accent); }
.sw[aria-checked="true"] .tr::after { transform: translateX(18px); background: var(--accent-hi); }

/* ---------- ecran d'un exercice ---------- */
.seg { display: inline-grid; grid-auto-flow: column; gap: 4px; padding: 4px; border-radius: 99px; background: var(--bg-2); border: 1px solid var(--line-soft); }
.seg button { appearance: none; border: 0; background: none; cursor: pointer; min-height: 40px; padding: 4px 20px; border-radius: 99px; font-weight: 700; font-size: 15.5px; color: var(--text-2); }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--on-accent); }
.stage { background: radial-gradient(80% 70% at 50% 40%, var(--surface-2), var(--surface)); border: 1px solid var(--line-soft); border-radius: var(--r-lg); padding: 14px 12px 12px; display: grid; justify-items: center; gap: 10px; }
.stage .bodies { display: flex; justify-content: center; gap: 4px; width: 100%; }
.stage .bodies .body-fig { width: min(44%, 210px); height: auto; filter: drop-shadow(0 6px 10px var(--scrim)); }
.worked { font-size: 15.5px; color: var(--text-2); text-align: center; line-height: 1.35; }
.worked b { color: var(--accent); font-weight: 700; }
.mq-wrap { width: 100%; display: grid; gap: 10px; justify-items: center; }
.mq-svg { width: min(100%, 360px); height: auto; background: var(--bg-2); border-radius: var(--r-md); border: 1px solid var(--line-soft); }
.mq-ctl { display: flex; align-items: center; gap: 12px; width: min(100%, 360px); }
.mq-ctl input[type=range] { flex: 1; min-width: 0; }
.mq-nm { font-family: var(--f-display); font-weight: 700; font-size: 21px; letter-spacing: .03em; min-height: 26px; text-align: center; }
.mq-posebar { display: flex; gap: 6px; width: min(100%, 360px); }
.mq-posebar i { flex: 1; height: 5px; border-radius: 4px; background: var(--surface-3); }
.mq-posebar i.on { background: var(--accent); }
.note { font-size: 14.5px; color: var(--text-3); text-align: center; }
.steps { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; counter-reset: s; }
.steps li { counter-increment: s; display: grid; grid-template-columns: 40px 1fr; gap: 14px; align-items: center; font-size: 19px; line-height: 1.3; min-height: 44px; }
.steps li::before { content: counter(s); width: 40px; height: 40px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 22px; color: var(--on-accent); background: var(--accent); }
.err { display: flex; gap: 12px; align-items: flex-start; padding: 12px 14px; border-radius: var(--r-md); background: var(--warn-bg); color: var(--text); border: 1px solid var(--warn); font-size: 16.5px; }
.err svg { width: 24px; height: 24px; stroke: var(--warn); fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; flex: none; margin-top: 1px; }
.err b { display: block; color: var(--warn); font-size: 14px; letter-spacing: .08em; text-transform: uppercase; font-weight: 700; }
.chip-t { display: inline-flex; align-items: center; gap: 8px; min-height: 36px; padding: 2px 14px; border-radius: 99px; border: 1px solid var(--accent); color: var(--accent); font-weight: 700; font-size: 15.5px; }
.chip-t svg { width: 18px; height: 18px; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
.cta {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 45;
  padding: 12px max(16px, env(safe-area-inset-right, 0px)) calc(14px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  background: linear-gradient(to top, var(--bg) 70%, transparent);
}
.cta > * { max-width: var(--col); margin: 0 auto; display: flex; }
.cta .btn { width: 100%; }
.cta .why { justify-content: center; color: var(--text-3); font-size: 14.5px; padding-bottom: 6px; }

/* ---------- feuilles (sheets) ---------- */
.sheet-root { position: fixed; inset: 0; z-index: 80; display: grid; align-items: end; justify-items: center; }
.sheet-back { position: absolute; inset: 0; background: var(--scrim); border: 0; width: 100%; cursor: default; animation: fadeIn .2s ease both; }
.sheet {
  position: relative; width: min(100%, 560px); max-height: 88vh; overflow-y: auto; overscroll-behavior: contain;
  background: var(--surface); border: 1px solid var(--line); border-bottom: 0; border-radius: 26px 26px 0 0; box-shadow: var(--shadow);
  padding: 8px max(20px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(20px, env(safe-area-inset-left, 0px));
  animation: sheetUp .28s cubic-bezier(.2, .9, .3, 1) both;
}
.sheet .grab { width: 44px; height: 5px; border-radius: 4px; background: var(--line); margin: 6px auto 14px; }
.sheet h2 { font-size: 30px; margin-bottom: 12px; }
.sheet .row { display: flex; gap: 12px; align-items: center; }
.sheet .acts { display: grid; gap: 10px; margin-top: 18px; }
.sheet .closeb { position: absolute; right: 12px; top: 12px; }
.lines { display: grid; gap: 10px; margin: 0 0 6px; padding: 0; list-style: none; }
.lines li { display: grid; grid-template-columns: 8px 1fr; gap: 12px; align-items: start; font-size: 18px; }
.lines li::before { content: ''; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); margin-top: 9px; }
.kv { display: grid; grid-template-columns: 1fr auto; gap: 8px 14px; margin: 14px 0; font-size: 18px; }
.kv dt { color: var(--text-2); }
.kv dd { margin: 0; text-align: right; font-weight: 700; }
.kv dd .up { color: var(--ok); }
.big { font-family: var(--f-display); font-weight: 800; font-size: 56px; line-height: 1; text-transform: uppercase; }
.big small { font-size: 28px; color: var(--text-2); font-weight: 600; }
.trophy-note { display: flex; align-items: center; gap: 12px; padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--accent); background: color-mix(in srgb, var(--accent) 14%, var(--surface)); font-weight: 600; }
.trophy-note svg { width: 28px; height: 28px; stroke: var(--accent); fill: none; stroke-width: 1.9; flex: none; stroke-linecap: round; stroke-linejoin: round; }
.notice { padding: 12px 14px; border-radius: var(--r-md); border: 1px solid var(--line); background: var(--surface-2); font-size: 16.5px; }
.notice.bad { border-color: var(--bad); background: var(--bad-bg); }
.notice.ok { border-color: var(--ok); background: var(--ok-bg); }
.slider-row { margin: 10px 0 6px; }
.slider-row label { display: block; font-size: 18px; margin-bottom: 8px; }
.slider-row label b { font-size: 30px; font-family: var(--f-display); color: var(--accent); }
input[type=range] { width: 100%; accent-color: var(--accent); min-height: 36px; }
.bar { height: 14px; border-radius: 9px; background: var(--surface-3); overflow: hidden; border: 1px solid var(--line); }
.bar > i { display: block; height: 100%; border-radius: 9px; background: linear-gradient(90deg, var(--accent-lo), var(--accent), var(--accent-hi)); transition: width .5s ease; }

/* ---------- apercu camera (simulation) ---------- */
.live { position: fixed; inset: 0; z-index: 70; display: grid; grid-template-rows: minmax(0, 1fr); background: var(--bg); color: var(--text);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px)); }

.cam {

}

.cam .reps { position: absolute; left: 0; right: 0; bottom: 78px; text-align: center; z-index: 2; pointer-events: none; }
.cam .cnt { font-family: var(--f-display); font-weight: 800; font-size: clamp(96px, 30vw, 150px); line-height: .9; color: var(--text); text-shadow: 0 4px 24px var(--ink); }
.cam .goal { color: var(--text-2); font-size: 18px; margin-top: 2px; }

/* ---------- compte local ---------- */

.lab { display: block; font-size: 15px; color: var(--text-2); margin-bottom: 4px; }
.field { width: 100%; box-sizing: border-box; min-height: 52px; padding: 12px 14px; border-radius: 14px; border: 1px solid var(--line); background: var(--surface-2); color: var(--text); font: inherit; font-size: 18px; }

.hero .who { font-size: 20px; color: var(--text-2); font-weight: 600; margin-bottom: -4px; }

.cam .cam-guide { position: absolute; left: 14px; right: 14px; top: 56px; z-index: 2; padding: 12px 14px; border-radius: 16px; background: var(--scrim); color: var(--text-2); font-size: 16px; line-height: 1.35; }

@media (orientation: landscape) and (max-height: 540px) {

}
.live .bt { display: grid; gap: 10px; padding: 14px 0 12px; }

/* ---------- Ranked ---------- */

}

.pts { width: 100%; max-width: 440px; }

.pts .pl span { color: var(--text-2); }
.lb { margin-top: 20px; }
.lb-h { display: flex; justify-content: space-between; align-items: baseline; color: var(--text-3); font-size: 14.5px; padding: 0 6px 8px; letter-spacing: .04em; }
.lb ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }

/* ---------- Trophees ---------- */
.lvnav { display: grid; grid-template-columns: 52px 1fr 52px; align-items: center; gap: 8px; }
.lvnav .mid { text-align: center; }
.lvnav .mid .t { font-family: var(--f-display); font-weight: 800; font-size: 32px; text-transform: uppercase; letter-spacing: .05em; color: var(--rc); line-height: 1; }
.lvnav .mid .s { color: var(--text-3); font-size: 15px; margin-top: 2px; min-height: 22px; }
.lvnav .ibtn { width: 52px; height: 52px; }
.lvnav .ibtn[disabled] { opacity: .3; cursor: default; }
.wheel { width: min(100%, 400px); margin: 6px auto 0; }
.wheel svg { width: 100%; height: auto; overflow: visible; }
.wh-track { fill: none; stroke: var(--line); stroke-width: 2; stroke-dasharray: 2 7; stroke-linecap: round; }
.wh-count { font-family: var(--f-display); font-weight: 800; font-size: 44px; fill: var(--text); text-anchor: middle; }
.med { cursor: pointer; outline: none; }
.med .md-bg { fill: var(--surface); stroke: var(--rc); stroke-width: 2.6; }
.med .md-in { fill: none; stroke: var(--rc); stroke-width: 1; opacity: .45; }
.med .md-n { font-family: var(--f-display); font-weight: 800; font-size: 25px; fill: var(--text); text-anchor: middle; }
.med .md-l { font-family: var(--f-body); font-weight: 600; font-size: 10px; fill: var(--text-2); text-anchor: middle; letter-spacing: .02em; }
.med.done .md-bg { fill: url(#medfill); stroke: var(--rc-hi); }
.med.done .md-n { fill: var(--on-accent); }
.med.done .md-l { fill: var(--on-accent); }
.med.done .md-in { stroke: var(--rc-lo); opacity: .6; }
.med.dim { opacity: .42; }
.med.dim .md-bg { stroke-dasharray: 5 4; stroke: var(--text-3); }
.med:focus-visible .md-bg, .med:hover .md-bg { stroke: var(--focus); stroke-width: 3.4; }
.med .md-ck { fill: var(--on-accent); stroke: var(--rc-hi); stroke-width: 1.6; }
.med .md-ckp { fill: none; stroke: var(--rc-hi); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; }
.nextline { text-align: center; font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .04em; margin-top: 4px; }
.nextline b { color: var(--rc, var(--accent)); }

/* ---------- questionnaire ---------- */
.intake { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding-block: max(14px, env(safe-area-inset-top, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)); }
.dots { display: flex; gap: 8px; justify-content: center; align-items: center; min-height: 44px; }
.dots i { width: 12px; height: 12px; border-radius: 50%; background: var(--surface-3); border: 1px solid var(--line); }
.dots i.on { background: var(--accent); border-color: var(--accent); }
.dots i.cur { width: 34px; border-radius: 8px; }
.q { align-self: center; display: grid; gap: 18px; padding: 10px 0; }
.q h1 { font-size: clamp(34px, 9vw, 46px); }
.opts { display: grid; gap: 12px; }
.opt { appearance: none; cursor: pointer; text-align: left; min-height: 64px; padding: 12px 20px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--surface); color: var(--text); font-family: var(--f-display); font-weight: 700; font-size: 26px; letter-spacing: .03em; }
.opt:hover { border-color: var(--accent); background: var(--surface-2); }
.opt[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 18%, var(--surface)); }
.opts.two { grid-template-columns: 1fr 1fr; }
.res { text-align: center; display: grid; gap: 14px; justify-items: center; align-self: center; }
.res .emb { width: min(230px, 62vw); filter: drop-shadow(0 8px 28px color-mix(in srgb, var(--accent) 45%, transparent)); }
.res .emb svg { width: 100%; height: auto; }
.res .t1 { font-family: var(--f-display); font-weight: 800; font-size: 46px; text-transform: uppercase; line-height: 1; }
.res .t1 b { color: var(--accent); }
.first { display: grid; gap: 10px; width: 100%; text-align: left; margin-top: 6px; }
.first .hd { font-family: var(--f-display); font-size: 20px; letter-spacing: .12em; text-transform: uppercase; color: var(--text-3); text-align: center; }
.first .it { display: grid; grid-template-columns: 56px 1fr; gap: 14px; align-items: center; min-height: 64px; padding: 6px 12px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line-soft); }
.first .it .md { width: 52px; height: 52px; border-radius: 50%; border: 2.5px solid var(--accent); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 21px; }
.first .it .t { font-family: var(--f-display); font-weight: 700; font-size: 23px; line-height: 1.05; }

/* ---------- promotion ---------- */
.pgroup { display: grid; gap: 10px; }
.pgroup h3 { color: var(--text-2); font-size: 20px; letter-spacing: .08em; text-transform: uppercase; }
.pick { appearance: none; cursor: pointer; text-align: left; display: grid; grid-template-columns: 1fr auto; align-items: center; gap: 10px; min-height: 64px; padding: 10px 16px; border-radius: var(--r-md); border: 1.5px solid var(--line); background: var(--surface); color: var(--text); }
.pick .nm { font-family: var(--f-display); font-weight: 700; font-size: 24px; }
.pick .tg { color: var(--text-2); font-size: 15.5px; }
.pick[aria-pressed="true"] { border-color: var(--accent); background: color-mix(in srgb, var(--accent) 16%, var(--surface)); }
.pick .rd { width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--line); display: grid; place-items: center; }
.pick[aria-pressed="true"] .rd { border-color: var(--accent); background: var(--accent); }
.pick .rd svg { width: 16px; height: 16px; stroke: var(--on-accent); fill: none; stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; opacity: 0; }
.pick[aria-pressed="true"] .rd svg { opacity: 1; }
.pstep { display: grid; gap: 14px; text-align: center; justify-items: center; padding: 14px 0; }
.pstep .big { font-size: 48px; }
.pdone { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; width: 100%; text-align: left; }
.pdone li { display: grid; grid-template-columns: 1fr auto; gap: 10px; align-items: center; min-height: 52px; padding: 6px 14px; border-radius: var(--r-md); background: var(--surface); border: 1px solid var(--line-soft); font-size: 18px; }
.pdone li.ok { border-color: var(--ok); }
.pdone li.ko { border-color: var(--bad); }
.pdone li b { font-family: var(--f-display); font-size: 22px; }

/* ---------- cinematique de niveau ---------- */
.emblem { display: block; overflow: visible; max-width: 100%; height: auto; }
.cine {
  position: fixed; inset: 0; z-index: 100; display: grid; place-items: center; text-align: center;
  background: radial-gradient(70% 60% at 50% 45%, color-mix(in srgb, var(--accent) 30%, var(--bg)), var(--overlay) 70%), var(--overlay);
  padding: env(safe-area-inset-top, 0px) max(16px, env(safe-area-inset-right, 0px)) env(safe-area-inset-bottom, 0px) max(16px, env(safe-area-inset-left, 0px));
  cursor: pointer; border: 0; width: 100%; color: var(--text); font: inherit; animation: fadeIn .35s ease both; overflow: hidden;
}
.cine .rays { position: absolute; left: 50%; top: 45%; width: 160vmax; height: 160vmax; margin: -80vmax 0 0 -80vmax; opacity: .55;
  background: repeating-conic-gradient(from 0deg, color-mix(in srgb, var(--accent) 38%, transparent) 0deg 5deg, transparent 5deg 15deg);
  -webkit-mask-image: radial-gradient(circle, var(--text) 0, transparent 38%); mask-image: radial-gradient(circle, var(--text) 0, transparent 38%);
  animation: raysSpin 14s linear infinite; }
.cine .inner { position: relative; display: grid; gap: 14px; justify-items: center; }
.cine .emb-big { width: min(320px, 70vw); animation: emblemIn 1.1s cubic-bezier(.2, 1.2, .3, 1) .15s both; filter: drop-shadow(0 0 30px color-mix(in srgb, var(--accent) 60%, transparent)); }
.cine .k { font-family: var(--f-display); letter-spacing: .4em; text-transform: uppercase; color: var(--text-2); font-size: 20px; animation: riseIn .6s ease .8s both; }
.cine .rn { font-family: var(--f-display); font-weight: 800; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); font-size: clamp(46px, 14vw, 92px); line-height: 1; animation: riseIn .7s ease 1s both; }
.cine .skip { font-size: 14px; color: var(--text-3); animation: riseIn .6s ease 1.6s both; }

/* ---------- figure anatomique ---------- */
.body-fig { overflow: visible; }
.bd { fill: var(--body); }
.mu { fill: var(--mus); stroke: var(--figline); stroke-width: 1; stroke-linejoin: round; }
.mu.hp { fill: var(--accent); }
.mu.hs { fill: var(--accent); fill-opacity: .45; }
rect.sh { fill: url(#bshade); pointer-events: none; }
/* mannequin */
.mq { fill: var(--mq); }
.mq-far { fill: var(--mq-far); }
.mq-hi { fill: var(--glint); fill-opacity: .13; }
.mq-hl { fill: var(--accent); }
.mq-fl { stroke: var(--mq-floor); stroke-width: 2; }
.mq-sh { fill: var(--ink); opacity: .35; }
.mq-bar { stroke: var(--mq-bar); stroke-width: 5; stroke-linecap: round; }
.mq-post { stroke: var(--mq-floor); stroke-width: 3; }
.mq-bar2 { fill: var(--mq-bar); opacity: .7; }
.mq-wall { fill: var(--mq-wall); }
.mq-wl { stroke: var(--mq-floor); stroke-width: 3; }

.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(var(--tabbar-h) + 18px + env(safe-area-inset-bottom, 0px)); z-index: 90;
  background: var(--surface-3); border: 1px solid var(--line); color: var(--text); padding: 10px 18px; border-radius: 99px; box-shadow: var(--shadow); max-width: calc(100vw - 32px); font-size: 16px; }

@keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
@keyframes sheetUp { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes emblemIn { from { opacity: 0; transform: scale(.3) rotate(-12deg); } to { opacity: 1; transform: none; } }
@keyframes riseIn { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
@keyframes raysSpin { to { transform: rotate(360deg); } }
@keyframes glowPulse { 0%, 100% { opacity: .45; transform: scale(.97); } 50% { opacity: 1; transform: scale(1.04); } }
@keyframes hueShift { to { filter: hue-rotate(360deg); } }
@keyframes spinSlow { to { transform: rotate(360deg); } }
@keyframes drift { 0% { transform: translate(0, 0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translate(var(--dx), var(--dy)); opacity: 0; } }
@keyframes twinkle { 0%, 100% { opacity: .2; } 50% { opacity: 1; } }
@keyframes orbit { to { offset-distance: 100%; } }
@keyframes pop { 0% { transform: scale(.8); } 60% { transform: scale(1.14); } 100% { transform: scale(1); } }
.a-glow { transform-box: fill-box; transform-origin: center; animation: glowPulse 4.8s ease-in-out infinite; }
.a-hue { animation: hueShift 14s linear infinite; }
.a-spin { transform-box: view-box; transform-origin: 100px 100px; animation: spinSlow 60s linear infinite; }
.a-spin-r { transform-box: view-box; transform-origin: 100px 100px; animation: spinSlow 90s linear infinite reverse; }
.a-part { animation: drift var(--dur, 7s) ease-in-out var(--delay, 0s) infinite; }
.a-twinkle { animation: twinkle 3.2s ease-in-out var(--delay, 0s) infinite; }
.a-orbit { offset-rotate: 0deg; animation: orbit 11s linear infinite; }
.cnt.pop { animation: pop .28s ease; }

@media (max-width: 359px) {
  .top { gap: 8px; }
  .top .ibtn { width: 44px; height: 44px; }
  .lvl { gap: 6px; min-height: 44px; padding: 4px 12px 4px 6px; font-size: 17px; min-width: 0; }
  .lvl svg.emblem { width: 26px; height: 26px; }
  .fam .lb { font-size: 26px; }
  .go .nm { font-size: 30px; }
  .ex .nm { font-size: 22px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation: none !important; transition: none !important; scroll-behavior: auto !important; }
  .cine .emb-big, .cine .k, .cine .rn, .cine .skip { opacity: 1; transform: none; }
}

/* ---------- niveau par exercice, programme, seance guidee ---------- */
.rkt { display: inline-block; vertical-align: middle; margin-left: 6px; padding: 1px 9px; border-radius: 99px; font-family: var(--f-display); font-weight: 700; font-size: 14px; letter-spacing: .06em; text-transform: uppercase; color: var(--rc-hi, var(--accent)); border: 1px solid var(--rc, var(--accent)); background: color-mix(in srgb, var(--rc, var(--accent)) 16%, transparent); line-height: 1.5; }
.lvlx { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; padding: 14px; margin: 4px 0 12px; border-radius: 18px; border: 1px solid var(--rc, var(--line)); background: linear-gradient(135deg, color-mix(in srgb, var(--rc, var(--accent)) 18%, var(--surface)), var(--surface)); }
.lvlx .emb { width: 72px; } .lvlx .emb svg { width: 100%; height: auto; }
.lvlx .k, .pobj .k, .pnext .k { color: var(--text-3); font-size: 13.5px; letter-spacing: .08em; text-transform: uppercase; }
.lvlx .v { font-family: var(--f-display); font-size: 25px; text-transform: uppercase; letter-spacing: .03em; margin: 2px 0 6px; }
.lvlx .v b { color: var(--rc-hi, var(--accent)); } .lvlx .v .el { color: var(--text-2); font-size: 18px; }
.lvlx .bar { margin-bottom: 8px; }
.lvlx .s { color: var(--text-2); font-size: 15px; line-height: 1.35; }

  /* ---------- ELO d'une performance ---------- */

  /* ---------- mise a jour de l'ELO d'un exercice (lissage) ---------- */

  /* ---------- categories et ELO global ---------- */
  function computeCats(effMap) {
    const cats = {};
    for (const c of CATS) {
      const need = c === 'skills' ? 2 : 3;
      const list = Object.keys(effMap).filter(id => EX[id] && EX[id].category === c)
        .sort((a, b) => effMap[b] - effMap[a]);
      if (!list.length) { cats[c] = { ranked: false, elo: null, n: 0, need, list: [], incomplete: false }; continue; }

    const measured = ranked.flatMap(c => cats[c].list);

  /* ---------- derivation complete de l'etat ---------- */

  function derive(state, now) {

    const ex = {};

    const g = cg.global == null ? null : cg.global + bonus;

    const rankFromElo = g == null ? null : rankOfElo(g);

    return {

      points, gateOpen, autoBronze, protection: state.protection || 0
    };
  }
  /** Le rang suit la moyenne de tes exercices: rang = rang de l'ELO global (4 familles + bonus de skills). Pas de test de promotion.

    }
    return `<defs><linearGradient id="${u}i" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0" style="stop-color:var(--rk-immortel-a)"/><stop offset=".35" style="stop-color:var(--rk-immortel-b)"/>
        <stop offset=".7" style="stop-color:var(--rk-immortel-c)"/><stop offset="1" style="stop-color:var(--rk-immortel-d)"/></linearGradient></defs>

        <circle cx="100" cy="100" r="96" fill="url(#${u}g)"/>
        <circle cx="100" cy="100" r="86" class="a-spin" style="fill:none;stroke:url(#${u}i);stroke-width:2.5;stroke-dasharray:10 5"/>
        <circle cx="100" cy="100" r="76" class="a-spin-r" style="fill:none;stroke:url(#${u}i);stroke-width:1.5;stroke-dasharray:1 5;stroke-linecap:round"/>

        <circle cx="100" cy="100" r="12" ${S('var(--c1)', 'var(--rk-immortel-b)', 2.5)}/>
        <circle cx="100" cy="100" r="5" style="fill:var(--rk-immortel-hi);opacity:.95" class="a-glow"/>
        ${parts}
      </g>`;

/** Répartition (en %) des muscles travaillés par un exercice, triée du plus au moins sollicité. */
function shareOf(key) {
  const sh = MUSCLE_SHARE[key] || MUSCLE_SHARE[String(key).split(':')[0]];
  if (!sh) return [];
  return Object.keys(sh).map(m => ({ m, pct: sh[m] })).sort((a, b) => b.pct - a.pct);
}

/* ============================================================
   trophies.js : exercices (items), trophees par niveau, logique de niveau,
   questionnaire de depart, profil d'exemple, autotests. Aucun acces au DOM.

   Niveau L = rang L (1 Rookie ... 10 Immortel).
   Trophees du niveau L (L = 2..10) = 8 emplacements (2 Pousser, 2 Tirer, 1 Jambes,
   1 Abdos, 2 Skills). La cible est l'ancre du rang L dans standards.json
   (pour les skills en variantes: la variante dont le rang d'entree est L, 5 s).
   Le niveau 1 n'a pas de trophees: tout le monde commence Rookie.
   ============================================================ */
const Troph = (() => {
  'use strict';
  const RID = Core.RID, EX = Core.EX;
  const L = id => Core.levelOf(id);

  /* ---------- items (exercices affiches) ---------- */
  const ITEMS = {};
  function addItem(key, o) { ITEMS[key] = Object.assign({ key }, o); }
  Object.keys(XI).forEach(k => {
    const x = XI[k], base = EX[k];
    addItem(k, {
      ex: k, variant: null, fam: x.fam, name: x.n || (base && base.name) || k, short: x.s || x.n, p: x.p, s: x.s2 || [],
      st: x.st, er: x.er, hold: !!x.hold || (base && base.measure === 'seconds'), ranked: !!base,
      side: !!x.side || !!(base && base.measure === 'reps_per_side'),
      pose: POSE_OF[k] || x.pose || null, poseNames: x.poseNames || null, u: x.u, unit: base ? base.unit_label : (x.hold ? 's' : 'reps')
    });
  });
  Object.keys(LADDER_XI).forEach(ex => {
    const lx = LADDER_XI[ex], lad = Core.ladderFor(ex);
    lad.variants.forEach(v => {
      const key = ex + ':' + v.variant;
      addItem(key, {
        ex, variant: v.variant, fam: lx.fam, name: LAD_NAME[ex] + ' ' + VAR_SHORT[v.variant], short: LAD_NAME[ex] + ' ' + VAR_SHORT[v.variant],
        p: lx.p, s: lx.s2, st: lx.st.map(t => (t === 'VAR' ? (lx.var2[v.variant] || 'Garde la position, corps gainé.') : t)), er: lx.er,
        hold: true, ranked: true, pose: LADDER_POSE[key] || lx.poseFor[v.variant] || null, u: Math.max(1, L(v.entry_rank) - 1), unit: 's'
      });
    });
  });
  const item = key => ITEMS[key];
  const keyOf = (ex, variant) => (variant ? ex + ':' + variant : ex);

  /* ---------- trophees ---------- */
  /* priorites par emplacement: [exercice, niveau min, niveau max]. Un exercice sans ancre au rang du niveau est saute. */
  const SLOTS = [
    { id: 'push1', cat: 'push', pri: [['pompes_strictes', 2, 4], ['pompes_archer', 5, 5], ['pompes_une_main', 6, 10]] },
    { id: 'push2', cat: 'push', pri: [['dips_strictes', 2, 4], ['handstand_push_up_strict', 5, 10]] },
    { id: 'pull1', cat: 'pull', pri: [['tractions_strictes', 2, 6], ['tractions_archer', 7, 10]] },
    { id: 'pull2', cat: 'pull', pri: [['tractions_supination', 2, 3], ['muscle_up_strict', 4, 10]] },
    { id: 'legs1', cat: 'legs', pri: [['squat_bulgare', 2, 3], ['pistol_squat', 4, 7], ['dragon_squat', 8, 10]] },
    { id: 'core1', cat: 'core', pri: [['releves_de_jambes_tendues_suspendus', 2, 3], ['toes_to_bar_strict', 4, 4], ['l_sit', 5, 5], ['dragon_flag', 6, 7], ['v_sit', 8, 10]] },
    /* les skills ne sont pas des trophées: ils sont conseillés selon ton niveau et rangés dans le dictionnaire (skills.js) */
  ];
  function buildLevel(lv) {
    const rank = RID[lv - 1], out = [], used = new Set();
    for (const slot of SLOTS) {
      for (const [ex, from, to] of slot.pri) {
        if (lv < from || lv > to) continue;
        const base = EX[ex];
        if (!base) continue;
        let variant = null, target;
        if (base.measure === 'variant') {
          const v = Core.ladderFor(ex).variants.find(x => x.entry_rank === rank);
          if (!v) continue;
          variant = v.variant; target = 5;
        } else {
          const a = base.anchors[rank];
          if (typeof a !== 'number') continue;
          target = a;
        }
        const key = keyOf(ex, variant);
        if (used.has(key)) continue;
        used.add(key);
        out.push({ id: 'L' + lv + '-' + slot.id, level: lv, slot: slot.id, cat: slot.cat, ex, variant, key, target, hold: !!ITEMS[key].hold, anchorRank: rank });
        break;
      }
    }
    return out;
  }
  const BY_LEVEL = {};
  for (let lv = 2; lv <= 10; lv++) BY_LEVEL[lv] = buildLevel(lv);
  BY_LEVEL[1] = [];
  const ALL = [].concat(...Object.keys(BY_LEVEL).map(k => BY_LEVEL[k]));
  const BY_ID = {}; ALL.forEach(t => { BY_ID[t.id] = t; });
  const trophiesOf = lv => BY_LEVEL[Math.max(1, Math.min(10, lv))] || [];
  const firstTrophyLevel = {};
  ALL.forEach(t => { if (!(t.key in firstTrophyLevel)) firstTrophyLevel[t.key] = t.level; });

  /* niveau d'ouverture d'un exercice */
  function unlockOf(key) {
    const it = ITEMS[key];
    if (!it) return 1;
    if (it.variant) return it.u;
    if (it.u != null) return it.u;
    if (firstTrophyLevel[key] != null) return Math.max(1, firstTrophyLevel[key] - 1);
    return 1;
  }

  /* ---------- niveau du joueur et trophees ---------- */
  const level = S => Core.levelOf(S.earned);
  const isDone = (S, t) => t.level <= level(S) || !!(S.trophies && S.trophies[t.id]);
  const doneCount = (S, lv) => trophiesOf(lv).filter(t => isDone(S, t)).length;
  const earnable = (S, t) => t.level <= level(S) + 1;
  const targetLevel = S => Math.min(10, level(S) + 1);
  const pending = (S, lv) => trophiesOf(lv).filter(t => !isDone(S, t));

  /** Trophees obtenus par une performance (niveau actuel +1 au plus). */
  function award(S, ex, variant, perf, now) {
    const got = [];
    if (!S.trophies) S.trophies = {};
    for (const t of ALL) {
      if (t.ex !== ex || isDone(S, t) || !earnable(S, t)) continue;
      let ok = false;
      if (t.variant) {
        const lad = Core.ladderFor(ex);
        ok = variant != null && perf >= t.target && Core.variantIndex(lad, variant) >= Core.variantIndex(lad, t.variant);
      } else {
        ok = perf >= t.target - 1e-9;
      }
      if (ok) { S.trophies[t.id] = now; got.push(t); }
    }
    return got;
  }
  /** Monte de niveau tant que tous les trophees du niveau suivant sont obtenus. Retourne {from,to,rank} ou null. */
  function levelUp(S) {
    const from = level(S);
    let lv = from;
    while (lv < 10 && trophiesOf(lv + 1).every(t => S.trophies[t.id] || t.level <= lv)) lv++;
    if (lv === from) return null;
    S.earned = RID[lv - 1];
    S.protection = 3;
    return { from, to: lv, rank: S.earned };
  }

  /* ---------- exercices d'une famille ---------- */
  function familyItems(S, fam, showLocked) {
    const lv = level(S), tl = targetLevel(S);
    const goal = new Set(pending(S, tl).map(t => t.key));
    const all = FAM_ITEMS[fam].filter(k => ITEMS[k]);
    const open = all.filter(k => unlockOf(k) <= lv);
    let shown = open;
    if (open.length > 6) {
      const score = k => (goal.has(k) ? 0 : 100) + (lv - unlockOf(k));
      const pick = open.slice().sort((a, b) => score(a) - score(b)).slice(0, 6);
      shown = open.filter(k => pick.includes(k));
    }
    const locked = showLocked ? all.filter(k => unlockOf(k) > lv).slice(0, 6) : [];
    return { open: shown, locked };
  }
  /** Prochain exercice conseille: un trophee en attente du niveau suivant, en alternant les familles. */
  function suggest(S) {
    const tl = targetLevel(S);
    let list = pending(S, tl);
    if (!list.length) list = trophiesOf(tl);
    if (!list.length) return null;
    const lastFam = S.log && S.log.length ? (ITEMS[S.log[S.log.length - 1].key] || {}).fam : null;
    const order = goalOrder(S);
    /* apres une serie, on passe a la famille suivante dans l'ordre du joueur */
    const pos = f => { const i = order.indexOf(f); return lastFam ? (i - order.indexOf(lastFam) + 5) % 5 || 5 : i; };
    return list.slice().sort((a, b) => pos(a.cat) - pos(b.cat))[0];
  }
  /* ordre des familles proposé selon l'objectif (identifiant: force, masse, skills, endurance, forme) */
  function goalOrder(S) {
    const g = (S.plan && S.plan.goal) || 'force';
    return g === 'skills' ? ['skills', 'pull', 'push', 'core', 'legs'] : g === 'masse' ? ['push', 'legs', 'pull', 'core', 'skills']
      : g === 'force' ? ['pull', 'push', 'legs', 'core', 'skills'] : ['legs', 'core', 'push', 'pull', 'skills'];
  }

  /* ---------- questionnaire de depart ---------- */
  const Q = {
    time: ['Jamais', 'Moins de 6 mois', '6 mois à 2 ans', 'Plus de 2 ans'],
    goals: [
      { id: 'force', l: 'Force', d: 'Devenir plus fort, peu de répétitions' },
      { id: 'masse', l: 'Masse', d: 'Prendre du muscle' },
      { id: 'skills', l: 'Skills', d: 'Handstand, planche, front lever…' },
      { id: 'endurance', l: 'Endurance', d: 'Faire plus de répétitions' },
      { id: 'forme', l: 'Forme', d: 'Être en forme, perdre du gras' }
    ],
    skills: [{ id: 'handstand', l: 'Handstand' }, { id: 'planche', l: 'Planche' }, { id: 'front_lever', l: 'Front lever' }, { id: 'muscle_up', l: 'Muscle-up' }, { id: 'human_flag', l: 'Human flag' }],
    days: [{ l: '2 jours', v: 2 }, { l: '3 jours', v: 3 }, { l: '4 jours', v: 4 }, { l: '5 jours ou plus', v: 5 }],
    dur: [{ l: '20 minutes', v: 20 }, { l: '40 minutes', v: 40 }, { l: '60 minutes', v: 60 }]
  };
  const START_CAP = 3;
  /** niveau le plus haut dont l'ancre est atteinte (1 si aucune ancre atteinte) */
  function levelFromReps(exId, reps) {
    let lv = 1;
    for (let i = 1; i < RID.length; i++) { const a = EX[exId].anchors[RID[i]]; if (typeof a === 'number' && reps >= a) lv = i + 1; }
    return lv;
  }
  /* a.pu et a.pl sont les vrais maximums du joueur (nombres), plus des tranches */
  const clampN = (v, hi) => Math.max(0, Math.min(hi, Math.round(Number(v) || 0)));
  function levelFromAnswers(a) {
    const pu = clampN(a.pu, 300), pl = clampN(a.pl, 80);
    const lvPush = levelFromReps('pompes_strictes', pu), lvPull = levelFromReps('tractions_strictes', pl);
    const raw = Math.min(lvPush, lvPull);
    return { lvPush, lvPull, raw, level: Math.min(raw, START_CAP), capped: raw > START_CAP };
  }
  function startState(a, now) {
    const r = levelFromAnswers(a);
    const S = Core.newFreshState(now);
    const rank = RID[r.level - 1];
    const pu = clampN(a.pu, 300), pl = clampN(a.pl, 80);
    const val = ex => (r.level >= 2 ? Math.ceil(Core.standardFor(ex, rank).value - 1e-9) : 0);
    Core.applyEntry(S, {
      push: { value: pu }, pull: { value: pl },
      legs: { value: 0 }, core: { value: 0 }, skills: { value: 0 }
    }, now);
    S.attempts = S.attempts.filter(x=>x.source !== 'entry' || ['pompes_strictes','tractions_strictes'].includes(x.ex));
    S.earned = rank;
    S.onboarded = true;
    const g = Q.goals[a.goal] || Q.goals[0], sk = g.id === 'skills' ? (Q.skills[a.skill] || Q.skills[0]).id : null;
    const days = (Q.days[a.days] || Q.days[1]).v, dur = (Q.dur[a.dur] || Q.dur[1]).v;
    S.intake = { time: a.time, pu: pu, pl: pl, goal: a.goal, days: a.days, level: r.level, raw: r.raw };
    // le plan de coaching (objectif, skill visé, jours, durée, maximums déclarés) est modifiable ensuite dans l'onglet Programme
    S.plan = { goal: g.id, skill: sk, days: days, dur: dur, maxes: { pu: pu, pl: pl }, hist: {}, sessions: [] };
    return S;
  }
  function firstThings(S) {
    const tl = targetLevel(S);
    const pend = pending(S, tl);
    const order = goalOrder(S), out = [];
    order.forEach(c => { const t = pend.find(x => x.cat === c); if (t) out.push(t); });   // une famille differente a la fois
    return out.slice(0, 3);
  }

  /* ---------- profil d'exemple ---------- */
  const EXAMPLE_ATTEMPTS = [
    ['pompes_strictes', [55, 65, 75, 80, 80, 82]], ['dips_strictes', [30, 36, 40, 42, 44, 44]],
    ['tractions_strictes', [13, 15, 17, 17, 18, 18]], ['squat_bulgare', [30, 34, 38, 38, 40, 40]],
    ['toes_to_bar_strict', [12, 14, 16, 17, 17, 18]], ['handstand_libre', [22, 28, 32, 34, 34, 35]]
  ];
  function exampleState(now) {
    const S = Core.newFreshState(now);
    S.onboarded = true; S.example = true; S.earned = 'argent'; S.seq = 40;
    S.intake = { example: true, level: 3, goal: 0, days: 1 };
    S.plan = { goal: 'force', skill: null, days: 3, dur: 40, maxes: { pu: 80, pl: 18 }, hist: {}, sessions: [] };
    const DAYS = 86400000;
    EXAMPLE_ATTEMPTS.forEach(([ex, perfs], i) => {
      perfs.forEach((p, j) => {
        const ts = now - Math.round((50 - j * 8 - i * 0.5) * DAYS);
        Core.recordAttempt(S, { ex, perf: p, status: 'validated', source: 'ranked' }, ts);
        award(S, ex, null, p, ts);
        S.log.push({ key: ex, ts, perf: p });
      });
    });
    S.protection = 0;
    return S;
  }

  /* ---------- autotests ---------- */
  function listText() {
    return Object.keys(BY_LEVEL).map(Number).sort((a, b) => a - b).map(lv =>
      'N' + lv + ' ' + Core.rName(RID[lv - 1]) + ': ' + BY_LEVEL[lv].map(t => t.key + '=' + t.target).join(' | ')).join('\n');
  }
  function test() {
    const R = [];
    const eq = (name, got, exp) => R.push({ name, got, exp, pass: JSON.stringify(got) === JSON.stringify(exp) });
    const now = Date.UTC(2026, 9, 23, 12);
    for (let lv = 2; lv <= 10; lv++) {
      const list = BY_LEVEL[lv], keys = list.map(t => t.key);
      eq('N' + lv + ': aucun doublon', new Set(keys).size, keys.length);
      eq('N' + lv + ': cibles = ancres du rang ' + RID[lv - 1],
        list.every(t => { const b = EX[t.ex]; return b.measure === 'variant' ? (t.target === 5 && Core.ladderFor(t.ex).variants.find(v => v.variant === t.variant).entry_rank === RID[lv - 1]) : b.anchors[RID[lv - 1]] === t.target; }), true);
      eq('N' + lv + ': 6 trophees (pousser, tirer, jambes, abdos)', list.length, 6);
    }
    eq('N1: pas de trophees', BY_LEVEL[1].length, 0);
    eq('total trophees', ALL.length, Object.keys(BY_LEVEL).reduce((s, k) => s + BY_LEVEL[k].length, 0));
    // questionnaire
    const ans = (pu, pl) => ({ time: 0, pu, pl, goal: 0, days: 1, dur: 1 });
    const lv = (pu, pl) => levelFromAnswers(ans(pu, pl));
    eq('jamais + 5 pompes + 0 traction -> Niveau 1', lv(5, 0).level, 1);
    eq('30 pompes + 12 tractions -> Niveau 2 (ancres Bronze 25 / 8)', lv(30, 12).level, 2);
    eq('50 pompes + 16 tractions -> Niveau 3', [lv(50, 16).raw, lv(50, 16).level, lv(50, 16).capped], [3, 3, false]);
    eq('100 pompes + 16 tractions: brut 4, plafonne a 3', [lv(100, 16).raw, lv(100, 16).level, lv(100, 16).capped], [4, 3, true]);
    eq('100 pompes + 0 traction: on prend le plus bas = 1', lv(100, 0).level, 1);
    eq('70 pompes + 12 tractions -> Niveau 3', lv(70, 12).level, 3);
    let S = startState(ans(30, 12), now);
    eq('plan de depart: objectif, jours, duree, maximums declares', [S.plan.goal, S.plan.days, S.plan.dur, S.plan.maxes.pu, S.plan.maxes.pl], ['force', 3, 40, 30, 12]);
    eq('objectif skills: skill choisi conserve', (() => { const T = startState({ time: 0, pu: 10, pl: 2, goal: 2, skill: 3, days: 0, dur: 0 }, now); return [T.plan.goal, T.plan.skill, T.plan.days, T.plan.dur]; })(), ['skills', 'muscle_up', 2, 20]);
    eq('etat de depart: rang Bronze, ELO global classe', [S.earned, Core.derive(S, now).global != null], ['bronze', true]);
    S = startState(ans(0, 0), now);
    eq('etat de depart Niveau 1: Rookie, 3 premiers trophees proposes', [S.earned, firstThings(S).length], ['rookie', 3]);
    // niveau et trophees
    S = startState(ans(0, 0), now);
    eq('niveau 1: 0/6 trophees du niveau 2', [level(S), doneCount(S, 2)], [1, 0]);
    let got = award(S, 'pompes_strictes', null, 30, now);
    eq('30 pompes: trophee Niveau 2 (25) obtenu, pas celui du Niveau 3 (hors de portee)', [got.map(t => t.id), doneCount(S, 2), doneCount(S, 3)], [['L2-push1'], 1, 0]);
    got = award(S, 'dips_strictes', null, 40, now);
    eq('40 dips: seul le trophee Niveau 2 (15) compte, 25 et 40 sont trop hauts', got.map(t => t.id), ['L2-push2']);
    eq('pas de montee tant que le niveau 2 est incomplet', levelUp(S), null);
    S = startState(ans(0, 0), now);
    BY_LEVEL[2].slice(0, 5).forEach(t => { S.trophies[t.id] = now; });
    eq('5/6 trophees: pas de montee', [doneCount(S, 2), levelUp(S)], [5, null]);
    const last = BY_LEVEL[2][5];
    S.trophies[last.id] = now;
    const up = levelUp(S);
    eq('6/6 trophees du niveau 2 -> niveau 2 (Bronze)', [up && up.to, S.earned, level(S)], [2, 'bronze', 2]);
    eq('apres la montee, 0/6 sur le niveau 3', [doneCount(S, 3), targetLevel(S)], [0, 3]);
    got = award(S, 'pompes_strictes', null, 50, now);
    eq('en avance: 50 pompes (niveau 3) compte pour le niveau suivant et reste valide', [got.map(t => t.id), doneCount(S, 3), !!S.trophies['L3-push1']], [['L3-push1'], 1, true]);
    eq('les trophees du niveau 4 sont hors de portee (niveau actuel + 1 au plus)', award(S, 'pompes_strictes', null, 75, now).length, 0);
    BY_LEVEL[3].forEach(t => { S.trophies[t.id] = now; });
    const up2 = levelUp(S);
    eq('tous les trophees du niveau 3 faits -> niveau 3 (Argent)', [up2 && up2.to, S.earned], [3, 'argent']);
    // montee en cascade si tout le niveau suivant etait deja fait
    S = startState(ans(0, 0), now);
    BY_LEVEL[2].concat(BY_LEVEL[3]).forEach(t => { S.trophies[t.id] = now; });
    eq('niveaux 2 et 3 complets: montee directe au niveau 3', levelUp(S).to, 3);
    // les skills ne sont pas des trophées: ils sont conseillés selon le niveau (voir Coach.skillSuggestions) et rangés dans le dictionnaire
    eq('aucun trophée de la famille skills', ALL.filter(t => t.cat === 'skills').length, 0);
    S = startState(ans(0, 0), now);
    eq('planche tuck 5 s: aucun trophée (les skills sont dans le dictionnaire)', award(S, 'planche', 'tuck', 5, now).length, 0);    // exemple
    const ex = exampleState(now);
    const d = Core.derive(ex, now);
    eq('exemple: Argent, 4/6 objectifs du niveau 4', [ex.earned, doneCount(ex, 4)], ['argent', 4]);
    eq('exemple: porte de promotion ouverte', d.gateOpen, true);
    // niveaux d'ouverture
    eq('ouverture: pompes strictes 1, pistol 3, handstand libre 1, human flag 6', [unlockOf('pompes_strictes'), unlockOf('pistol_squat'), unlockOf('handstand_libre'), unlockOf('human_flag')], [1, 3, 1, 6]);
    return R;
  }

  return { ITEMS, item, keyOf, SLOTS, BY_LEVEL, ALL, BY_ID, trophiesOf, unlockOf, level, isDone, doneCount, earnable, targetLevel, pending, award, levelUp,
    familyItems, suggest, Q, START_CAP, levelFromReps, levelFromAnswers, startState, firstThings, exampleState, listText, test };
})();

  /* ---------- reglages et niveau du joueur ---------- */
  function settings(S) {
    const p = S.plan || {};
    const oldGoals = ['force', 'masse', 'skills', 'forme'];
    const goal = p.goal || (S.intake && oldGoals[S.intake.goal]) || 'forme';
    const goals = ((p.goals && p.goals.length ? p.goals : [goal]).filter((x, i, a) => GOALS[x] && a.indexOf(x) === i)).slice(0, 3);
    if (!goals.length) goals.push('forme');
    return {
      goal: goals[0], goals, adapt: p.adapt || {}, skill: p.skill || null, days: p.days || 3, dur: p.dur || 40, maxes: p.maxes || {},
      intensity: INTENS[p.intensity] ? p.intensity : 'modere', prio: (p.prio || []).filter(g => GROUPS[g] && g !== 'skill').slice(0, 3),
      newbie: !!(S.intake && S.intake.time != null && S.intake.time <= 1)
    };
  }
  /* ELO du joueur dans une famille: meilleur entre ses vraies performances et ses maximums declares (non plafonnes) */
  function catElo(S, D, cat) {
    const c = D.cats && D.cats[cat];
    let e = c && c.ranked ? c.elo : null;
    const m = (S.plan && S.plan.maxes) || {};
    if (cat === 'push' && m.pu > 0) { const d = Core.perfElo('pompes_strictes', m.pu); if (d != null && (e == null || d > e)) e = d; }
    if (cat === 'pull' && m.pl > 0) { const d = Core.perfElo('tractions_strictes', m.pl); if (d != null && (e == null || d > e)) e = d; }
    return e == null ? Core.rStart(S.earned) : e;
  }
  /* le coaching suit le niveau réel (maximum attendu), pas seulement les niveaux d'ouverture du jeu : jusqu'à 2 niveaux d'avance */
  const isOpen = (S, key) => Troph.unlockOf(key) <= Troph.level(S) + 2;
  const REPS_LIKE = { reps: 1, reps_per_side: 1, seconds: 1 };

  /** Maximum attendu (répétitions ou secondes) sur un exercice, au niveau actuel du joueur. null si non estimable. */
  function expectedMax(S, D, key) {
    const it = TI[key];
    if (!it) return null;
    const base = EX[it.ex];
    const declared = S.plan && S.plan.myMax && S.plan.myMax[key];
    if (Number.isFinite(declared) && declared >= 0) return declared;
    const estimated = S.plan && S.plan.estimatedMax && S.plan.estimatedMax[key];
    if (Number.isFinite(estimated) && estimated > 0) return estimated;
    if (!it.ranked || !base) {
      const mine0 = S.plan && S.plan.myMax && S.plan.myMax[key];
      if (Number.isFinite(mine0) && mine0 >= 0) return mine0;
      const r = REL[key];
      if (!r) return null;
      const v = expectedMax(S, D, r[0]);
      return v == null ? null : Math.max(r[2] || 2, v * r[1]);
    }
    if (!REPS_LIKE[base.measure]) return null;
    const mine = S.plan && S.plan.myMax && S.plan.myMax[key];
    if (Number.isFinite(mine) && mine >= 0) return mine;   // le joueur (ou ses séries réussies) a corrigé l'estimation
    if (key === 'pompes_strictes' && S.plan && S.plan.maxes) return Math.max(S.plan.maxes.pu || 0,dictBest(S,D,key));
    if (key === 'tractions_strictes' && S.plan && S.plan.maxes) return Math.max(S.plan.maxes.pl || 0,dictBest(S,D,key));
    const own = D.ex[it.ex];
    if (own && own.pb && own.pb.perf > 0) return own.pb.perf;
    return Math.max(1, Core.perfForElo(base.anchors, catElo(S, D, base.category)));
  }

  function lastKeys(S) {
    const ss = (S.plan && S.plan.sessions) || [];
    const last = ss[ss.length - 1];
    return new Set(last ? last.items.map(i => i.key) : []);
  }

  /* meilleur exercice d'un emplacement pour un objectif */
  function evalCandidate(S, D, key, g, pendingKeys, recent, ad) {
    const it = TI[key];
    if (!it || !isOpen(S, key)) return null;
    const r = expectedMax(S, D, key);
    if (r == null || r < 1) return null;
    const noMods = it.hold || it.fam === 'core' || it.fam === 'skills';
    // un débutant (peu de répétitions possibles) garde un tempo normal : ralentir la descente n'a pas de sens à 3 répétitions
    const tf = r < 10 ? Math.max(g.tf, 0.9) : g.tf;
    const base = r * (it.hold ? 1 : tf);
    // adaptation: quand le joueur trouve ça facile (ad > 0), on vise moins de répétitions possibles, donc une variante ou une difficulté plus dure
    ad = (ad || 0) + exerciseFeedback(S, key, g.id).d;
    const sh = Math.pow(0.88, ad || 0), rT = g.rT * sh, lo = g.win[0] * sh, hi = g.win[1] * sh;
    let best = null;
    for (const combo of (noMods ? [[]] : (COMBOS[g.id] || [[]]))) {
      if (combo.some(m => m.id.startsWith('lest')) && !(S.plan && S.plan.useLoad)) continue;
      if (combo.some(m => m.id === 'lest2' || m.id === 'lest3')) continue;
      const rEff = base * combo.reduce((p, m) => p * m.f, 1);
      const d = Math.abs(Math.log(Math.max(0.5, rEff) / rT)) + 0.18 * combo.length;
      if (!best || d < best.d) best = { key, r, rEff, mods: combo, d };
      if (rEff <= hi && rEff >= lo) break;
    }
    if (best.rEff < lo * 0.5) { best.hard = true; best.d += 1; }   // plus dur que prévu pour ce niveau : seulement en dernier recours
    if (!it.hold && it.fam !== 'core' && best.rEff > g.win[1] * 1.6) best.easy = true;   // même la variante la plus dure du jeu reste facile
    if (pendingKeys.has(key)) best.d -= 0.2;                              // aide à valider un trophée du niveau suivant
    if (recent.has(key)) best.d -= 0.25;                                  // conserver les mouvements pour suivre la progression
    return best;
  }
  function pickSlot(S, D, slotId, g, used, pend, recent, ad) {
    let best = null;
    for (const key of SLOT[slotId] || []) {
      if (used.has(key)) continue;
      const c = evalCandidate(S, D, key, g, pend, recent, ad);
      if (c && (!best || c.d < best.d)) best = c;
    }
    return best;
  }
  /* le m-ième exercice d'un groupe: l'emplacement prévu, sinon un autre emplacement du groupe (jamais un exercice trop dur pour le niveau si on peut l'éviter) */
  function pickForGroup(S, D, gid, m, g, used, pend, recent, ad) {
    const slots = GROUP_SLOTS[gid], order = slots.slice(m).concat(slots.slice(0, m));
    let first = null;
    for (const s of order) {
      const c = pickSlot(S, D, s, g, used, pend, recent, ad);
      if (!c) continue;
      if (!c.hard) return c;
      if (!first) first = c;
    }
    return first;
  }

  /* ---------- explications: repos et vitesse de descente ---------- */
  /** Effet d'un temps de repos entre deux séries. */
  function restInfo(sec) {
    if (sec <= 30) return { t: 'repos très court', e: 'Le cœur reste haut et le muscle brûle : tu travailles l\'endurance musculaire et le souffle, mais tu feras moins de répétitions aux séries suivantes.' };
    if (sec <= 60) return { t: 'repos court', e: 'Un repos court peut servir l’endurance musculaire. Si tes répétitions ou ta technique chutent, repose-toi plus longtemps.' };
    if (sec <= 105) return { t: 'repos moyen', e: 'Bon compromis : assez de récupération pour garder tes répétitions, assez court pour accumuler du volume (prise de masse).' };
    if (sec <= 180) return { t: 'repos long', e: 'Tu récupères presque tout : tu peux donner le maximum à chaque série. C\'est ce qui construit la force.' };
    return { t: 'repos très long', e: 'Récupération complète, pour les séries les plus dures ou les skills : on cherche la force maximale et une technique parfaite.' };
  }
  /** Effet de la vitesse de descente (tempo = { d, p, u }). null pour une tenue. */
  function tempoInfo(t) {
    if (!t) return null;
    const txt = 'Descente ' + t.d + ' s' + (t.p ? ', pause ' + t.p + ' s en bas' : '') + ', montée ' + (t.u ? t.u + ' s' : 'le plus vite possible');
    let e;
    if (t.d <= 1) e = 'Descente rapide : tu peux faire plus de répétitions, mais le muscle reste moins longtemps sous tension. Bon pour l\'endurance.';
    else if (t.d === 2) e = 'Descente contrôlée : le bon réglage pour garder une technique propre et progresser en force.';
    else if (t.d <= 4) e = 'Descente lente : utile pour contrôler le mouvement, mais pas indispensable à la prise de masse. Choisis un rythme reproductible sans réduire inutilement les répétitions.';
    else e = 'Descente très lente : très exigeant pour les muscles et les tendons, à réserver aux exercices que tu maîtrises.';
    if (t.p >= 1) e += ' La pause en bas supprime l\'élan : le muscle fait tout le travail.';
    return { txt, e };
  }

  /* ---------- prescription d'un exercice ---------- */
  const modSig = mods => mods.map(m => m.id).join('+');
  function prescribe(S, D, cand, g, st, I, ad) {
    const it = TI[cand.key];
    const perSide = !!it.side;
    const feedback = exerciseFeedback(S, cand.key, g.id);
    ad = (ad || 0) + feedback.d;
    const sets = Math.max(2, g.sets + I.sets + (ad >= 2 ? 1 : ad <= -2 ? -1 : 0) - (st.newbie ? 1 : 0));
    let target, nSets = sets;
    if (it.hold) {
      target = clamp(Math.round(cand.rEff * (g.id === 'force' ? 0.55 : g.id === 'masse' ? 0.7 : g.id === 'endurance' ? 0.6 : 0.65) * I.k), 5, 90);
      if (g.id === 'endurance') nSets = Math.max(sets, 4);

  /* ---------- skills ---------- */
  function masteredStep(S,key,criterion) {

  const dictBest = (S, D, key) => (typeof Dict !== 'undefined' ? Dict.best(S, D.ex, key) : 0);
  function skillMain(S, D, skillId) {

  /** Bloc skill: la marche travaillée, puis les exercices de progression (négatifs, leans, marche en dessous...). nDrills = combien en ajouter. */

    const mkItem = (key, o) => {
      const it = TI[key], sig = key + (o.tech ? '|tech' : '|skill'), h = historyFor(S, sig, 'skills'), feedback = exerciseFeedback(S, key, 'skills');
      let target = o.target;

        key, name: o.name || it.name, fam: it.fam, hold: o.hold != null ? !!o.hold : !!it.hold, perSide: !!it.side, sets: Math.max(2, o.sets - (st.feel < 0 ? 1 : 0)), target, rest: o.rest, tempo: null, rir: 'jamais jusqu\'à l\'échec', tech: !!o.tech,
        mods: [], notes: o.note ? [o.note] : [], why: o.why, last: h && h.sets.length ? h.sets : null, sig, goal: 'skills', expected: 0, skill: id, group: 'skill', drill: !!o.drill

  }
  /* ---------- seance ---------- */
  const WARM = {
    base: ['Poignets : rotations et flexions, 30 secondes', 'Épaules : grands cercles de bras, 10 dans chaque sens', 'Omoplates : 10 rétractions bras tendus, suspendu ou au sol'],
    push: ['Pompes lentes sur les genoux, 2 séries de 8', 'Planche sur les mains, 2 × 20 secondes'],
    pull: ['Suspension active à la barre, 2 × 15 secondes', 'Tractions faciles ou rowing léger, 2 séries de 5'],
    legs: ['Squats lents sans charge, 2 séries de 10', 'Fentes dynamiques, 2 × 8 par jambe', 'Cercles de hanches, 10 par côté'],
    core: ['Planche sur les avant-bras, 2 × 20 secondes', 'Gainage dynamique : mouvements de jambes allongé, 2 × 10'],
    skills: ['Mobilité des poignets : 1 minute', 'Épaules actives : planche épaules hautes, 2 × 20 secondes', 'Hollow body : 2 × 20 secondes']
  };
  const WARM_OF = { chest: 'push', shoulders: 'push', arms: 'pull', back: 'pull', legs: 'legs', abs: 'core', skill: 'skills' };
  function warmupFor(groups) {
    const list = WARM.base.slice(), seen = new Set();
    groups.forEach(g => {
      const k = WARM_OF[g]; if (!k || seen.has(k)) return; seen.add(k);
      (WARM[k] || []).slice(0, groups.length > 2 ? 1 : 2).forEach(x => list.push(x));
    });
    return list.slice(0, 7);
  }
  function workSeconds(it) {
    if (it.hold) return it.target * (it.perSide ? 2 : 1);
    const t = it.tempo || { d: 2, p: 0, u: 1 };
    return it.target * (t.d + t.p + Math.max(1, t.u) + 0.5) * (it.perSide ? 2 : 1);
  }
  const estimate = items => 5 + items.reduce((s, it) => s + (it.sets * workSeconds(it) + Math.max(0,it.sets-1) * it.rest + 45) / 60, 0);
  const baseCount = m => m <= 20 ? 4 : m <= 30 ? 5 : m <= 40 ? 6 : m <= 50 ? 7 : m <= 60 ? 8 : m <= 75 ? 9 : 10;
  /** Durée conseillée pour travailler ces muscles correctement (en minutes). */

  /* ---------- plusieurs objectifs ---------- */
  const TRAIN_ORDER = ['skills', 'force', 'masse', 'forme', 'endurance'];   // dans une séance: lourd d'abord, endurance à la fin
  /** Répartit les n exercices d'un groupe entre les objectifs (le premier objectif choisi pèse le plus), du plus lourd au plus léger. */
  function goalSeq(goals, n) {
    const k = goals.length, W = k === 1 ? [1] : k === 2 ? [0.6, 0.4] : [0.5, 0.3, 0.2];
    const take = n >= k ? goals.map(() => 1) : goals.map((x, i) => (i < n ? 1 : 0));
    let left = n - take.reduce((a, b) => a + b, 0);
    const fr = goals.map((x, i) => ({ i, f: W[i] * n - take[i] })).sort((a, b) => b.f - a.f);
    for (let j = 0; left > 0 && j < 50; j++, left--) take[fr[j % k].i]++;
    const out = [];
    goals.slice().sort((a, b) => TRAIN_ORDER.indexOf(a) - TRAIN_ORDER.indexOf(b)).forEach(x => { for (let t = 0; t < take[goals.indexOf(x)]; t++) out.push(x); });
    return out;

  /** Que penser de cette combinaison d'objectifs ? Retourne { ok, text }. */

    const out = [];
    if (has('force') && has('endurance')) out.push('Force et endurance musculaire peuvent se combiner : place les séries de force avant les longues séries, ou sur des jours distincts. Ajuste le volume selon ta récupération.');
    if (has('force') && has('masse')) out.push('Force et masse vont très bien ensemble : lourd d\'abord pour la force, puis plus de répétitions pour le muscle.');
    if (has('masse') && has('endurance')) out.push('Masse et endurance musculaire sont compatibles. Garde assez de séries exigeantes pour la masse et adapte les longues séries à la fatigue.');
    if (has('forme') && (has('force') || has('masse'))) out.push('La forme générale complète la musculation avec de la marche, du cardio et de la mobilité. Ici, la séance reste une séance de renforcement.');
    if (has('skills')) out.push('Le skill se travaille frais, donc en premier. Le reste de la séance sera un peu moins fort, car tu arrives avec de la fatigue.');
    if (g.length >= 3) out.push('Trois objectifs en même temps, c\'est possible, mais chacun avance plus lentement : le premier de ta liste passe en priorité.');
    else out.push('Le premier objectif reste prioritaire. La durée disponible détermine la place du second.');
    const bad = g.length >= 3;

  }

  /** Construit une seance pour des muscles. opts: { muscles:[groupes], minutes, goals|goal, intensity, feel } (ou l'ancien { focus }).

        for (const c of cands) { if (items.length - sk.items.length >= want) break; if (used.has(c.key)) continue; used.add(c.key); items.push(Object.assign(prescribe(S, D, c, supG, st, I, 0), { group: 'skill' })); }

    const counts = {};
    const capOf = x => Math.min(GROUP_SLOTS[x].length, (st.newbie ? 2 : ({chest:3,back:3,legs:4,shoulders:2,arms:2,abs:2}[x] || 3)) + (st.prio.includes(x) ? 1 : 0));
    body.forEach(x => { counts[x] = 1; });

    order.forEach(x => { if (left > 0 && st.prio.includes(x) && counts[x] < capOf(x)) { counts[x]++; left--; } });   // muscles préférés: un exercice de plus d'abord
    for (let i = 0, guard = 0; left > 0 && order.length && guard < 300; i++, guard++) {
      const x = order[i % order.length];
      if (counts[x] < capOf(x)) { counts[x]++; left--; }
    }

      const seq = goalSeq(genGoals, counts[x]);
      for (let m = 0; m < counts[x]; m++) {

      const it = items.slice().reverse().find(x => x.sets > minSets);
      if (it) { it.sets -= 1; continue; }

      const gs = Object.keys(cnt).filter(x => cnt[x] > 1).sort((a, b) => cnt[b] - cnt[a] || st.prio.includes(a) - st.prio.includes(b));
